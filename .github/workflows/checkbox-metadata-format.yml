name: One-time Checkbox Metadata Format

on:
  push:
    branches:
      - feat/checkbox-discovery-reference-fixture
    paths:
      - .github/workflows/checkbox-metadata-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/checkbox-discovery-reference-fixture
          fetch-depth: 2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format authority file
        run: pnpm exec prettier apps/website/src/component-catalog/components/Checkbox/metadata.ts --write

      - name: Commit deterministic formatting
        run: |
          rm .github/workflows/checkbox-metadata-format.yml
          git config user.name 'vellira-fixture-reconcile[bot]'
          git config user.email 'vellira-fixture-reconcile[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected a formatting change but found none.'
            exit 1
          fi
          git commit -m 'style(website): format Checkbox discovery metadata'
          git push origin HEAD:feat/checkbox-discovery-reference-fixture
