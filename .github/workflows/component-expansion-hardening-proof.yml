name: Prove Component Expansion Hardening

on:
  push:
    branches:
      - fix/component-expansion-hardening

permissions:
  contents: write

jobs:
  prove-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Recover validated hardening transforms
        shell: bash
        run: |
          set -euo pipefail
          git show 3710b11d496ffcb08288c5ad96d618289e03f702:.github/workflows/component-expansion-hardening-probe.yml > /tmp/original.yml
          git show 76cd58cc78669a5d0778516fb491fa34f2f73e0c:.github/workflows/component-expansion-hardening-final.yml > /tmp/final.yml
          python <<'PY'
          from pathlib import Path

          original = Path('/tmp/original.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format changed files"
          start = original.index(start_marker) + len(start_marker)
          end = original.index(end_marker, start)
          body = original[start:end]
          Path('/tmp/apply-hardening.py').write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          )

          final = Path('/tmp/final.yml').read_text()
          section = "      - name: Apply final structural contracts\n"
          section_start = final.index(section)
          py_start = final.index("          python <<'PY'\n", section_start) + len("          python <<'PY'\n")
          py_end = final.index("\n          PY\n\n      - name: Final format", py_start)
          body = final[py_start:py_end]
          Path('/tmp/final-hardening.py').write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          )
          PY

      - name: Apply and format hardening
        run: |
          python /tmp/apply-hardening.py
          pnpm exec prettier --write \
            packages/metadata/src/components/index.ts \
            scripts/generators/component/write.ts \
            scripts/generators/component/write.test.ts \
            apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentCatalogPreview.tsx \
            apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentsCatalog.module.css \
            apps/website/src/component-catalog/shared/ComponentsCatalog/generatedCatalogPreviews.tsx \
            scripts/generators/component-page/create-component-page.ts \
            scripts/generators/component-page/renderers/registry.ts \
            scripts/generators/component-page/renderers/registry.test.ts \
            scripts/generators/component-page/catalog-preview-contract.test.ts
          python /tmp/final-hardening.py
          pnpm exec prettier --write \
            packages/metadata/src/components/index.ts \
            scripts/generators/component/write.ts \
            scripts/generators/component/write.test.ts \
            apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentCatalogPreview.tsx \
            apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentsCatalog.module.css \
            apps/website/src/component-catalog/shared/ComponentsCatalog/generatedCatalogPreviews.tsx \
            scripts/generators/component-page/create-component-page.ts \
            scripts/generators/component-page/renderers/registry.ts \
            scripts/generators/component-page/renderers/registry.test.ts \
            scripts/generators/component-page/catalog-preview-contract.test.ts

      - name: Focused contract validation
        run: |
          pnpm exec vitest run --config vitest.tooling.config.ts \
            scripts/generators/component/write.test.ts \
            scripts/generators/component-page/renderers/registry.test.ts \
            scripts/generators/component-page/catalog-preview-contract.test.ts
          pnpm check:public-api

      - name: Build tooling dist-fallback prerequisites
        run: >-
          pnpm exec turbo run build
          --filter=@vellira-ui/react
          --filter=@vellira-ui/react-native
          --filter=@vellira-ui/icons

      - name: Typecheck and diff proof
        run: |
          pnpm typecheck:tooling
          git diff --check

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/metadata/src/components/index.ts \
            scripts/generators/component/write.ts \
            scripts/generators/component/write.test.ts \
            apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentCatalogPreview.tsx \
            apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentsCatalog.module.css \
            apps/website/src/component-catalog/shared/ComponentsCatalog/generatedCatalogPreviews.tsx \
            scripts/generators/component-page/create-component-page.ts \
            scripts/generators/component-page/renderers/registry.ts \
            scripts/generators/component-page/renderers/registry.test.ts \
            scripts/generators/component-page/catalog-preview-contract.test.ts
          git diff --cached --check
          git commit -m 'fix(generator): harden component expansion contracts'
          git push origin HEAD:fix/component-expansion-hardening
