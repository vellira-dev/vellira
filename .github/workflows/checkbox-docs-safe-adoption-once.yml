name: One-shot Checkbox legacy docs adoption proof
on:
  push:
    branches:
      - feat/docs-checkbox-safe-adoption-20261014
permissions:
  contents: write
jobs:
  proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format migration sources
        run: |
          pnpm exec prettier apps/docs/src/component-docs/Checkbox.docs.ts apps/docs/src/component-docs/index.ts scripts/generators/component-docs/adopt-legacy-docs.ts scripts/generators/component-docs/adopt-legacy-docs.test.ts --write
          pnpm format:check
      - name: Prove isolated dry-run and no-write tests
        run: |
          pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component-docs/adopt-legacy-docs.test.ts
          pnpm build
          pnpm typecheck:tooling
      - name: Preview and pin original SHA-256 receipts
        run: |
          pnpm component-docs:adopt Checkbox --dry-run --json
          printf '%s  %s\n' '5b59993e51e73624b93ab8c130e478b70d3e991e18cc44707afa6a60742fb05c' apps/docs/src/react/checkbox.md 'cb0d21d2360695a6f5cd3691c85885d3733fd6a269d1060ac59fd61e7a8694d8' apps/docs/src/react-native/checkbox.md | sha256sum --check
          echo "REACT_SHA=5b59993e51e73624b93ab8c130e478b70d3e991e18cc44707afa6a60742fb05c" >> "$GITHUB_ENV"
          echo "NATIVE_SHA=cb0d21d2360695a6f5cd3691c85885d3733fd6a269d1060ac59fd61e7a8694d8" >> "$GITHUB_ENV"
      - name: Adopt both platforms and confirm deterministic rerun
        run: |
          pnpm component-docs:adopt Checkbox --write --json "--expected-react-sha256=$REACT_SHA" "--expected-react-native-sha256=$NATIVE_SHA"
          pnpm component-docs:generate Checkbox --check
          pnpm component-docs:adopt Checkbox --dry-run --json
          pnpm component-docs:adoption-audit Checkbox --json
          pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component-docs
      - name: Strict changed-file fence and self-remove
        run: |
          rm .github/workflows/checkbox-docs-safe-adoption-once.yml
          while IFS= read -r file; do
            case "$file" in
              apps/docs/src/component-docs/Checkbox.docs.ts|apps/docs/src/component-docs/index.ts|apps/docs/src/react/checkbox.md|apps/docs/src/react-native/checkbox.md|scripts/generators/component-docs/adopt-legacy-docs.ts|scripts/generators/component-docs/adopt-legacy-docs.test.ts|package.json|.github/workflows/checkbox-docs-safe-adoption-once.yml) ;;
              *) echo "::error::Unexpected modified file: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m "docs(checkbox): safely adopt both legacy pages with preservation proof"
          git push origin HEAD:feat/docs-checkbox-safe-adoption-20261014
