name: One-time Forge and FTP lock proof (diagnostic)
on:
  push:
    branches:
      - diagnostic/forge-ftp-lock-20261115
permissions:
  contents: write
jobs:
  lock:
    if: "!contains(github.event.head_commit.message, 'security lock proof generated')"
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
      - name: Compute exact lock without package lifecycle scripts
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --lockfile-only --ignore-scripts --frozen-lockfile
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const lock = fs.readFileSync('pnpm-lock.yaml','utf8');
          const workspace = fs.readFileSync('pnpm-workspace.yaml','utf8');
          assert.ok(workspace.includes("node-forge: 1.4.3"));
          assert.ok(workspace.includes("'get-uri@6.0.5>basic-ftp': 6.2.4"));
          assert.ok(lock.includes('  node-forge@1.4.3:'));
          assert.ok(lock.includes('  basic-ftp@6.2.4:'));
          assert.ok(!lock.includes('  node-forge@1.4.2:'));
          assert.ok(!lock.includes('  basic-ftp@6.2.1:'));
          console.log('PASS: exact safe Forge 1.4.3, FTP 6.2.4; vulnerable package definitions absent');
          NODE
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(diagnostic): security lock proof generated'
          git push origin HEAD:diagnostic/forge-ftp-lock-20261115
