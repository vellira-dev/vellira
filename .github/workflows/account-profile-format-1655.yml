# Temporary branch-scoped formatter for PR #1655. Remove after use.
name: Account Profile Canonical Formatter
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/account-profile-format-1655.yml'
      - 'apps/website/src/product-app/AccountProfilePanel.tsx'
      - 'apps/website/src/product-app/AccountSettings.tsx'
      - 'apps/website/src/product-app/api.ts'

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.repository == 'vellira-dev/vellira' && github.event.pull_request.number == 1655 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/account-profile-spacious-v1-20261014' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - name: Write canonical Prettier output for three changed files
        run: |
          pnpm exec prettier --write apps/website/src/product-app/AccountProfilePanel.tsx apps/website/src/product-app/AccountSettings.tsx apps/website/src/product-app/api.ts
          pnpm exec prettier --check apps/website/src/product-app/AccountProfilePanel.tsx apps/website/src/product-app/AccountSettings.tsx apps/website/src/product-app/api.ts
          git diff --check
      - name: Commit only approved formatting to PR #1655
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "vellira-dev/vellira"
          test "${{ github.event.pull_request.number }}" = "1655"
          test "${{ github.event.pull_request.head.ref }}" = "feat/account-profile-spacious-v1-20261014"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/website/src/product-app/AccountProfilePanel.tsx apps/website/src/product-app/AccountSettings.tsx apps/website/src/product-app/api.ts
          if git diff --cached --quiet; then
            echo 'Formatting already canonical'
          else
            git commit -m "style(account): apply canonical Prettier formatting"
            git push origin HEAD:refs/heads/feat/account-profile-spacious-v1-20261014
          fi
