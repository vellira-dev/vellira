name: Docs ownership format probe 1654

on:
  push:
    branches:
      - fix/component-docs-safe-legacy-adoption-20261014
    paths:
      - .github/workflows/docs-ownership-format-probe-1654.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
      - name: Install format tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Inspect exact Prettier patch
        run: |
          pnpm exec prettier --write scripts/generators/component-docs/legacy-adoption.ts scripts/generators/component-docs/legacy-adoption.test.ts scripts/generators/component-docs/generate-component-docs.test.ts
          echo '===BEGIN_DOCS_OWNERSHIP_DIFF==='
          git diff -- scripts/generators/component-docs/legacy-adoption.ts scripts/generators/component-docs/legacy-adoption.test.ts scripts/generators/component-docs/generate-component-docs.test.ts
          echo '===END_DOCS_OWNERSHIP_DIFF==='
