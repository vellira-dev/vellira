# Temporary branch-only workflow. Generates lockfile using normal pnpm policy,
# proves the installed versions, then deletes itself before committing.
name: Temporary Next.js and sharp security resolution

on:
  push:
    branches:
      - security/next-16-4-2-sharp-20261023

permissions:
  contents: write

jobs:
  resolve:
    if: github.repository == 'vellira-dev/vellira' && github.ref == 'refs/heads/security/next-16-4-2-sharp-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Setup pnpm from repository packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org

      - name: Resolve from registry with unchanged supply-chain gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./apps/website/package.json').dependencies.next")" = "16.4.2"
          grep -Fx 'allowUnusedPatches: false' pnpm-workspace.yaml
          grep -Fx '  sharp: 0.35.5' pnpm-workspace.yaml
          grep -Fx '  next@16.4.2: patches/next@16.4.2.patch' pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Prove patched Next uses safe sharp version and no-store router fetch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.dirname(require.resolve('next/package.json', {paths: [path.resolve('apps/website')]}));
          const pkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
          if (pkg.version !== '16.4.2') throw new Error('Unexpected Next version: ' + pkg.version);
          const sharpRoot = path.dirname(require.resolve('sharp/package.json', {paths: [root]}));
          const sharp = JSON.parse(fs.readFileSync(path.join(sharpRoot, 'package.json'), 'utf8'));
          if (sharp.version !== '0.35.5') throw new Error('Unsafe sharp resolved from Next: ' + sharp.version);
          for (const rel of [
            'dist/client/components/router-reducer/fetch-server-response.js',
            'dist/esm/client/components/router-reducer/fetch-server-response.js',
          ]) {
            const src = fs.readFileSync(path.join(root, rel), 'utf8');
            if (!/const fetchOptions = \{\s*cache: 'no-store',/.test(src)) {
              throw new Error('Missing required client no-store patch in ' + rel);
            }
          }
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          if (!lock.includes('next@16.4.2(patch_hash=') || !lock.includes('sharp: 0.35.5(')) {
            throw new Error('Lockfile does not preserve patched Next and safe sharp');
          }
          console.log('PASS: Next 16.4.2, sharp 0.35.5, router CJS/ESM no-store, frozen resolution.');
          NODE

      - name: Save reviewable resolved dependency evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: next-16-4-2-sharp-0-35-5-final-lock
          path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
            patches/next@16.4.2.patch
          if-no-files-found: error
          retention-days: 14

      - name: Self-remove temporary privileged workflow and commit lock only
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-next-sharp-lockfile.yml
          git add pnpm-lock.yaml pnpm-workspace.yaml
          node <<'NODE'
          const cp = require('node:child_process');
          const files = cp.execFileSync('git', ['diff', '--cached', '--name-only'], {encoding: 'utf8'})
            .trim().split('\n').filter(Boolean);
          const allow = new Set(['pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/temporary-next-sharp-lockfile.yml']);
          for (const file of files) {
            if (!allow.has(file)) throw new Error('Unexpected staged file: ' + file);
          }
          for (const required of ['pnpm-lock.yaml', '.github/workflows/temporary-next-sharp-lockfile.yml']) {
            if (!files.includes(required)) throw new Error('Missing staged file: ' + required);
          }
          console.log('One-time workflow removed; lockfile is the only required dependency output.');
          NODE
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): resolve Next 16.4.2 with patched sharp 0.35.5'
          git push origin HEAD:refs/heads/security/next-16-4-2-sharp-20261023
