name: Discovery batch exact generation proof

on:
  push:
    branches:
      - feat/discovery-switch-formfield-batch-20261014
    paths:
      - .github/workflows/discovery-switch-formfield-proof-20261014.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Exact source formatting and generator projection
        run: |
          pnpm exec prettier --write apps/website/src/component-catalog/components/Switch/metadata.ts apps/website/src/component-catalog/components/FormField/metadata.ts scripts/seo/component-discovery-contract.ts scripts/seo/component-discovery-contract.test.ts
          echo '===BEGIN_BATCH_PRETTIER_DIFF==='
          git diff -- apps/website/src/component-catalog/components/Switch/metadata.ts apps/website/src/component-catalog/components/FormField/metadata.ts scripts/seo/component-discovery-contract.ts scripts/seo/component-discovery-contract.test.ts
          echo '===END_BATCH_PRETTIER_DIFF==='
          pnpm create:component-page Switch --force
          pnpm create:component-page FormField --force
          echo '===BEGIN_BATCH_GENERATED_DIFF==='
          git diff -- apps/website/src/component-catalog/registry apps/website/src/component-catalog/components/Switch apps/website/src/component-catalog/components/FormField
          echo '===END_BATCH_GENERATED_DIFF==='
          pnpm create:component-page Switch --force --check --json
          pnpm create:component-page FormField --force --check --json
          pnpm check:component-discovery
          echo '===BEGIN_BATCH_STATUS==='
          git status --short
          echo '===END_BATCH_STATUS==='
