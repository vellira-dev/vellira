name: Temporary basic-ftp lock refresh

on:
  push:
    branches:
      - fix/scorecard-basic-ftp-ghsa

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/scorecard-basic-ftp-ghsa
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Verify patched dependency graph
        shell: bash
        run: |
          set -euo pipefail
          grep -q "basic-ftp@6.2.1" pnpm-lock.yaml
          ! grep -q "basic-ftp@5.3.1" pnpm-lock.yaml
          pnpm install --frozen-lockfile
          pnpm exec lhci --version

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(security): refresh lockfile for basic-ftp override"
          git push origin HEAD:fix/scorecard-basic-ftp-ghsa
