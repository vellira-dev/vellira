name: Temporary optional undefined proof 1294

on:
  push:
    branches:
      - tmp/api-doc-undefined-proof-1294

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check scripts/generate-api-docs.ts scripts/generate-api-docs.silent.test.ts
      - run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generate-api-docs.silent.test.ts
      - run: pnpm docs:api:check
      - run: pnpm component-docs:check
