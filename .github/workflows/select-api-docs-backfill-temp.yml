name: Select API docs backfill (temporary)
on:
  push:
    branches:
      - feat/docs-select-safe-adoption-20261015
    paths:
      - .github/workflows/select-api-docs-backfill-temp.yml
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate canonical API docs and format
        run: |
          pnpm docs:api
          pnpm exec prettier --write apps/docs/src/component-docs/Select.docs.ts scripts/generate-api-docs.ts packages/react/API.md packages/react-native/API.md
          pnpm docs:api:check
      - name: Remove temporary workflow and commit outputs
        run: |
          rm .github/workflows/select-api-docs-backfill-temp.yml
          git config user.name 'vellira-docs-sync[bot]'
          git config user.email 'vellira-docs-sync[bot]@users.noreply.github.com'
          git add -A -- apps/docs/src/component-docs/Select.docs.ts scripts/generate-api-docs.ts packages/react/API.md packages/react-native/API.md .github/workflows/select-api-docs-backfill-temp.yml
          git diff --cached --quiet || git commit -m 'docs(api): generate and verify Select compound API tables'
          git push origin HEAD:feat/docs-select-safe-adoption-20261015
