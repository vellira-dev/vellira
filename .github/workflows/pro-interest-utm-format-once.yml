# Temporary branch-scoped Prettier maintenance. This workflow deletes itself.
name: One-shot Pro UTM Prettier

on:
  push:
    branches:
      - feat/pro-interest-utm-free-plan-20261015
    paths:
      - .github/workflows/pro-interest-utm-format-once.yml

permissions:
  contents: write

concurrency:
  group: pro-interest-utm-format-once
  cancel-in-progress: false

jobs:
  format:
    if: github.ref == 'refs/heads/feat/pro-interest-utm-free-plan-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/pro-interest-utm-free-plan-20261015
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: Install locked formatter without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Format changed Markdown and TSX only
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/website/PRO_INTEREST_ROLLOUT.md \
            'apps/website/src/app/(marketing)/(site)/privacy/page.tsx'

      - name: Commit formatted content and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pro-interest-utm-format-once.yml
          git add -- \
            apps/website/PRO_INTEREST_ROLLOUT.md \
            'apps/website/src/app/(marketing)/(site)/privacy/page.tsx'
          git add -u -- .github/workflows/pro-interest-utm-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m "style(pro): format Buttondown UTM rollout"
            git push origin HEAD:refs/heads/feat/pro-interest-utm-free-plan-20261015
          fi
