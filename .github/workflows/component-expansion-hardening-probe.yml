name: Component Expansion Hardening Probe

on:
  push:
    branches:
      - fix/component-expansion-hardening

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply bounded expansion hardening
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, content: str) -> None:
              Path(path).write_text(content)

          def replace_once(content: str, old: str, new: str, label: str) -> str:
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return content.replace(old, new, 1)

          # #758 — make metadata named exports part of the deterministic contract.
          metadata_path = 'packages/metadata/src/components/index.ts'
          metadata = read(metadata_path)
          match = re.search(
              r"export \{\n(?P<body>.*?)\n\};\n\nexport const componentMetadata",
              metadata,
              re.S,
          )
          if not match:
              raise RuntimeError('metadata export block not found')
          names = [
              line.strip().removesuffix(',')
              for line in match.group('body').splitlines()
              if line.strip()
          ]
          names = sorted(set(names) | {'accordionMetadata', 'switchMetadata'})
          export_block = 'export {\n' + ''.join(f'  {name},\n' for name in names) + '};\n\nexport const componentMetadata'
          metadata = metadata[:match.start()] + export_block + metadata[match.end():]
          write(metadata_path, metadata)

          write_path = 'scripts/generators/component/write.ts'
          source = read(write_path)

          metadata_helper = r'''function synchronizeMetadataNamedExport(
            content: string,
            metadataName: string
          ): string {
            const exportMatch = content.match(/export \{\n([\s\S]*?)\n\};/);

            if (!exportMatch || exportMatch.index === undefined) {
              const registryMarker = 'export const componentMetadata = [';

              if (!content.includes(registryMarker)) {
                throw new Error('Missing component metadata export/registry authority.');
              }

              return content.replace(
                registryMarker,
                `export {\n  ${metadataName},\n};\n\n${registryMarker}`
              );
            }

            const names = exportMatch[1]
              .split('\n')
              .map((line) => line.trim().replace(/,$/, ''))
              .filter(Boolean);

            if (names.some((name) => !/^[A-Za-z_$][\w$]*$/.test(name))) {
              throw new Error('Metadata named-export block is not in canonical form.');
            }

            const nextNames = [...new Set([...names, metadataName])].sort();
            const nextBlock = `export {\n${nextNames
              .map((name) => `  ${name},`)
              .join('\n')}\n};`;

            return (
              content.slice(0, exportMatch.index) +
              nextBlock +
              content.slice(exportMatch.index + exportMatch[0].length)
            );
          }

          '''
          source = replace_once(
              source,
              'function registerMetadata(params: {',
              metadata_helper + 'function registerMetadata(params: {',
              'insert metadata export helper',
          )
          source = replace_once(
              source,
              "  if (!content.includes(importLine)) {\n    content = insertSortedNamedImport(content, importLine);\n  }\n\n  const registryMarker = 'export const componentMetadata = [';",
              "  if (!content.includes(importLine)) {\n    content = insertSortedNamedImport(content, importLine);\n  }\n\n  content = synchronizeMetadataNamedExport(content, metadataName);\n\n  const registryMarker = 'export const componentMetadata = [';",
              'wire metadata named exports',
          )

          # #780 — keep the independent strict full-symbol checker, but make it
          # a deterministic Generator V2 consequence instead of a manual repair.
          strict_helper = r'''function synchronizeStrictPublicApiContract(params: {
            plan: ComponentGenerationPlan;
            target: ComponentGenerationTarget;
            updatedFiles: string[];
          }) {
            const { plan, target, updatedFiles } = params;
            const contractFile = path.join(plan.root, 'scripts', 'check-public-api.mjs');

            if (!fs.existsSync(contractFile)) {
              throw new Error(`Missing strict public API contract: ${contractFile}`);
            }

            const sourcePath = path
              .relative(plan.root, target.packageBarrelFile)
              .split(path.sep)
              .join('/');
            const marker = `  '${sourcePath}': [`;
            const content = fs.readFileSync(contractFile, 'utf8');
            const contractStart = content.indexOf(marker);

            if (contractStart === -1) {
              throw new Error(`Missing strict public API entry for ${sourcePath}`);
            }

            const contractEnd = content.indexOf('\n  ],', contractStart);

            if (contractEnd === -1) {
              throw new Error(`Invalid strict public API entry for ${sourcePath}`);
            }

            const contractBody = content.slice(contractStart, contractEnd);
            const requiredSymbols = [
              plan.componentName,
              ...getGeneratedPublicPropTypeNames(plan),
            ];
            const missingSymbols = requiredSymbols.filter(
              (symbol) => !contractBody.includes(`    '${symbol}',`)
            );

            if (missingSymbols.length === 0) {
              return;
            }

            const insertion = missingSymbols
              .map((symbol) => `    '${symbol}',`)
              .join('\n');
            const nextContent =
              content.slice(0, contractEnd) +
              `\n${insertion}` +
              content.slice(contractEnd);

            fs.writeFileSync(contractFile, nextContent);

            if (!updatedFiles.includes(contractFile)) {
              updatedFiles.push(contractFile);
            }
          }

          '''
          source = replace_once(
              source,
              'function registerPackageRootExports(params: {',
              strict_helper + 'function registerPackageRootExports(params: {',
              'insert strict public api sync helper',
          )
          source = replace_once(
              source,
              "  synchronizePublicApiContract({\n    componentName: plan.componentName,\n    publicApiTestFile: target.publicApiTestFile,\n    updatedFiles: result.updatedFiles,\n  });\n}",
              "  synchronizePublicApiContract({\n    componentName: plan.componentName,\n    publicApiTestFile: target.publicApiTestFile,\n    updatedFiles: result.updatedFiles,\n  });\n\n  synchronizeStrictPublicApiContract({\n    plan,\n    target,\n    updatedFiles: result.updatedFiles,\n  });\n}",
              'wire strict public api sync',
          )
          write(write_path, source)

          test_path = 'scripts/generators/component/write.test.ts'
          test_source = read(test_path)
          test_source = replace_once(
              test_source,
              "    `export const componentMetadata = [\n] as const;\n`",
              "    `export {\n  buttonMetadata,\n};\n\nexport const componentMetadata = [\n] as const;\n`",
              'metadata fixture export block',
          )
          docs_marker = "  const docsContractDir = path.join(\n"
          strict_fixture = r'''  const scriptsDir = path.join(root, 'scripts');

            fs.mkdirSync(scriptsDir, { recursive: true });
            fs.writeFileSync(
              path.join(scriptsDir, 'check-public-api.mjs'),
              `const publicSymbolContracts = {
            'packages/react-native/src/index.ts': [
              'Button',
            ],
            'packages/react/src/index.ts': [
              'Button',
            ],
          };
          `
            );

          '''
          test_source = replace_once(
              test_source,
              docs_marker,
              strict_fixture + docs_marker,
              'strict api fixture',
          )
          test_source = replace_once(
              test_source,
              "    expect(metadataBarrel.match(/ {2}avatarMetadata,/g)).toHaveLength(1);",
              "    expect(metadataBarrel.match(/ {2}avatarMetadata,/g)).toHaveLength(2);\n    expect(metadataBarrel).toMatch(/export \\{[\\s\\S]*avatarMetadata,[\\s\\S]*\\};/);\n\n    const strictPublicApi = fs.readFileSync(\n      path.join(root, 'scripts/check-public-api.mjs'),\n      'utf8'\n    );\n\n    expect(strictPublicApi.match(/    'Avatar',/g)).toHaveLength(2);\n    expect(strictPublicApi.match(/    'AvatarProps',/g)).toHaveLength(2);",
              'writer contract assertions',
          )
          write(test_path, test_source)

          # #772 — no catalog component may silently render an empty preview.
          preview_path = 'apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentCatalogPreview.tsx'
          preview = read(preview_path)
          preview = replace_once(
              preview,
              "'use client';\n\n",
              "'use client';\n\nimport { Suspense } from 'react';\n\n",
              'preview suspense import',
          )
          preview = replace_once(
              preview,
              "import styles from './ComponentsCatalog.module.css';",
              "import styles from './ComponentsCatalog.module.css';\nimport { generatedCatalogPreviews } from './generatedCatalogPreviews';",
              'preview fallback import',
          )
          preview = replace_once(
              preview,
              "    default:\n      return null;",
              "    default:\n      return <GeneratedCatalogPreview slug={slug} />;",
              'remove silent null preview',
          )
          fallback_component = r'''
          function GeneratedCatalogPreview({ slug }: { slug: string }) {
            const Preview = generatedCatalogPreviews[slug];

            if (!Preview) {
              throw new Error(`Missing component catalog preview for "${slug}".`);
            }

            return (
              <Suspense fallback={<span className={styles.previewHelper}>Loading preview…</span>}>
                <div className={styles.generatedPreview}>
                  <Preview />
                </div>
              </Suspense>
            );
          }

          '''
          preview = replace_once(
              preview,
              'function AccordionPreview() {',
              fallback_component + 'function AccordionPreview() {',
              'insert generated preview fallback',
          )
          write(preview_path, preview)

          fallback_path = 'apps/website/src/component-catalog/shared/ComponentsCatalog/generatedCatalogPreviews.tsx'
          write(
              fallback_path,
              """'use client';

          import { lazy, type ComponentType, type LazyExoticComponent } from 'react';

          export const generatedCatalogPreviews: Partial<
            Record<string, LazyExoticComponent<ComponentType>>
          > = {
            // component-catalog-preview-entries
          };
          """,
          )

          css_path = 'apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentsCatalog.module.css'
          css = read(css_path)
          if '.generatedPreview {' not in css:
              css += """

          .generatedPreview {
            width: 100%;
            max-height: 9rem;
            overflow: hidden;
          }
          """
          write(css_path, css)

          create_page_path = 'scripts/generators/component-page/create-component-page.ts'
          create_page = read(create_page_path)
          create_page = replace_once(
              create_page,
              "const velliraApiSourceRoots = getVelliraApiSourceRoots(root);",
              "const catalogPreviewFile = path.join(\n  catalogRoot,\n  'shared',\n  'ComponentsCatalog',\n  'ComponentCatalogPreview.tsx'\n);\nconst catalogPreviewFallbackFile = path.join(\n  catalogRoot,\n  'shared',\n  'ComponentsCatalog',\n  'generatedCatalogPreviews.tsx'\n);\n\nconst velliraApiSourceRoots = getVelliraApiSourceRoots(root);",
              'catalog preview paths',
          )
          create_page = replace_once(
              create_page,
              'const registryFiles = [catalogRegistryFile, componentsRegistryFile];',
              'const registryFiles = [\n  catalogRegistryFile,\n  componentsRegistryFile,\n  catalogPreviewFallbackFile,\n];',
              'preview registry formatting ownership',
          )
          create_page = replace_once(
              create_page,
              "  componentsRegistryFile,\n  catalogCategory,\n  model: generatedPageModel,",
              "  componentsRegistryFile,\n  catalogPreviewFile,\n  catalogPreviewFallbackFile,\n  catalogCategory,\n  model: generatedPageModel,",
              'preview registry update args',
          )
          write(create_page_path, create_page)

          registry_path = 'scripts/generators/component-page/renderers/registry.ts'
          registry = read(registry_path)
          preview_registry_helper = r'''export async function updateCatalogPreviewFallback(params: {
            root: string;
            check: boolean;
            checkFailures: string[];
            catalogPreviewFile: string;
            catalogPreviewFallbackFile: string;
            model: GeneratedPageModel;
          }) {
            const {
              root,
              check,
              checkFailures,
              catalogPreviewFile,
              catalogPreviewFallbackFile,
              model,
            } = params;
            const curatedSource = fs.readFileSync(catalogPreviewFile, 'utf8');
            const curatedCase = `case '${model.slug}':`;

            if (curatedSource.includes(curatedCase)) {
              console.log(`⏭ Skipped generated catalog preview: curated ${model.slug}`);
              return;
            }

            if (!model.platforms.includes('react')) {
              throw new Error(
                `Component ${model.componentName} requires a curated Web catalog preview because it has no React demo.`
              );
            }

            const source = fs.readFileSync(catalogPreviewFallbackFile, 'utf8');
            const marker = '// component-catalog-preview-entries';
            const entryMarker = `'${model.slug}': lazy(`;

            if (source.includes(entryMarker)) {
              console.log(`⏭ Skipped generated catalog preview: ${model.slug}`);
              return;
            }

            if (!source.includes(marker)) {
              throw new Error(
                `Catalog preview marker not found in ${catalogPreviewFallbackFile}`
              );
            }

            const entry = `  '${model.slug}': lazy(() =>\n    import('../../components/${model.componentName}').then(\n      ({ ${model.componentName}Demo }) => ({ default: ${model.componentName}Demo })\n    )\n  ),`;
            const nextSource = source.replace(marker, `${marker}\n${entry}`);
            const formattedNextSource = await formatGeneratedContent(
              catalogPreviewFallbackFile,
              nextSource
            );

            if (check) {
              if (formattedNextSource !== source) {
                checkFailures.push(
                  path.relative(root, catalogPreviewFallbackFile)
                );
              }

              return;
            }

            fs.writeFileSync(catalogPreviewFallbackFile, formattedNextSource);
            console.log(
              `✅ Updated: ${path.relative(root, catalogPreviewFallbackFile)}`
            );
          }

          '''
          registry = replace_once(
              registry,
              'export async function updateComponentRegistry(params: {',
              preview_registry_helper + 'export async function updateComponentRegistry(params: {',
              'insert catalog preview fallback updater',
          )
          registry = replace_once(
              registry,
              "  componentsRegistryFile: string;\n  catalogCategory: CatalogCategory;",
              "  componentsRegistryFile: string;\n  catalogPreviewFile: string;\n  catalogPreviewFallbackFile: string;\n  catalogCategory: CatalogCategory;",
              'preview updater param types',
          )
          registry = replace_once(
              registry,
              "    componentsRegistryFile,\n    catalogCategory,\n    model,",
              "    componentsRegistryFile,\n    catalogPreviewFile,\n    catalogPreviewFallbackFile,\n    catalogCategory,\n    model,",
              'preview updater destructuring',
          )
          registry = replace_once(
              registry,
              "  await updateCatalogRegistry({\n    root,\n    force,\n    check,\n    checkFailures,\n    componentsRegistryFile,\n    model,\n    catalogCategory,\n  });\n}",
              "  await updateCatalogRegistry({\n    root,\n    force,\n    check,\n    checkFailures,\n    componentsRegistryFile,\n    model,\n    catalogCategory,\n  });\n\n  await updateCatalogPreviewFallback({\n    root,\n    check,\n    checkFailures,\n    catalogPreviewFile,\n    catalogPreviewFallbackFile,\n    model,\n  });\n}",
              'wire catalog preview fallback update',
          )
          write(registry_path, registry)

          registry_test_path = 'scripts/generators/component-page/renderers/registry.test.ts'
          registry_test = read(registry_test_path)
          registry_test = replace_once(
              registry_test,
              "import { updateCatalogRegistry } from './registry';",
              "import {\n  updateCatalogPreviewFallback,\n  updateCatalogRegistry,\n} from './registry';",
              'registry test imports',
          )
          registry_test += r'''

          describe('component catalog preview registration', async () => {
            it('adds one generated React demo fallback when no curated preview exists', async () => {
              const root = fs.mkdtempSync(path.join(os.tmpdir(), 'vellira-preview-'));
              const catalogPreviewFile = path.join(root, 'ComponentCatalogPreview.tsx');
              const catalogPreviewFallbackFile = path.join(
                root,
                'generatedCatalogPreviews.tsx'
              );

              fs.writeFileSync(
                catalogPreviewFile,
                `switch (slug) {\n  case 'button':\n    return null;\n}\n`
              );
              fs.writeFileSync(
                catalogPreviewFallbackFile,
                `import { lazy } from 'react';\n\nexport const generatedCatalogPreviews = {\n  // component-catalog-preview-entries\n};\n`
              );

              for (let iteration = 0; iteration < 2; iteration += 1) {
                await updateCatalogPreviewFallback({
                  root,
                  check: false,
                  checkFailures: [],
                  catalogPreviewFile,
                  catalogPreviewFallbackFile,
                  model,
                });
              }

              const content = fs.readFileSync(catalogPreviewFallbackFile, 'utf8');

              expect(content.match(/'switch': lazy\(/g)).toHaveLength(1);
              expect(content).toContain("import('../../components/Switch')");
              expect(content).toContain('SwitchDemo');
            });

            it('keeps an explicit curated preview authoritative', async () => {
              const root = fs.mkdtempSync(path.join(os.tmpdir(), 'vellira-preview-'));
              const catalogPreviewFile = path.join(root, 'ComponentCatalogPreview.tsx');
              const catalogPreviewFallbackFile = path.join(
                root,
                'generatedCatalogPreviews.tsx'
              );
              const fallbackSource = `import { lazy } from 'react';\n\nexport const generatedCatalogPreviews = {\n  // component-catalog-preview-entries\n};\n`;

              fs.writeFileSync(
                catalogPreviewFile,
                `switch (slug) {\n  case 'switch':\n    return null;\n}\n`
              );
              fs.writeFileSync(catalogPreviewFallbackFile, fallbackSource);

              await updateCatalogPreviewFallback({
                root,
                check: false,
                checkFailures: [],
                catalogPreviewFile,
                catalogPreviewFallbackFile,
                model,
              });

              expect(fs.readFileSync(catalogPreviewFallbackFile, 'utf8')).toBe(
                fallbackSource
              );
            });
          });
          '''
          write(registry_test_path, registry_test)

          contract_test_path = 'scripts/generators/component-page/catalog-preview-contract.test.ts'
          write(
              contract_test_path,
              r'''import fs from 'node:fs';
          import path from 'node:path';

          import { describe, expect, it } from 'vitest';

          const root = process.cwd();

          const read = (relativePath: string) =>
            fs.readFileSync(path.join(root, relativePath), 'utf8');

          describe('component catalog preview contract', () => {
            it('gives every catalog component a curated or generated preview', () => {
              const catalog = read(
                'apps/website/src/component-catalog/registry/components.ts'
              );
              const curated = read(
                'apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentCatalogPreview.tsx'
              );
              const generated = read(
                'apps/website/src/component-catalog/shared/ComponentsCatalog/generatedCatalogPreviews.tsx'
              );
              const slugs = [...catalog.matchAll(/slug: '([^']+)'/g)].map(
                (match) => match[1]
              );

              expect(slugs.length).toBeGreaterThan(0);

              for (const slug of slugs) {
                const hasCuratedPreview = curated.includes(`case '${slug}':`);
                const hasGeneratedPreview = generated.includes(`'${slug}': lazy(`);

                expect(
                  hasCuratedPreview || hasGeneratedPreview,
                  `${slug} is missing a component catalog preview`
                ).toBe(true);
              }
            });

            it('fails closed instead of silently returning null for unknown previews', () => {
              const source = read(
                'apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentCatalogPreview.tsx'
              );

              expect(source).not.toContain('default:\n      return null;');
              expect(source).toContain('Missing component catalog preview');
            });
          });
          ''',
          )
          PY

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            packages/metadata/src/components/index.ts \
            scripts/generators/component/write.ts \
            scripts/generators/component/write.test.ts \
            apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentCatalogPreview.tsx \
            apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentsCatalog.module.css \
            apps/website/src/component-catalog/shared/ComponentsCatalog/generatedCatalogPreviews.tsx \
            scripts/generators/component-page/create-component-page.ts \
            scripts/generators/component-page/renderers/registry.ts \
            scripts/generators/component-page/renderers/registry.test.ts \
            scripts/generators/component-page/catalog-preview-contract.test.ts

      - name: Focused hardening tests
        run: |
          pnpm exec vitest run \
            scripts/generators/component/write.test.ts \
            scripts/generators/component-page/renderers/registry.test.ts \
            scripts/generators/component-page/catalog-preview-contract.test.ts
          pnpm check:public-api
          pnpm typecheck:tooling
          git diff --check

      - name: Commit validated hardening and remove probe
        shell: bash
        run: |
          git rm .github/workflows/component-expansion-hardening-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/metadata/src/components/index.ts \
            scripts/generators/component/write.ts \
            scripts/generators/component/write.test.ts \
            apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentCatalogPreview.tsx \
            apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentsCatalog.module.css \
            apps/website/src/component-catalog/shared/ComponentsCatalog/generatedCatalogPreviews.tsx \
            scripts/generators/component-page/create-component-page.ts \
            scripts/generators/component-page/renderers/registry.ts \
            scripts/generators/component-page/renderers/registry.test.ts \
            scripts/generators/component-page/catalog-preview-contract.test.ts
          git diff --cached --check
          git commit -m 'fix(generator): harden component expansion contracts'
          git push origin HEAD:fix/component-expansion-hardening
