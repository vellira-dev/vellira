name: Temporary Toast exact final validation 1260

on:
  push:
    branches:
      - tmp/toast-final-postsync-1260

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 860bbf20f900972191ed39027372077fad8ed9ff
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - name: Run exact final validation
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseComponentProductionInput } from './scripts/component-production/contracts.ts';
          import { runComponentProductionFinalValidation } from './scripts/component-production/final-validation.ts';

          const input = parseComponentProductionInput(
            JSON.parse(
              fs.readFileSync(
                'scripts/component-production/specs/Toast.json',
                'utf8'
              )
            )
          );

          const result = runComponentProductionFinalValidation({
            root: process.cwd(),
            input,
          });

          console.log(JSON.stringify(result, null, 2));

          if (result.stages.some((stage) => stage.status !== 'passed')) {
            process.exitCode = 1;
          }
          NODE
