name: Temporary optional undefined format 1294

on:
  push:
    branches:
      - tmp/api-doc-undefined-format-1294

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/generate-api-docs.ts scripts/generate-api-docs.silent.test.ts
      - run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generate-api-docs.silent.test.ts
      - run: pnpm docs:api:check
      - run: pnpm component-docs:check
      - name: Capture
        shell: bash
        run: |
          mkdir -p artifacts/scripts
          cp scripts/generate-api-docs.ts artifacts/scripts/
          cp scripts/generate-api-docs.silent.test.ts artifacts/scripts/
          git diff --binary > artifacts/generated.patch
          git status --short > artifacts/status.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optional-undefined-format-1294
          path: artifacts
          if-no-files-found: error
