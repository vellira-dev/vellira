name: Repair Component Expansion Hardening Probe

on:
  push:
    branches:
      - fix/component-expansion-hardening

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Repair probe and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/component-expansion-hardening-probe.yml')
          source = path.read_text()
          old = '          node-version-file: .nvmrc\n'
          new = '          node-version: 22.22.0\n'
          if source.count(old) != 1:
              raise SystemExit(f'expected one node-version-file marker, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git rm .github/workflows/component-expansion-hardening-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/component-expansion-hardening-probe.yml
          git diff --cached --check
          git commit -m 'ci: repair hardening probe node setup'
          git push origin HEAD:fix/component-expansion-hardening
