name: Dashboard Numeric Source Formatting Diagnostics

on:
  push:
    branches:
      - feat/dashboard-numeric-source-review-v1
    paths:
      - .github/workflows/dashboard-numeric-format-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect-prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
      - name: Install pinned formatting dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Print canonical formatted source (read-only diagnostic)
        run: |
          pnpm exec prettier --write \
            scripts/component-production/specs/DashboardNumericSourceProbe.json \
            scripts/component-program/dashboard-numeric-source-review.test.ts
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            for (const [id,path] of Object.entries({
              SPEC: 'scripts/component-production/specs/DashboardNumericSourceProbe.json',
              TEST: 'scripts/component-program/dashboard-numeric-source-review.test.ts',
            })) console.log('NUMERIC_PRETTIER_' + id + '=' + readFileSync(path).toString('base64'));
          "
