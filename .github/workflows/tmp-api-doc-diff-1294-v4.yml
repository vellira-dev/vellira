name: Temporary API docs diff 1294 v4

on:
  push:
    branches:
      - tmp/api-doc-diff-1294-v4

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/generate-api-docs.ts scripts/generate-api-docs.silent.test.ts
      - run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generate-api-docs.silent.test.ts
      - run: pnpm docs:api
      - name: Capture
        shell: bash
        run: |
          mkdir -p .artifacts/diff/scripts
          mkdir -p .artifacts/diff/packages/react
          mkdir -p .artifacts/diff/packages/react-native
          cp scripts/generate-api-docs.ts .artifacts/diff/scripts/
          cp scripts/generate-api-docs.silent.test.ts .artifacts/diff/scripts/
          cp packages/react/API.md .artifacts/diff/packages/react/
          cp packages/react-native/API.md .artifacts/diff/packages/react-native/
          git diff --binary > .artifacts/diff/generated.patch
          git status --short > .artifacts/diff/status.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: api-doc-diff-1294-v4
          path: .artifacts/diff
          if-no-files-found: error
