name: One-time Component Intent Reconcile

on:
  push:
    branches:
      - feat/component-intent-capability-coverage-v1

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/component-intent-capability-coverage-v1
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconcile intent contracts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replace(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) {
              throw new Error(`Expected source fragment was not found in ${file}`);
            }
            fs.writeFileSync(file, source.replace(before, after));
          }

          replace(
            'packages/metadata/src/expansionCatalog.test.ts',
            `    const knownNames = new Set(\n      componentMetadata.map((metadata) => metadata.name)\n    );`,
            `    const knownNames = new Set<string>(\n      componentMetadata.map((metadata) => metadata.name)\n    );`
          );

          replace(
            'scripts/component-production/production-eligibility.test.ts',
            `      ['Badge', 'standard'],\n    ]);`,
            `      ['Badge', 'standard'],\n      ['Progress', 'standard'],\n      ['Skeleton', 'standard'],\n      ['Toast', 'standard'],\n    ]);`
          );

          replace(
            'scripts/canonical-gap/contract.test.ts',
            `      role: 'form-control',\n    },`,
            `      role: 'form-control',\n      intent: {\n        schemaVersion: '1',\n        job: 'Enter and edit multiline text.',\n        requiredCapabilities: ['multiline', 'accessible-name'],\n      },\n    },`
          );

          replace(
            'scripts/checks/component-completeness/check-intent-coverage.ts',
            `import {\n  evaluateComponentIntentCoverage,\n  type ComponentExpansionTarget,\n  type ComponentMetadata,\n} from '@vellira-ui/metadata';`,
            `import type {\n  ComponentExpansionTarget,\n  ComponentMetadata,\n} from '@vellira-ui/metadata';\n\nimport { evaluateComponentIntentCoverage } from '../../../packages/metadata/src/componentIntent';`
          );

          replace(
            'scripts/checks/component-completeness/run.ts',
            `import {\n  componentExpansionCatalog,\n  type ComponentExpansionTarget,\n  type ComponentMetadata,\n} from '@vellira-ui/metadata';`,
            `import type {\n  ComponentExpansionTarget,\n  ComponentMetadata,\n} from '@vellira-ui/metadata';\nimport { componentExpansionCatalog } from '../../../packages/metadata/src/expansionCatalog';`
          );

          const intentTest = `import { describe, expect, it } from 'vitest';\n\nimport type {\n  ComponentExpansionTarget,\n  ComponentMetadata,\n} from '@vellira-ui/metadata';\n\nimport { checkComponentIntentCoverage } from './check-intent-coverage';\n\nconst avatarTarget = {\n  name: 'Avatar',\n  layer: 'primitives',\n  category: 'data-display',\n  platforms: ['react', 'react-native'],\n  profile: 'base',\n  componentTokens: 'standard',\n  role: 'foundational',\n  intent: {\n    schemaVersion: '1',\n    job: 'Represent identity with an image and deterministic fallback.',\n    requiredCapabilities: [\n      'image-source',\n      'fallback',\n      'size-variants',\n      'accessible-name',\n    ],\n  },\n} as const satisfies ComponentExpansionTarget;\n\nfunction metadata(\n  semanticCapabilities: ComponentMetadata['semanticCapabilities'] = []\n): ComponentMetadata {\n  return {\n    name: 'Avatar',\n    layer: 'primitives',\n    category: 'data-display',\n    platforms: ['react', 'react-native'],\n    profile: 'base',\n    status: 'experimental',\n    semanticCapabilities,\n    requirements: {\n      tests: true,\n      storybook: true,\n      docs: true,\n      accessibility: true,\n      componentTokens: 'standard',\n    },\n  };\n}\n\ndescribe('component completeness intent coverage', () => {\n  it('blocks a structurally present component with missing semantic intent', () => {\n    expect(\n      checkComponentIntentCoverage({\n        metadata: metadata(),\n        targets: [avatarTarget],\n      })\n    ).toEqual([\n      {\n        name: 'intent-coverage',\n        ok: true,\n      },\n      {\n        name: 'intent-coverage',\n        platform: 'react',\n        ok: false,\n        details:\n          'Component intent coverage is missing on react.\\nMissing semantic capabilities: image-source, fallback, size-variants, accessible-name.',\n      },\n      {\n        name: 'intent-coverage',\n        platform: 'react-native',\n        ok: false,\n        details:\n          'Component intent coverage is missing on react-native.\\nMissing semantic capabilities: image-source, fallback, size-variants, accessible-name.',\n      },\n    ]);\n  });\n\n  it('passes only when required target semantics are represented', () => {\n    expect(\n      checkComponentIntentCoverage({\n        metadata: metadata([\n          'image-source',\n          'fallback',\n          'size-variants',\n          'accessible-name',\n        ]),\n        targets: [avatarTarget],\n      })\n    ).toEqual([\n      { name: 'intent-coverage', ok: true },\n      { name: 'intent-coverage', platform: 'react', ok: true },\n      { name: 'intent-coverage', platform: 'react-native', ok: true },\n    ]);\n  });\n\n  it('does not invent intent requirements for unrelated components', () => {\n    expect(\n      checkComponentIntentCoverage({\n        metadata: {\n          ...metadata(),\n          name: 'UntrackedProbe',\n        },\n        targets: [avatarTarget],\n      })\n    ).toEqual([]);\n  });\n});\n`;
          fs.writeFileSync(
            'scripts/checks/component-completeness/check-intent-coverage.test.ts',
            intentTest
          );
          NODE

      - name: Format affected files
        run: >-
          pnpm exec prettier --write
          packages/metadata/src/componentIntent.ts
          packages/metadata/src/expansionCatalog.test.ts
          scripts/component-production/missing-component-request.ts
          scripts/component-production/production-eligibility.test.ts
          scripts/canonical-gap/contract.test.ts
          scripts/checks/component-completeness/check-intent-coverage.ts
          scripts/checks/component-completeness/check-intent-coverage.test.ts
          scripts/checks/component-completeness/run.ts

      - name: Run focused contracts
        run: |
          pnpm --filter @vellira-ui/metadata test
          pnpm --filter @vellira-ui/metadata build
          pnpm exec vitest run \
            scripts/checks/component-completeness/check-intent-coverage.test.ts \
            scripts/component-production/production-eligibility.test.ts \
            scripts/canonical-gap/contract.test.ts \
            scripts/component-production/missing-component-request.test.ts

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/one-time-component-intent-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/metadata/src/componentIntent.ts \
            packages/metadata/src/expansionCatalog.test.ts \
            scripts/component-production/missing-component-request.ts \
            scripts/component-production/production-eligibility.test.ts \
            scripts/canonical-gap/contract.test.ts \
            scripts/checks/component-completeness/check-intent-coverage.ts \
            scripts/checks/component-completeness/check-intent-coverage.test.ts \
            scripts/checks/component-completeness/run.ts \
            .github/workflows/one-time-component-intent-reconcile.yml
          git commit -m "test(metadata): reconcile component intent contracts"
          git push origin HEAD:feat/component-intent-capability-coverage-v1
