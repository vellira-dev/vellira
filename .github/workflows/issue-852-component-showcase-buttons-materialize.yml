name: Issue 852 ComponentShowcase Button materialization

on:
  push:
    branches:
      - probe/852-component-showcase-buttons-materialize

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture baseline audit
        run: pnpm check:vellira-ui-usage:json > /tmp/vellira-ui-before.json
      - name: Adopt canonical Button for three bypasses
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/website/src/sections/home/ComponentShowcase/ComponentShowcase.tsx';
          let source = fs.readFileSync(path, 'utf8');

          function replaceRegex(regex, replacement, label) {
            const matches = source.match(regex) ?? [];
            if (matches.length !== 1) {
              throw new Error(`${label}: expected 1 match, got ${matches.length}`);
            }
            source = source.replace(regex, replacement);
          }

          replaceRegex(
            /<button(?=\s+key=\{component\.value\})/g,
            '<Button',
            'component picker opening tag'
          );
          replaceRegex(
            /type='button'\s+className=\{styles\.componentButton\}/g,
            "type='button'\n                  appearance='ghost'\n                  color='neutral'\n                  size='sm'\n                  className={styles.componentButton}",
            'component picker canonical Button props'
          );
          replaceRegex(
            /(\{component\.label\}\s*<\/span>\s*)<\/button>/g,
            '$1</Button>',
            'component picker closing tag'
          );

          replaceRegex(
            /<button(?=\s+key=\{example\.value\})/g,
            '<Button',
            'dropdown tab opening tag'
          );
          replaceRegex(
            /type='button'\s+role='tab'/g,
            "type='button'\n                            appearance='ghost'\n                            color='neutral'\n                            size='sm'\n                            role='tab'",
            'dropdown tab canonical Button props'
          );
          replaceRegex(
            /(\{example\.label\}\s*)<\/button>/g,
            '$1</Button>',
            'dropdown tab closing tag'
          );

          replaceRegex(
            /<button\s+type='button'(?=>\s*<span>\s*\{dropdownExample === 'actions')/g,
            "<Button\n                              type='button'\n                              appearance='outline'\n                              color='neutral'\n                              size='sm'",
            'dropdown trigger opening tag'
          );
          replaceRegex(
            /(<ChevronDown[\s\S]*?className=\{styles\.dropdownTriggerIcon\}[\s\S]*?aria-hidden='true'\s*\/>\s*)<\/button>(\s*<\/Dropdown\.Trigger>)/g,
            '$1</Button>$2',
            'dropdown trigger closing tag'
          );

          fs.writeFileSync(path, source);
          NODE
      - name: Format migrated TSX
        run: pnpm exec prettier apps/website/src/sections/home/ComponentShowcase/ComponentShowcase.tsx --write
      - name: Verify exact audit delta
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:vellira-ui-usage:json > /tmp/vellira-ui-after.json
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('/tmp/vellira-ui-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('/tmp/vellira-ui-after.json', 'utf8'));
          const prefix = 'apps/website/src/sections/home/ComponentShowcase/';
          const beforeTarget = before.findings.filter((finding) => finding.path.startsWith(prefix));
          const afterTarget = after.findings.filter((finding) => finding.path.startsWith(prefix));
          const beforeBypass = beforeTarget.filter((finding) => finding.ruleId === 'vellira-ui.existing-component-bypass');

          if (beforeTarget.length !== 3 || beforeBypass.length !== 3) {
            throw new Error(`expected exactly 3 ComponentShowcase button bypasses before migration, got ${JSON.stringify(beforeTarget)}`);
          }
          if (afterTarget.length !== 0) {
            throw new Error(`expected ComponentShowcase findings to reach zero, got ${JSON.stringify(afterTarget)}`);
          }
          if (before.summary.findings !== 131 || after.summary.findings !== 128) {
            throw new Error(`expected global findings 131 -> 128, got ${before.summary.findings} -> ${after.summary.findings}`);
          }
          console.log('ComponentShowcase findings: 3 -> 0');
          console.log('Global findings: 131 -> 128');
          NODE
      - name: Validate website
        run: |
          pnpm website:typecheck
          pnpm build
          pnpm website:build
      - name: Check diff
        run: git diff --check
      - name: Commit validated production tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-852-component-showcase-buttons-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(website): adopt canonical Button in ComponentShowcase'
          git push
