name: Lighthouse CI

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

# Only supersede attempts for the same PR; preserve non-PR runs.
concurrency:
  group: lighthouse-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Lighthouse / Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exercise the deployment build on a fresh runner, without restored dist.
      - name: Verify clean-checkout regression precondition
        run: |
          existing_dist="$(find apps packages -type d -name node_modules -prune -o -type d -name dist -print)"
          if [ -n "$existing_dist" ]; then
            printf 'Unexpected pre-existing workspace dist directories:\n%s\n' "$existing_dist"
            exit 1
          fi

      - name: Build docs workspace dependencies
        run: pnpm exec turbo run build --filter='@vellira-ui/docs^...'

      - name: Build documentation
        run: pnpm docs:build

      - name: Verify docs artifact
        run: test -f apps/docs/src/.vitepress/dist/index.html

      - name: Run Lighthouse for documentation
        run: pnpm lighthouse:docs

      - name: Upload documentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-docs
          path: lighthouse-results/docs
          if-no-files-found: warn
          retention-days: 14

  website:
    name: Lighthouse / Website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build website
        run: pnpm --filter @vellira-ui/website build

      - name: Run Lighthouse for website
        continue-on-error: true
        run: pnpm lighthouse:website

      - name: Upload website reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-website
          path: lighthouse-results/website
          if-no-files-found: warn
          retention-days: 14
