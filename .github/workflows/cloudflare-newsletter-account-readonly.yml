name: Cloudflare Newsletter Account Read-Only Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-newsletter-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  account-inventory:
    name: Inspect Cloudflare account without writes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout audited main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Run local request and sanitization tests
        run: node --test apps/website/scripts/cloudflare-newsletter-account-readonly.test.mjs
      - name: Inspect account with fixed GET-only requests
        run: node apps/website/scripts/cloudflare-newsletter-account-readonly.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
