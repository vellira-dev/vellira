name: Temporary token semantic formatter

on:
  push:
    branches:
      - ci/token-semantic-audit-890

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier scripts/checks/token-semantic/css-component-provider.ts --write
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formatted-token-semantic-helper
          path: scripts/checks/token-semantic/css-component-provider.ts
          if-no-files-found: error
          retention-days: 1
