name: Probe Token Ownership Lifecycle 890

on:
  push:
    branches:
      - probe/token-ownership-lifecycle-890-11404013

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Classify canonical menu container roles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/tokens/src/token-architecture.ts')
          source = path.read_text()
          old = """  menu: {\n    purpose:\n      'Menu-item roles where active/current is a legitimate domain state.',\n    roles: ['item', 'item.danger'],\n  },"""
          new = """  menu: {\n    purpose:\n      'Menu container chrome plus item roles where active/current is a legitimate domain state.',\n    roles: ['background', 'border', 'item', 'item.danger'],\n  },"""
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit('menu vocabulary anchor mismatch')
          PY
      - name: Apply canonical shadow role derivation support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/checks/token-ownership/checker.ts')
          source = path.read_text()
          marker = 'function canonicalShadowFactoryBinding('
          if marker not in source:
              import_anchor = "import { componentMetadata } from '../../../packages/metadata/src/components';\n"
              import_replacement = import_anchor + "import { createSemanticShadowTokens } from '../../../packages/tokens/src/effects/shadow-system';\n"
              if source.count(import_anchor) != 1:
                  raise SystemExit('shadow import anchor mismatch')
              source = source.replace(import_anchor, import_replacement, 1)

              helper_anchor = 'function readSemanticRolePaths(filePath: string, namespace: string): string[] {'
              helper_replacement = r'''function canonicalShadowFactoryBinding(ast: ts.SourceFile): string | null {
            for (const statement of ast.statements) {
              if (
                !ts.isImportDeclaration(statement) ||
                !ts.isStringLiteral(statement.moduleSpecifier) ||
                statement.moduleSpecifier.text !== '../../effects/shadow-system.js'
              ) {
                continue;
              }

              const bindings = statement.importClause?.namedBindings;
              if (!bindings || !ts.isNamedImports(bindings)) continue;

              for (const element of bindings.elements) {
                if (
                  (element.propertyName ?? element.name).text ===
                  'createSemanticShadowTokens'
                ) {
                  return element.name.text;
                }
              }
            }

            return null;
          }

          function canonicalDerivedSemanticRolePaths(params: {
            ast: ts.SourceFile;
            expression: ts.Expression;
            namespace: string;
            theme: (typeof THEMES)[number];
          }): string[] | null {
            if (params.namespace !== 'shadow') return null;

            const binding = canonicalShadowFactoryBinding(params.ast);
            const expectedTheme =
              params.theme === 'highContrast' ? 'high-contrast' : params.theme;

            if (
              !binding ||
              !ts.isCallExpression(params.expression) ||
              !ts.isIdentifier(params.expression.expression) ||
              params.expression.expression.text !== binding ||
              params.expression.arguments.length !== 1 ||
              !ts.isStringLiteral(params.expression.arguments[0]!) ||
              params.expression.arguments[0]!.text !== expectedTheme
            ) {
              throw new Error(
                `Semantic shadow source must call canonical createSemanticShadowTokens(${JSON.stringify(expectedTheme)}).`
              );
            }

            return Object.keys(createSemanticShadowTokens(expectedTheme))
              .map((role) => `shadow.${role}`)
              .sort();
          }

          function readSemanticRolePaths(
            filePath: string,
            namespace: string,
            theme: (typeof THEMES)[number]
          ): string[] {'''
              if source.count(helper_anchor) != 1:
                  raise SystemExit('role reader signature anchor mismatch')
              source = source.replace(helper_anchor, helper_replacement, 1)

              old_object_guard = r'''  const root = unwrapExpression(initializer);
            if (!ts.isObjectLiteralExpression(root)) {
              throw new Error(
                `Semantic namespace source must use a static object literal: ${filePath}`
              );
            }

            const roles: string[] = [];'''
              new_object_guard = r'''  const root = unwrapExpression(initializer);
            if (!ts.isObjectLiteralExpression(root)) {
              const derivedRoles = canonicalDerivedSemanticRolePaths({
                ast,
                expression: root,
                namespace,
                theme,
              });
              if (derivedRoles) return derivedRoles;

              throw new Error(
                `Semantic namespace source must use a static object literal or a canonical derived semantic authority: ${filePath}`
              );
            }

            const roles: string[] = [];'''
              if source.count(old_object_guard) != 1:
                  raise SystemExit('role reader object guard anchor mismatch')
              source = source.replace(old_object_guard, new_object_guard, 1)

              call_tail = "        namespace\n      );"
              if source.count(call_tail) != 1:
                  raise SystemExit(f'role reader call tail mismatch: {source.count(call_tail)}')
              source = source.replace(
                  call_tail,
                  "        namespace,\n        theme\n      );",
                  1,
              )

              path.write_text(source)
          PY
      - name: Format exact candidate
        run: >-
          pnpm exec prettier --write
          packages/tokens/src/token-architecture.ts
          scripts/token-lifecycle/component-ownership.ts
          scripts/checks/token-ownership/checker.ts
          scripts/checks/token-ownership/role-lifecycle.test.ts
          scripts/generators/component/token-ownership-contract.test.ts
          scripts/checks/token-semantic/checker.ts
          scripts/checks/token-semantic/ownership-coverage.test.ts
      - name: Validate ownership and generator regressions
        run: >-
          pnpm exec vitest run --config vitest.tooling.config.ts
          scripts/checks/token-ownership/checker.test.ts
          scripts/checks/token-ownership/role-lifecycle.test.ts
          scripts/generators/component/token-ownership-contract.test.ts
          scripts/checks/token-semantic/semantic-vocabulary.test.ts
          scripts/checks/token-semantic/ownership-coverage.test.ts
      - name: Validate semantic audit
        run: pnpm check:tokens-semantic:json > token-semantic-report.json
      - name: Build repository
        run: pnpm ci:build
      - name: Validate tooling TypeScript
        run: pnpm typecheck:tooling
      - name: Publish exact formatted candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Roman Bakurov'
          git config user.email 'ronbakurov@gmail.com'
          git add \
            packages/tokens/src/token-architecture.ts \
            scripts/token-lifecycle/component-ownership.ts \
            scripts/checks/token-ownership/checker.ts \
            scripts/checks/token-ownership/role-lifecycle.test.ts \
            scripts/generators/component/token-ownership-contract.test.ts \
            scripts/checks/token-semantic/checker.ts \
            scripts/checks/token-semantic/ownership-coverage.test.ts
          git commit -m 'style(tokens): format complete ownership coverage'
          git push origin HEAD:probe/token-ownership-lifecycle-890-11404013
