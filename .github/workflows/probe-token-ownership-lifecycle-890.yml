name: Probe Token Ownership Lifecycle 890

on:
  push:
    branches:
      - probe/token-ownership-lifecycle-890-11404013

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact candidate
        run: >-
          pnpm exec prettier --write
          scripts/token-lifecycle/component-ownership.ts
          scripts/checks/token-ownership/checker.ts
          scripts/checks/token-ownership/role-lifecycle.test.ts
          scripts/generators/component/token-ownership-contract.test.ts
      - name: Validate ownership and generator regressions
        run: >-
          pnpm exec vitest run --config vitest.tooling.config.ts
          scripts/checks/token-ownership/checker.test.ts
          scripts/checks/token-ownership/role-lifecycle.test.ts
          scripts/generators/component/token-ownership-contract.test.ts
      - name: Validate semantic audit
        run: pnpm check:tokens-semantic:json > token-semantic-report.json
      - name: Build repository
        run: pnpm ci:build
      - name: Validate tooling TypeScript
        run: pnpm typecheck:tooling
      - name: Publish exact formatted candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Roman Bakurov'
          git config user.email 'ronbakurov@gmail.com'
          git add \
            scripts/token-lifecycle/component-ownership.ts \
            scripts/checks/token-ownership/checker.ts \
            scripts/checks/token-ownership/role-lifecycle.test.ts \
            scripts/generators/component/token-ownership-contract.test.ts
          git commit -m 'style(tokens): format ownership lifecycle coverage'
          git push origin HEAD:probe/token-ownership-lifecycle-890-11404013
