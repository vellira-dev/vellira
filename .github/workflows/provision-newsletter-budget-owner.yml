name: Provision Private Newsletter Budget Owner

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Preflight only by default; provisioning requires separate protected approval.'
        required: true
        type: choice
        options:
          - preflight
          - provision
        default: preflight
      expected_sha:
        description: 'Exact main commit SHA (required for provision).'
        required: false
        type: string
      confirmation:
        description: 'For provision only, type PROVISION_PRIVATE_BUDGET_OWNER.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: provision-private-newsletter-budget-owner
  cancel-in-progress: false

jobs:
  preflight:
    name: Offline owner preflight (no Cloudflare credentials)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the exact selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate requested operation and commit identity
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$OPERATION" == "preflight" ]]; then
            test -z "$CONFIRMATION"
            if [[ -n "$EXPECTED_SHA" ]]; then
              [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$EXPECTED_SHA" = "$GITHUB_SHA"
            fi
          elif [[ "$OPERATION" == "provision" ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$EXPECTED_SHA" = "$GITHUB_SHA"
            test "$CONFIRMATION" = "PROVISION_PRIVATE_BUDGET_OWNER"
          else
            echo "::error::Unsupported owner operation"
            exit 1
          fi
          echo "Approved operation syntax: $OPERATION; exact SHA verified."
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Install locked dependencies without Cloudflare credentials
        run: pnpm install --frozen-lockfile
      - name: Validate private owner source, isolation, and pinned Wrangler dry-run
        run: |
          node --test \
            apps/website/scripts/newsletter-namespace-candidate.test.mjs \
            apps/website/scripts/newsletter-budget-owner-deployment.test.mjs \
            apps/website/scripts/newsletter-owner-wrangler-dry-run.test.mjs

  approval:
    name: Approve private owner only (no site activation)
    needs: preflight
    if: inputs.operation == 'provision' && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Bind human review to the exact manual candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          echo "Human approval recorded for PRIVATE owner candidate $EXPECTED_SHA."

  provision:
    name: Provision private owner only; website bindings remain OFF
    needs: [preflight, approval]
    if: inputs.operation == 'provision' && needs.preflight.result == 'success' && needs.approval.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Install exact locked candidate
        run: pnpm install --frozen-lockfile
      - name: Verify current main and remotely absent owner (GET only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { auditCloudflareNewsletterAccount } from './apps/website/scripts/cloudflare-newsletter-account-readonly.mjs';
          const expected = process.env.EXPECTED_SHA;
          assert.match(expected ?? '', /^[0-9a-f]{40}$/);
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          assert.equal(process.env.GITHUB_SHA, expected);
          const url = new URL('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/branches/main');
          const response = await fetch(url, {
            method: 'GET',
            headers: {
              Authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
              Accept: 'application/vnd.github+json',
            },
            redirect: 'error',
            signal: AbortSignal.timeout(15000),
          });
          if (response.status !== 200) throw new Error('GitHub current-main preflight unavailable');
          const main = await response.json();
          assert.equal(main?.commit?.sha, expected, 'main advanced since manual approval');
          const report = await auditCloudflareNewsletterAccount({
            accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
            apiToken: process.env.CLOUDFLARE_API_TOKEN,
          });
          assert.equal(report.workerInventoryStatus, 'complete');
          assert.equal(report.workerPresence['vellira-newsletter-budget-owner'], 'absent');
          for (const name of ['vellira-website-staging', 'vellira-website']) {
            assert.equal(report.liveBinding[name]?.status, 'observed');
            assert.equal(report.liveBinding[name]?.globalBudgetBindingInServingVersions, false);
          }
          console.log('Read-only preflight PASS: private owner absent; both site bindings absent.');
          NODE
      - name: Deploy only the isolated private owner (Cloudflare write)
        working-directory: apps/website
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if ! pnpm exec wrangler deploy --config cloudflare/newsletter-budget-owner.wrangler.candidate.jsonc > "$RUNNER_TEMP/private-owner-deploy.log" 2>&1; then
            echo "::error::Private owner provisioning failed; review Cloudflare dashboard before retrying."
            exit 1
          fi
          echo "Private owner command completed; no website Worker was deployed."
      - name: Verify private route exposure and site isolation (GET only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { auditCloudflareNewsletterAccount } from './apps/website/scripts/cloudflare-newsletter-account-readonly.mjs';
          const report = await auditCloudflareNewsletterAccount({
            accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
            apiToken: process.env.CLOUDFLARE_API_TOKEN,
          });
          assert.equal(report.workerInventoryStatus, 'complete');
          assert.equal(report.workerPresence['vellira-newsletter-budget-owner'], 'present');
          const owner = report.workerDev['vellira-newsletter-budget-owner'];
          assert.equal(owner?.status, 'observed');
          assert.equal(owner.enabled, false);
          assert.equal(owner.previewsEnabled, false);
          for (const name of ['vellira-website-staging', 'vellira-website']) {
            assert.equal(report.liveBinding[name]?.status, 'observed');
            assert.equal(report.liveBinding[name]?.globalBudgetBindingInServingVersions, false);
          }
          assert.equal(report.remoteWrites, 0);
          assert.equal(report.providerWrites, 0);
          console.log('Private Worker observed, URLs disabled; site budget bindings remain absent.');
          console.log('Provider capacity, namespace identity and activation remain unverified/OFF.');
          NODE
