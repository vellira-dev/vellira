name: One-time Vercel lockfile cleanup

on:
  push:
    branches:
      - chore/vercel-decommission
    paths:
      - '.github/workflows/one-time-vercel-lockfile-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/vercel-decommission

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0

      - name: Remove Vercel Analytics and regenerate lockfile
        run: pnpm --filter @vellira-ui/website remove @vercel/analytics --lockfile-only

      - name: Commit generated package state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/website/package.json pnpm-lock.yaml
          git commit -m 'chore(website): remove Vercel Analytics dependency'
          git push origin HEAD:chore/vercel-decommission
