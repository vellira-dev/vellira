name: Token Semantic Prettier Probe

on:
  push:
    branches: [ci/token-semantic-audit-890]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prettier-probe:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate canonical Prettier copies
        shell: bash
        run: |
          set -euo pipefail
          files=(
            packages/tokens/src/component-token-dependencies.ts
            scripts/checks/token-semantic/factory-convention.test.ts
            scripts/checks/token-semantic/factory-convention.ts
            scripts/checks/token-semantic/semantic-dependency.ts
          )
          for file in "${files[@]}"; do
            target=".artifacts/prettier-candidate/$file"
            mkdir -p "$(dirname "$target")"
            pnpm exec prettier "$file" > "$target"
          done

      - name: Upload canonical Prettier copies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: token-semantic-prettier-candidate
          path: .artifacts/prettier-candidate/
          if-no-files-found: error
          retention-days: 1
