name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Only supersede attempts for the same PR; preserve non-PR runs.
concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted title-validation authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js without dependency cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Detect title-validator authority in trusted base
        id: validator
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/pr-title-validator/package.json ]]; then
            echo "mode=isolated" >> "$GITHUB_OUTPUT"
          else
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
          fi

      - name: Install locked PR-title validator only
        if: steps.validator.outputs.mode == 'isolated'
        run: >-
          pnpm install --frozen-lockfile --ignore-scripts
          --filter @vellira-ci/pr-title-validator

      - name: Bootstrap canonical title dependencies
        if: steps.validator.outputs.mode == 'bootstrap'
        run: >-
          pnpm install --frozen-lockfile --ignore-scripts
          --filter vellira

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          VALIDATOR_MODE: ${{ steps.validator.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VALIDATOR_MODE" == "isolated" ]]; then
            printf "%s\n" "$PR_TITLE" |
              pnpm --filter @vellira-ci/pr-title-validator run validate
          else
            printf "%s\n" "$PR_TITLE" |
              pnpm exec commitlint --config commitlint.config.js
          fi
