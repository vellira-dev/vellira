name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Only supersede attempts for the same PR; preserve non-PR runs.
concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted title-validation authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Require adopted title-validator authority
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/pr-title-validator/package.json
          test -f tools/pr-title-validator/commitlint.config.js
          test -f commitlint.config.js
          test -f pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js without dependency cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Install isolated locked PR-title validator
        run: >-
          pnpm install --frozen-lockfile --ignore-scripts
          --filter @vellira-ci/pr-title-validator
          --config.node-linker=isolated

      - name: Verify isolated install stayed bounded
        shell: bash
        run: |
          set -euo pipefail
          test -x tools/pr-title-validator/node_modules/.bin/commitlint
          test -d node_modules/.pnpm

          package_snapshots="$(
            find node_modules/.pnpm -mindepth 1 -maxdepth 1 -type d |
              wc -l |
              tr -d '[:space:]'
          )"
          echo "PR-title validator package snapshots: $package_snapshots"

          if (( package_snapshots > 300 )); then
            echo "::error::Standalone PR-title install expanded to $package_snapshots snapshots; expected <= 300."
            exit 1
          fi

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          printf "%s\n" "$PR_TITLE" |
            pnpm --filter @vellira-ci/pr-title-validator run validate
