name: Deploy Website Cloudflare Staging

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'apps/react-storybook/scripts/cloudflare-website-smoke.mjs'
      - 'apps/react-storybook/scripts/cloudflare-auth-provider-smoke.mjs'
      - 'apps/react-storybook/scripts/cloudflare-client-navigation-recovery.mjs'
      - 'apps/react-storybook/scripts/cloudflare-client-navigation-recovery.test.mjs'
      - 'apps/react-storybook/scripts/cloudflare-edge-recovery.mjs'
      - 'apps/react-storybook/scripts/cloudflare-edge-recovery.test.mjs'
      - 'apps/react-storybook/scripts/cloudflare-blog-metrics-smoke-policy.mjs'
      - 'apps/react-storybook/scripts/cloudflare-blog-metrics-smoke-policy.test.mjs'
      - 'apps/react-storybook/scripts/cloudflare-static-chunk-smoke.mjs'
      - 'apps/react-storybook/scripts/cloudflare-navigation-soak.mjs'
      - 'apps/react-storybook/scripts/cloudflare-browser-diagnostics.mjs'
      - 'apps/react-storybook/scripts/cloudflare-browser-diagnostics.test.mjs'
      - 'apps/react-storybook/scripts/cloudflare-public-release-smoke-policy.mjs'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-website-cloudflare-staging.yml'
      - '.github/workflows/deploy-website-cloudflare-production.yml'
  workflow_dispatch:
    inputs:
      pro_interest_preview:
        description: 'Owner-approved staging-only Pro signup preview; unchecked for normal deploys.'
        required: false
        default: false
        type: boolean
      newsletter_abuse_preview:
        description: 'Owner-approved staging-only newsletter burst-guard proof; no subscriber writes.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.4
  STAGING_URL: https://vellira-website-staging.vellira.workers.dev
  CANDIDATE_SHA: ${{ github.sha }}
  VELLIRA_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  classify:
    name: Classify staging deployment authority
    runs-on: ubuntu-latest
    outputs:
      release_sync: ${{ steps.classify.outputs.release_sync }}
    steps:
      - name: Checkout exact staging candidate
        if: github.event_name == 'push' && github.actor == 'vellira-release-sync[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2

      - name: Verify release-sync deployment no-op authority
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_ACTOR: ${{ github.actor }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          VELLIRA_PUSH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "push" || "$PUSH_ACTOR" != "vellira-release-sync[bot]" ]]; then
            echo "release_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/ci/release-sync-contract.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --classify-merged

  migration:
    name: Prove browser migration before staging activation
    needs: classify
    if: needs.classify.outputs.release_sync != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-worker-vellira-website-staging-prepare
      cancel-in-progress: true
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host --user 1001

    steps:
      - name: Checkout exact staging candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Trust checked-out repository in Playwright container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify exact migration candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          echo "Validated exact migration candidate: $actual"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify pinned Node.js runtime for staging
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e "const assert = require('node:assert/strict'); assert.equal(process.versions.node, process.env.NODE_VERSION, 'Staging Node runtime differs from pinned version'); console.log('Verified staging Node runtime ' + process.versions.node);"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove same-origin multi-deployment browser migration
        run: pnpm test:cloudflare-migration

      - name: Retain migration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-migration-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            apps/react-storybook/test-results/cloudflare-migration/*/evidence.json
            apps/react-storybook/test-results/cloudflare-migration/summary.json
            apps/react-storybook/test-results/cloudflare-migration/*.log

  deploy:
    name: Build, deploy, and verify merged main on website staging
    needs: [classify, migration]
    if: needs.classify.outputs.release_sync != 'true' && needs.migration.result == 'success'
    runs-on: ubuntu-latest
    # End-to-end staging verification includes a 15-round route soak and
    # a full static chunk integrity smoke after deployment. The former 25m
    # cap cancelled otherwise GREEN staging runs before promotion evidence.
    timeout-minutes: 40
    concurrency:
      group: deploy-worker-vellira-website-staging
      cancel-in-progress: false
    env:
      # Push and ordinary manual deploys remain OFF. Only a specifically
      # approved manual run may enable the public staging Worker.
      NEXT_PUBLIC_VELLIRA_PRO_INTEREST_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.pro_interest_preview == true && '1' || '0' }}
      NEWSLETTER_ABUSE_GUARD_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.newsletter_abuse_preview == true && '1' || '0' }}

    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          echo "Validated exact staging candidate: $actual"

      - name: Authorize staging-only Pro interest preview
        if: github.event_name == 'workflow_dispatch' && inputs.pro_interest_preview == true
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$NEXT_PUBLIC_VELLIRA_PRO_INTEREST_ENABLED" = "1"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify pinned Node.js runtime for staging
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e "const assert = require('node:assert/strict'); assert.equal(process.versions.node, process.env.NODE_VERSION, 'Staging Node runtime differs from pinned version'); console.log('Verified staging Node runtime ' + process.versions.node);"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure owner-controlled staging newsletter burst guard
        run: node apps/website/scripts/newsletter-guard-staging-mode.mjs

      - name: Derive protocol-defined R2 S3 secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          r2_secret_access_key="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | awk '{print $1}')"
          [[ "$r2_secret_access_key" =~ ^[0-9a-f]{64}$ ]]
          echo "::add-mask::$r2_secret_access_key"
          printf 'CLOUDFLARE_R2_SECRET_ACCESS_KEY=%s\n' "$r2_secret_access_key" >> "$GITHUB_ENV"

      - name: Verify R2 access and active predecessor archive before building
        run: node apps/website/scripts/cloudflare-archive-preflight.mjs wrangler.jsonc
        env:
          WEBSITE_URL: ${{ env.STAGING_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build website dependencies
        run: pnpm exec turbo run build --filter='@vellira-ui/website^...'

      - name: Sync website brand
        run: pnpm --dir apps/website run sync:brand

      - name: Restore Next.js incremental build cache (staging)
        continue-on-error: true
        id: next-build-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/website/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-vellira-next16-staging-v1-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'apps/website/package.json', 'apps/website/next.config.ts') }}-${{ env.CANDIDATE_SHA }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vellira-next16-staging-v1-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'apps/website/package.json', 'apps/website/next.config.ts') }}-

      - name: Build website for Cloudflare Workers
        run: pnpm --dir apps/website run build:opennext

      - name: Verify OpenNext CSS asset closure
        run: node apps/website/scripts/cloudflare-build-asset-closure.mjs

      - name: Test runtime asset auditing
        run: node --test apps/website/scripts/cloudflare-build-runtime-audit.test.mjs

      - name: Audit client manifests and Webpack runtime assets
        run: node apps/website/scripts/cloudflare-build-runtime-audit.mjs

      - name: Verify cache, identity, and immutable archive contracts
        run: pnpm test:cloudflare-cache

      - name: Install Chromium for browser smoke
        run: pnpm --filter @vellira-ui/react-storybook exec playwright install chromium

      - name: Verify actual OpenNext runtime before remote archive or activation
        run: |
          node apps/website/scripts/cloudflare-populate-local-cache.mjs
          node apps/website/scripts/cloudflare-local-runtime.mjs

      - name: Save Next.js incremental build cache (staging)
        if: steps.next-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/website/.next/cache
          key: ${{ steps.next-build-cache.outputs.cache-primary-key }}

      - name: Deploy website staging to Cloudflare Workers
        id: worker-deploy
        timeout-minutes: 10
        run: node apps/website/scripts/cloudflare-deploy.mjs wrangler.jsonc
        env:
          WEBSITE_URL: ${{ env.STAGING_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Audit assets after OpenNext deploy cache population
        run: >-
          node apps/website/scripts/cloudflare-build-runtime-audit.mjs
          apps/website apps/website/.open-next/asset-audit-after-deploy.json

      - name: Smoke test deployed routes
        shell: bash
        run: |
          set -euo pipefail
          sleep 15

          check_route() {
            local path="$1"
            shift
            local body status expected matches
            body="$(mktemp)"

            for attempt in 1 2 3 4 5; do
              status="$(curl --location --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --output "$body" --write-out '%{http_code}' \
                "$STAGING_URL$path" || true)"

              matches=true
              if [[ "$status" == "200" ]]; then
                for expected in "$@"; do
                  if ! grep --fixed-strings --quiet "$expected" "$body"; then
                    matches=false
                    break
                  fi
                done
              else
                matches=false
              fi

              if [[ "$matches" == "true" ]]; then
                echo "OK $path"
                rm -f "$body"
                return 0
              fi

              echo "Attempt $attempt failed for $path: HTTP $status"
              sleep 2
            done

            echo "Smoke test failed for $path" >&2
            sed -n '1,40p' "$body" >&2
            rm -f "$body"
            return 1
          }

          check_route '/' 'Vellira'
          check_route '/components/switch' 'data-component-explorer-main' '>Switch</h1>'
          check_route '/blog' '<h1>Blog</h1>' 'aria-label="Published articles"'
          check_route '/blog/two-runtimes' \
            'One Design System, Two Runtimes' \
            'data-language="ts"'
          check_route '/blog/rss.xml' '<rss version="2.0"'
          check_route '/sitemap.xml' '<urlset'
          check_route '/robots.txt' 'User-Agent: *'

      - name: Verify deployed SEO canonical and sitemap contracts
        shell: bash
        env:
          SEO_BASE_URL: ${{ env.STAGING_URL }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const origin = 'https://vellira.dev';
          const base = process.env.SEO_BASE_URL;
          assert.ok(base?.startsWith('https://'), 'staging origin must use HTTPS');

          async function get(path) {
            const response = await fetch(new URL(path, base), {
              headers: { 'Cache-Control': 'no-cache' },
              signal: AbortSignal.timeout(20_000),
            });
            assert.equal(response.status, 200, `${path}: HTTP ${response.status}`);
            return response.text();
          }

          const sitemap = await get('/sitemap.xml');
          const robots = await get('/robots.txt');
          assert.match(sitemap, /<urlset(?:\s|>)/);
          assert.match(robots, /Sitemap:\s*https:\/\/vellira\.dev\/sitemap\.xml/i);

          for (const path of ['/components', '/components/button', '/components/select', '/components/textarea', '/blog/ai-ui-consistency']) {
            const expected = `${origin}${path}`;
            const html = await get(path);
            const linkTags = html.match(/<link\b[^>]*>/gi) ?? [];
            const canonicalTags = linkTags.filter((tag) => /\brel=["']canonical["']/i.test(tag));
            assert.equal(canonicalTags.length, 1, `${path}: expected exactly one canonical link`);
            assert.ok(
              canonicalTags[0].includes(`href="${expected}"`) || canonicalTags[0].includes(`href='${expected}'`),
              `${path}: unexpected canonical ${canonicalTags[0]}`
            );
            assert.ok(
              sitemap.includes(`<loc>${expected}</loc>`),
              `${path}: missing production canonical URL in sitemap`
            );
            console.log(`SEO smoke OK: ${path} -> ${expected}`);
          }
          NODE

      - name: Inspect verified npm release and registry availability
        # Advisory for optional metadata: preserve website deployment gates.
        # Log safe response evidence so a GREEN browser soak cannot be
        # mistaken for verified version availability.
        run: |
          node --input-type=module <<'NODE'
          const names = [
            '@vellira-ui/core',
            '@vellira-ui/icons',
            '@vellira-ui/react',
            '@vellira-ui/react-native',
            '@vellira-ui/tokens',
            '@vellira-ui/types',
          ];
          const endpoint = new URL('/api/public-release', process.env.STAGING_URL);
          const response = await fetch(endpoint, {
            headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' },
            redirect: 'error',
            signal: AbortSignal.timeout(10_000),
          });
          const reason = response.headers.get('x-vellira-public-release-reason');
          const upstream = response.headers.get('x-vellira-public-release-upstream');
          const upstreamPackage = response.headers.get('x-vellira-public-release-upstream-package');
          const state = response.headers.get('x-vellira-public-release-state');
          const buildId = response.headers.get('x-vellira-build-id');
          const payload = await response.json();
          const summary = {
            kind: 'public-npm-release',
            status: response.status,
            reason,
            upstream,
            upstreamPackage,
            state,
            buildId,
            version: response.status === 200 ? payload?.version : null,
          };
          console.log('PUBLIC_RELEASE_PROBE ' + JSON.stringify(summary));
          if (buildId !== process.env.VELLIRA_BUILD_ID) {
            throw new Error('npm API response does not match the staging build');
          }
          if (response.status === 200) {
            if (
              payload?.schemaVersion !== 1 ||
              payload.source !== 'npm-dist-tags' ||
              !/^\d+\.\d+\.\d+$/.test(payload.version) ||
              !Array.isArray(payload.packages) ||
              payload.packages.length !== names.length ||
              !names.every((name) => payload.packages.includes(name))
            ) {
              throw new Error('npm API returned invalid verified release evidence');
            }
          } else if (
            response.status === 503 &&
            state === 'unavailable' &&
            ['registry_unavailable', 'registry_metadata_invalid', 'packages_not_converged'].includes(reason)
          ) {
            console.log(
              '::warning title=Public npm release unavailable::' +
                'Verified release API returned 503 (' + reason + '); checking public registry tags.'
            );
            // Read-only diagnostic, never a substitute for Worker verification.
            const packages = await Promise.all(
              names.map(async (name) => {
                const url = 'https://registry.npmjs.org/' +
                  encodeURIComponent(name).replace(/^%40/, '@');
                try {
                  const registryResponse = await fetch(url, {
                    headers: { Accept: 'application/vnd.npm.install-v1+json' },
                    redirect: 'error',
                    signal: AbortSignal.timeout(8_000),
                  });
                  if (!registryResponse.ok) {
                    return { name, status: registryResponse.status };
                  }
                  const registryData = await registryResponse.json();
                  const latest = registryData?.['dist-tags']?.latest;
                  return {
                    name,
                    status: registryResponse.status,
                    identityMatches: registryData?.name === name,
                    latest: typeof latest === 'string' ? latest : null,
                    versionExists: Object.hasOwn(registryData?.versions ?? {}, latest),
                  };
                } catch {
                  return { name, status: 'network_error' };
                }
              })
            );
            console.log('REGISTRY_TAG_PROBE ' + JSON.stringify(packages));
          } else {
            throw new Error('Unexpected npm API status or missing fail-closed metadata');
          }
          NODE
      - name: Smoke test deployed auth provider discovery
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node
          scripts/cloudflare-auth-provider-smoke.mjs
        env:
          WEBSITE_URL: ${{ env.STAGING_URL }}
          AUTH_API_URL: https://api.vellira.dev

      - name: Verify deployed identities, freshness and immutable bytes
        run: node apps/website/scripts/cloudflare-runtime-contract.mjs
        env:
          WEBSITE_URL: ${{ env.STAGING_URL }}

      - name: Verify staging Pro signup mode without provider writes
        run: node apps/website/scripts/pro-interest-live-smoke.mjs
        env:
          WEBSITE_URL: ${{ env.STAGING_URL }}
          PRO_INTEREST_EXPECTED_MODE: ${{ env.NEXT_PUBLIC_VELLIRA_PRO_INTEREST_ENABLED }}

      - name: Test browser and blog metrics smoke policies
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node --test
          scripts/cloudflare-browser-diagnostics.test.mjs
          scripts/cloudflare-blog-metrics-smoke-policy.test.mjs
          scripts/cloudflare-edge-recovery.test.mjs
          scripts/cloudflare-client-navigation-recovery.test.mjs

      - name: Verify component explorer browser geometry
        run: pnpm --filter @vellira-ui/website run test:component-explorer-geometry
        env:
          WEBSITE_URL: ${{ env.STAGING_URL }}

      - name: Smoke test navigation and actor metrics
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node
          scripts/cloudflare-website-smoke.mjs
        env:
          WEBSITE_URL: ${{ env.STAGING_URL }}
          BLOG_METRICS_PUBLICATION_MODE: staging-candidate

      - name: Soak test client navigation static assets
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node
          scripts/cloudflare-navigation-soak.mjs
        env:
          WEBSITE_URL: ${{ env.STAGING_URL }}
          BLOG_METRICS_PUBLICATION_MODE: staging-candidate

      - name: Smoke test static chunk integrity
        if: ${{ success() && steps.worker-deploy.outcome == 'success' }}
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node
          scripts/cloudflare-static-chunk-smoke.mjs
        env:
          WEBSITE_URL: ${{ env.STAGING_URL }}

      - name: Verify staging newsletter burst guard without provider writes
        run: node apps/website/scripts/newsletter-guard-live-smoke.mjs
        env:
          WEBSITE_URL: ${{ env.STAGING_URL }}
          NEWSLETTER_ABUSE_GUARD_EXPECTED_MODE: ${{ env.NEWSLETTER_ABUSE_GUARD_PREVIEW }}

      - name: Record staging evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const { waitForRuntimeStability } = await import(
            pathToFileURL(
              path.resolve('apps/website/scripts/cloudflare-runtime-stabilization.mjs')
            ).href
          );

          const build = JSON.parse(
            await fs.readFile('apps/website/.open-next/vellira-build.json', 'utf8')
          );
          const runtime = await waitForRuntimeStability({
            base: process.env.STAGING_URL,
            expectedBuildId: build.buildId,
          });

          const evidence = {
            schemaVersion: 1,
            sourceSha: process.env.CANDIDATE_SHA,
            sourceRef: process.env.GITHUB_REF,
            eventName: process.env.GITHUB_EVENT_NAME,
            buildId: build.buildId,
            workerVersion: runtime.workerVersion,
            stagingUrl: process.env.STAGING_URL,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            repository: process.env.GITHUB_REPOSITORY,
          };

          await fs.writeFile(
            'apps/website/.open-next/staging-evidence.json',
            `${JSON.stringify(evidence, null, 2)}\n`
          );
          console.log(JSON.stringify(evidence));
          NODE

      - name: Publish production promotion evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-staging-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: apps/website/.open-next/staging-evidence.json

      - name: Retain asset and browser forensic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          path: |
            apps/react-storybook/test-results/cloudflare-website-smoke/
            apps/react-storybook/test-results/cloudflare-auth-provider-smoke/
            apps/react-storybook/test-results/cloudflare-soak/
            apps/website/.open-next/asset-audit*.json
            apps/website/.open-next/archive-evidence.json
            apps/website/.open-next/route-cache-evidence.json
            apps/website/.open-next/vellira-build.json
            apps/website/.open-next/runtime-contract.json
            apps/website/.open-next/local-runtime-contract.json
            apps/website/.open-next/staging-evidence.json
            apps/website/.open-next/cache/
            apps/website/.next/*manifest.json
            apps/website/.next/BUILD_ID
            apps/website/.next/server/**/*manifest*
            apps/website/.next/static/chunks/webpack-*.js
