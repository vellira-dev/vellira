name: Issue 852 SocialProof token probe

on:
  push:
    branches:
      - probe/852-social-proof

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: probe/852-social-proof
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture baseline audit
        run: pnpm check:vellira-ui-usage:json > /tmp/vellira-ui-before.json

      - name: Apply exact SocialProof token migration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/website/src/sections/home/SocialProof/SocialProof.module.css';
          let source = fs.readFileSync(path, 'utf8');

          function replaceExact(before, after, expected) {
            const count = source.split(before).length - 1;
            if (count !== expected) {
              throw new Error(`${JSON.stringify(before)} expected ${expected} occurrences, got ${count}`);
            }
            source = source.split(before).join(after);
          }

          replaceExact('var(--text-tertiary)', 'var(--text-muted)', 7);
          replaceExact(
            'min-height: var(--space-9);',
            'min-height: calc(var(--space-8) + var(--space-1));',
            2
          );
          replaceExact(
            'min-height: calc(var(--space-11) + var(--space-1));',
            'min-height: var(--space-12);',
            1
          );
          replaceExact('font-size: var(--font-size-base);', 'font-size: var(--font-size-md);', 1);
          replaceExact('font-weight: 700;', 'font-weight: var(--font-weight-bold);', 5);
          replaceExact('font-weight: 600;', 'font-weight: var(--font-weight-semibold);', 2);

          fs.writeFileSync(path, source);
          NODE

      - name: Format migrated stylesheet
        run: pnpm exec prettier apps/website/src/sections/home/SocialProof/SocialProof.module.css --write

      - name: Verify exact audit delta
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:vellira-ui-usage:json > /tmp/vellira-ui-after.json
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('/tmp/vellira-ui-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('/tmp/vellira-ui-after.json', 'utf8'));
          const target = 'apps/website/src/sections/home/SocialProof/SocialProof.module.css';
          const beforeTarget = before.findings.filter((finding) => finding.path === target);
          const afterTarget = after.findings.filter((finding) => finding.path === target);

          if (beforeTarget.length !== 11) {
            throw new Error(`expected 11 baseline SocialProof findings on the #927 stack, got ${beforeTarget.length}`);
          }
          if (afterTarget.length !== 0) {
            throw new Error(`expected SocialProof findings 11 -> 0, got ${afterTarget.length}`);
          }
          if (before.summary.findings - after.summary.findings !== 11) {
            throw new Error(
              `expected global audit delta -11, got ${before.summary.findings} -> ${after.summary.findings}`
            );
          }

          const source = fs.readFileSync(target, 'utf8');
          for (const forbidden of [
            '--text-tertiary',
            '--space-9',
            '--space-11',
            '--font-size-base',
            'font-weight: 700;',
            'font-weight: 600;',
          ]) {
            if (source.includes(forbidden)) {
              throw new Error(`legacy/raw token usage remains: ${forbidden}`);
            }
          }

          console.log(`SocialProof findings: ${beforeTarget.length} -> ${afterTarget.length}`);
          console.log(`Global findings: ${before.summary.findings} -> ${after.summary.findings}`);
          NODE

      - name: Validate website
        run: |
          pnpm website:typecheck
          pnpm build
          pnpm website:build

      - name: Check diff
        run: git diff --check

      - name: Commit validated production tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-852-social-proof-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/website/src/sections/home/SocialProof/SocialProof.module.css \
            .github/workflows/issue-852-social-proof-probe.yml
          git commit -m 'refactor(website): migrate SocialProof to canonical tokens'
          git push origin HEAD:probe/852-social-proof
