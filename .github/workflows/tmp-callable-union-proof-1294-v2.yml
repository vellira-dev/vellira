name: Temporary callable union proof 1294 v2

on:
  push:
    branches:
      - tmp/api-doc-callable-proof-1294-v2

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check scripts/generate-api-docs.ts scripts/generate-api-docs.silent.test.ts
      - run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generate-api-docs.silent.test.ts
      - name: API docs check
        shell: bash
        run: |
          set +e
          pnpm docs:api:check
          status=$?
          echo "DOCS_API_STATUS=$status" >> "$GITHUB_ENV"
          set -e
      - name: Generate API docs for diff evidence
        if: env.DOCS_API_STATUS != '0'
        run: pnpm docs:api
      - name: Capture diff
        shell: bash
        run: |
          mkdir -p .artifacts
          git diff --binary > .artifacts/generated.patch
          git status --short > .artifacts/status.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: callable-proof-1294-v2
          path: .artifacts
          if-no-files-found: error
