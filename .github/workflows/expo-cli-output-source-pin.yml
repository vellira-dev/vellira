name: Expo CLI Output Source Pin

on:
  pull_request:
    paths:
      - '.github/workflows/expo-cli-output-source-pin.yml'
      - 'examples/workspace-starter/native/scripts/security-expo-output-source-pin.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-source-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: examples/workspace-starter/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - name: Install exact native lockfile
        run: npm ci --no-audit --no-fund
      - name: Pin installed Expo CLI Zod output source
        run: node scripts/security-expo-output-source-pin.cjs
      - name: Preserve RSA backport
        run: npm run security:verify-patch
