name: Dashboard Starter Parity

# Run on every branch push and every PR targeting main, including changes
# outside the website. Do not add path filters: drift can originate on either side.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dashboard-starter-parity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Dashboard Starter Parity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up pinned Node.js (no dependency install)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - name: Fail if website Dashboard differs from runnable Vite source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          node scripts/website/sync-dashboard-starter.mjs --check
          printf '### Dashboard Starter Parity\n\nVerified commit: `%s`\n\nWebsite Dashboard JSX/CSS exactly match the runnable Vite Starter (with the documented import-path adjustment).\n' "$actual" >> "$GITHUB_STEP_SUMMARY"
