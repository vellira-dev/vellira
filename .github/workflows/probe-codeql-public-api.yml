name: Probe CodeQL Public API Regex

on:
  push:
    branches:
      - probe/codeql-public-api-985-d10d621

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply CodeQL regex escaping fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('scripts/checks/token-semantic/public-api.ts')
          source = source_path.read_text()

          helper_anchor = "}\n\nexport function auditPublicCompatibilityAlias"
          helper = """}\n\nexport function escapeRegExpLiteral(value: string): string {\n  return value.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n}\n\nexport function auditPublicCompatibilityAlias"""
          if source.count(helper_anchor) != 1:
              raise SystemExit('public-api helper anchor mismatch')
          source = source.replace(helper_anchor, helper, 1)

          old = """    const escapedRemoveIn = alias.removeIn.replace(/\\./g, '\\\\.');\n    const annotationPattern = new RegExp(\n      `@deprecated[\\\\s\\\\S]*Use [^\\\\n]*${alias.replacementExport}[^\\\\n]*directly[\\\\s\\\\S]*${escapedRemoveIn}[\\\\s\\\\S]*export const ${alias.exportName}\\\\b`\n    );"""
          new = """    const annotationPattern = new RegExp(\n      `@deprecated[\\\\s\\\\S]*Use [^\\\\n]*${escapeRegExpLiteral(alias.replacementExport)}[^\\\\n]*directly[\\\\s\\\\S]*${escapeRegExpLiteral(alias.removeIn)}[\\\\s\\\\S]*export const ${escapeRegExpLiteral(alias.exportName)}\\\\b`\n    );"""
          if source.count(old) != 1:
              raise SystemExit('public-api annotation regex anchor mismatch')
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path('scripts/checks/token-semantic/public-api.test.ts')
          test = test_path.read_text()
          import_old = """  auditPublicCompatibilityAlias,\n  checkTokenPublicApi,"""
          import_new = """  auditPublicCompatibilityAlias,\n  checkTokenPublicApi,\n  escapeRegExpLiteral,"""
          if test.count(import_old) != 1:
              raise SystemExit('public-api test import anchor mismatch')
          test = test.replace(import_old, import_new, 1)

          test_anchor = "\n});\n"
          regression = r'''

  it('escapes every regex metacharacter in public API policy literals', () => {
    const literal = String.raw`theme.v3\\legacy+name?(draft)[x]{2}|^$`;
    const pattern = new RegExp(`^${escapeRegExpLiteral(literal)}$`);

    expect(pattern.test(literal)).toBe(true);
    expect(pattern.test('themeXv3\\legacy+name?(draft)[x]{2}|^$')).toBe(false);
  });
'''
          if not test.endswith(test_anchor):
              raise SystemExit('public-api test closing anchor mismatch')
          test_path.write_text(test[:-len(test_anchor)] + regression + test_anchor)
          PY
          pnpm exec prettier \
            scripts/checks/token-semantic/public-api.ts \
            scripts/checks/token-semantic/public-api.test.ts \
            --write
      - name: Validate focused public API audit
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/checks/token-semantic/public-api.test.ts
      - name: Validate tooling TypeScript
        run: pnpm typecheck:tooling
      - name: Publish exact candidate
        shell: bash
        run: |
          git diff --check
          git config user.name 'Roman Bakurov'
          git config user.email 'ronbakurov@gmail.com'
          git add \
            scripts/checks/token-semantic/public-api.ts \
            scripts/checks/token-semantic/public-api.test.ts
          git commit -m 'fix(tokens): escape public API annotation regex'
          git push origin HEAD:probe/codeql-public-api-985-d10d621
