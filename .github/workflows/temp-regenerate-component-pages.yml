name: Temporary regenerate component pages

on:
  push:
    branches:
      - fix/expo-patch-generated-pages

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: fix/expo-patch-generated-pages

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2

      - run: pnpm install --frozen-lockfile

      - name: Regenerate canonical component pages
        run: pnpm component-pages:generate

      - name: Validate generated diff scope
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --short | awk '{print $2}' | grep -v '^apps/website/src/component-catalog/' | grep -v '^.github/workflows/temp-regenerate-component-pages.yml$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Generator changed unexpected paths:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit generated output and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temp-regenerate-component-pages.yml
          git add apps/website/src/component-catalog .github/workflows/temp-regenerate-component-pages.yml
          if git diff --cached --quiet; then
            echo "No generated changes produced"
            exit 1
          fi
          git commit -m "chore: regenerate component pages for Expo patch"
          git push origin HEAD:fix/expo-patch-generated-pages
