name: Probe #852 ProductInterfaceDemo tokens

on:
  push:
    branches:
      - probe/852-product-interface-demo-tokens

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            ref: 2aa6278eaac2e46feba886af4939924605999815
          - label: candidate
            ref: 6faed909c0d5b77fa5b7f1c9fbd400346b3908d7
    name: audit-${{ matrix.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:build
      - name: Run dedicated Vellira UI usage audit
        run: |
          pnpm check:vellira-ui-usage:json > /tmp/vellira-ui-usage.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/vellira-ui-usage.json', 'utf8'));
          const target = 'apps/website/src/sections/home/ProductInterfaceDemo/ProductInterfaceDemo.module.css';
          const targetFindings = report.findings.filter((finding) => finding.path === target);
          const byRule = Object.fromEntries(
            [...new Set(report.findings.map((finding) => finding.ruleId))]
              .sort()
              .map((ruleId) => [
                ruleId,
                report.findings.filter((finding) => finding.ruleId === ruleId).length,
              ])
          );
          console.log(JSON.stringify({
            label: process.env.MATRIX_LABEL,
            revision: process.env.MATRIX_REF,
            summary: report.summary,
            byRule,
            targetFindings: targetFindings.map(({ ruleId, path, line, detected, canonicalAlternative }) => ({
              ruleId,
              path,
              line,
              detected,
              canonicalAlternative,
            })),
          }, null, 2));
          NODE
        env:
          MATRIX_LABEL: ${{ matrix.label }}
          MATRIX_REF: ${{ matrix.ref }}
