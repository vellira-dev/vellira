name: Temporary body-parser lockfile bootstrap

on:
  push:
    branches:
      - 'security/patch-body-parser-branches-20261024'

permissions:
  contents: write

concurrency:
  group: temporary-body-parser-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  lockfile:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'chore(security): seed bounded body-parser overrides'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable branch and authoring
        env:
          EXPECTED_REF: 'refs/heads/security/patch-body-parser-branches-20261024'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          cache: pnpm
      - name: Regenerate dependency graph without policy exceptions
        run: pnpm install --lockfile-only
      - name: Verify both parser major lines and retained patch provenance
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const before = execFileSync('git', ['show', process.env.GITHUB_SHA + ':pnpm-lock.yaml'], {encoding: 'utf8'});
          const after = readFileSync('pnpm-lock.yaml', 'utf8');
          for (const v of ['body-parser@1.20.6:', 'body-parser@2.3.0:']) {
            assert.ok(!after.includes('\n  ' + v), 'old vulnerable package retained: ' + v);
          }
          for (const v of ['body-parser@1.20.9:', 'body-parser@2.4.0:']) {
            assert.ok(after.includes('\n  ' + v), 'missing patched package: ' + v);
          }
          for (const pkg of ['node-forge@1.4.0','next@16.4.2','@opennextjs/cloudflare@1.20.12','wrangler@4.136.3']) {
            const escape = pkg.replace(/[./]/g, '\\$&');
            const pattern = new RegExp("  '?" + escape + '\\(patch_hash=[a-f0-9]+\\)', 'g');
            const beforeMatches = before.match(pattern) ?? [];
            const afterMatches = after.match(pattern) ?? [];
            assert.ok(beforeMatches.length > 0, 'missing source patch binding: ' + pkg);
            assert.deepEqual([...new Set(afterMatches)].sort(), [...new Set(beforeMatches)].sort(), 'patch authority drift: ' + pkg);
          }
          assert.ok(after.includes('sharp: 0.35.5'), 'sharp security authority missing');
          NODE
          git diff --check
          test -n "$(git diff --name-only -- pnpm-lock.yaml)"
          test -z "$(git diff --name-only -- . ':!pnpm-lock.yaml')"
      - name: Verify a reproducible frozen install
        run: |
          pnpm install --frozen-lockfile
          node --test scripts/ci/security-patched-dependencies.test.mjs
      - name: Commit only generated lockfile to the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          git diff --cached --check
          git commit -m 'chore(security): regenerate patched body-parser lockfile'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin 'HEAD:refs/heads/security/patch-body-parser-branches-20261024'
