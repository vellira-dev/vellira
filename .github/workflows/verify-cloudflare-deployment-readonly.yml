name: Verify Cloudflare Staging Deployment ID (Read Only)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact current main SHA (40 lowercase hex)'
        required: true
        type: string
      staging_run_id:
        description: 'Existing staging run ID with a completed Wrangler step'
        required: true
        type: string
      staging_run_attempt:
        description: 'Existing staging run attempt'
        required: true
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vellira-cloudflare-deployment-readproof
  cancel-in-progress: false

jobs:
  verify:
    name: Cross-check active deployment and runtime identity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted verification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Verify existing deployment without Cloudflare writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.candidate_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          STAGING_RUN_ATTEMPT: ${{ inputs.staging_run_attempt }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_READ_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_READ_TOKEN }}
        run: node apps/website/scripts/cloudflare-deployment-readproof.mjs
