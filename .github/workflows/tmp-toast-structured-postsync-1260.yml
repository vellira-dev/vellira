name: Temporary Toast structured post-sync validation 1260

on:
  push:
    branches:
      - tmp/toast-structured-postsync-1260

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - name: Run structured validation
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseComponentProductionInput } from './scripts/component-production/contracts.ts';
          import { runComponentProductionStructuredValidation } from './scripts/component-production/structured-validation.ts';

          const input = parseComponentProductionInput(
            JSON.parse(
              fs.readFileSync(
                'scripts/component-production/specs/Toast.json',
                'utf8'
              )
            )
          );

          const result = await runComponentProductionStructuredValidation({
            root: process.cwd(),
            input,
          });

          console.log(JSON.stringify(result, null, 2));
          NODE
