name: Temporary Toast targeted canonical sync 1260

on:
  push:
    branches:
      - tmp/toast-targeted-sync-1260

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - run: pnpm install --frozen-lockfile

      - name: Synchronize deterministic Toast ownership
        shell: bash
        run: |
          mkdir -p artifacts
          node --import tsx --input-type=module <<'NODE' > artifacts/result.json
          import fs from 'node:fs';
          import path from 'node:path';

          import {
            parseComponentProductionInput,
            createComponentProductionGeneratorOptions,
          } from './scripts/component-production/contracts.ts';
          import { createComponentGenerationPlan } from './scripts/generators/component/plan.ts';
          import {
            createComponentMetadataFromPlan,
            createMetadataTemplateParamsFromPlan,
          } from './scripts/generators/component/metadata.ts';
          import { renderMetadataTemplate } from './scripts/generators/component/templates/index.ts';
          import { formatGeneratedContent } from './scripts/generators/format-generated-files.ts';
          import { generateComponentDocumentation } from './scripts/generators/component/docs.ts';
          import {
            synchronizeComponentTokenArchitectureRegistration,
            checkComponentTokenArchitectureRegistration,
          } from './scripts/generators/component/token-architecture-registration-contract.ts';
          import { checkGeneratedPlanContract } from './scripts/generators/component/plan-contract.ts';

          const root = process.cwd();
          const input = parseComponentProductionInput(
            JSON.parse(
              fs.readFileSync(
                'scripts/component-production/specs/Toast.json',
                'utf8'
              )
            )
          );
          const plan = createComponentGenerationPlan({
            root,
            options: createComponentProductionGeneratorOptions(input),
          });

          const architectureResult = { updatedFiles: [] };
          await synchronizeComponentTokenArchitectureRegistration({
            plan,
            result: architectureResult,
          });

          const metadataSource = await formatGeneratedContent(
            plan.metadataFile,
            renderMetadataTemplate(createMetadataTemplateParamsFromPlan(plan))
          );
          const metadataChanged =
            !fs.existsSync(plan.metadataFile) ||
            fs.readFileSync(plan.metadataFile, 'utf8') !== metadataSource;
          fs.writeFileSync(plan.metadataFile, metadataSource);

          const createdFiles = [];
          const updatedFiles = [];
          await generateComponentDocumentation({
            root,
            plan,
            metadata: createComponentMetadataFromPlan(plan),
            createdFiles,
            updatedFiles,
          });

          const architectureDrift =
            await checkComponentTokenArchitectureRegistration(plan);
          const planDrift = await checkGeneratedPlanContract(plan);

          const normalize = (file) =>
            path.relative(root, file).split(path.sep).join('/');

          const result = {
            architectureUpdated: architectureResult.updatedFiles.map(normalize),
            metadataChanged,
            docsCreated: createdFiles.map(normalize),
            docsUpdated: updatedFiles.map(normalize),
            architectureDrift,
            planDrift: planDrift.map(normalize),
          };

          console.log(JSON.stringify(result, null, 2));

          if (architectureDrift.length > 0 || planDrift.length > 0) {
            process.exitCode = 1;
          }
          NODE

      - name: Canonical downstream checks
        run: |
          pnpm docs:api:check
          pnpm component-docs:check
          pnpm check:tokens-semantic:strict

      - name: Capture targeted diff
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/files
          git diff --binary > artifacts/targeted.patch
          git status --short > artifacts/status.txt
          git diff --name-only > artifacts/changed-files.txt
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            mkdir -p "artifacts/files/$(dirname "$file")"
            cp "$file" "artifacts/files/$file"
          done < artifacts/changed-files.txt
          cat artifacts/result.json || true
          cat artifacts/status.txt || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: toast-targeted-sync-1260
          path: artifacts
          if-no-files-found: error
