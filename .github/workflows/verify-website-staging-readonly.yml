name: Verify Existing Website Staging (Read Only)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact SHA of current main, 40 lowercase hex characters.'
        required: true
        type: string
      staging_run_id:
        description: 'Existing staging GitHub Actions run ID (no new deployment).'
        required: true
        type: string
      staging_run_attempt:
        description: 'Exact existing staging run attempt.'
        required: true
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vellira-staging-readonly-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify live immutable staging identity without deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted main verification logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Read-only verification of existing staging build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.candidate_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          STAGING_RUN_ATTEMPT: ${{ inputs.staging_run_attempt }}
        run: node apps/website/scripts/cloudflare-staging-readonly-verify.mjs
