name: Expo Zod Pinned Runtime Guard

on:
  pull_request:
    paths:
      - '.github/workflows/expo-zod-pinned-patch-candidate.yml'
      - 'examples/workspace-starter/native/scripts/security-expo-58-guard.cjs'
      - 'examples/workspace-starter/native/package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: examples/workspace-starter/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
      - run: npm ci --no-audit --no-fund
      - name: Verify installed Expo guard after normal npm ci
        run: node scripts/security-expo-58-guard.cjs --verify
      - name: Verify repeated application is idempotent
        run: |
          node scripts/security-expo-58-guard.cjs --apply
          node scripts/security-expo-58-guard.cjs --apply
          node scripts/security-expo-58-guard.cjs --verify
      - name: Reject modified Expo CLI bytes (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          target=node_modules/expo/node_modules/@expo/cli/build/src/start/server/DevToolsPluginCliExtensionResults.js
          cp "$target" "$target.backup"
          trap 'mv -f "$target.backup" "$target"' EXIT
          printf '\n// tamper fixture\n' >> "$target"
          if node scripts/security-expo-58-guard.cjs --verify; then
            echo '::error::Tampered installed Expo CLI was accepted'
            exit 1
          fi
      - name: Preserve existing RSA patch
        run: npm run security:verify-patch
