name: Expo Zod Pinned Patch Candidate

on:
  pull_request:
    paths:
      - '.github/workflows/expo-zod-pinned-patch-candidate.yml'
      - 'examples/workspace-starter/native/scripts/security-expo-zod-patch-candidate.cjs'
      - 'examples/workspace-starter/native/scripts/security-expo-zod-negative-runtime-proof.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: examples/workspace-starter/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - run: npm ci --no-audit --no-fund
      - name: Verify exact original bytes and source-shape candidate
        run: node scripts/security-expo-zod-patch-candidate.cjs
      - name: Reject candidate through real installed runtime negative test
        run: node scripts/security-expo-zod-negative-runtime-proof.cjs
      - name: Preserve existing RSA patch
        run: npm run security:verify-patch
