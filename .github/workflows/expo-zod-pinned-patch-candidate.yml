name: Expo CLI 58 Schema Output Security Guard

on:
  pull_request:
    paths:
      - '.github/workflows/expo-zod-pinned-patch-candidate.yml'
      - 'examples/workspace-starter/native/scripts/security-expo-58-guard.cjs'
      - 'examples/workspace-starter/native/package.json'
      - 'examples/workspace-starter/native/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: examples/workspace-starter/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
      - name: Install exact published Expo package and source guard
        run: npm ci --no-audit --no-fund
      - name: Source-pinned guard must be idempotent and work with Expo's JSON Schema validator
        run: |
          node scripts/security-expo-58-guard.cjs --apply
          node scripts/security-expo-58-guard.cjs --apply
          npm run security:verify-patch
          node scripts/security-expo-58-executor-proof.cjs
      - name: Reject modified installed Expo CLI source
        shell: bash
        run: |
          set -euo pipefail
          target=node_modules/expo/node_modules/@expo/cli/build/src/start/server/devtools/DevToolsPluginCliExtensionResults.js
          cp "$target" "$RUNNER_TEMP/good-parser.js"
          printf '\n// changed from verified source\n' >> "$target"
          if node scripts/security-expo-58-guard.cjs --verify; then
            echo '::error::Tampered Expo CLI parser unexpectedly passed'
            exit 1
          fi
          cp "$RUNNER_TEMP/good-parser.js" "$target"
          npm run security:verify-patch
