name: Temporary refresh semantic-release lockfile

on:
  push:
    branches:
      - chore/semantic-release-npm-13-2-0

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: chore/semantic-release-npm-13-2-0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Validate direct dependency
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if (p.devDependencies['@semantic-release/npm'] !== '^13.2.0') process.exit(1)"
          grep -q "'@semantic-release/npm@13.2.0'" pnpm-lock.yaml

      - name: Validate generated diff scope
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --short | awk '{print $2}' | grep -v '^pnpm-lock.yaml$' | grep -v '^.github/workflows/temp-refresh-semantic-release-lockfile.yml$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Lockfile refresh changed unexpected paths:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit lockfile and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temp-refresh-semantic-release-lockfile.yml
          git add pnpm-lock.yaml .github/workflows/temp-refresh-semantic-release-lockfile.yml
          git commit -m "chore(deps-dev): refresh semantic-release lockfile"
          git push origin HEAD:chore/semantic-release-npm-13-2-0
