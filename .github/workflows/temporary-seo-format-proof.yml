name: Temporary SEO formatting proof
on:
  push:
    branches:
      - fix/seo-server-render-component-code-20261013
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Print Prettier canonical form without pushing changes
        run: |
          npm exec --yes --package=prettier@3.9.8 -- prettier scripts/website/component-code-ssr.test.tsx --write
          echo '--- SEO_FORMAT_START ---'
          cat scripts/website/component-code-ssr.test.tsx
          echo '--- SEO_FORMAT_END ---'
          git diff --check
