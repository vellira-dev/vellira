name: Supersede Stale Production Promotions

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Deploy Website Cloudflare Production']
    types: [requested, in_progress]

permissions:
  actions: write
  contents: read

concurrency:
  group: supersede-stale-production-promotions
  cancel-in-progress: true

jobs:
  supersede:
    name: Keep only the latest safe production approval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          package-manager-cache: false

      - name: Supersede stale production promotions
        run: node apps/website/scripts/cloudflare-production-promotion-supersede.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
