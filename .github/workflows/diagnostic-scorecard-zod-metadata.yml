name: Bounded Zod Chromium BiDi metadata audit
on:
  push:
    branches:
      - diagnostic/scorecard-zod-bidi-metadata-20261117
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
      - name: Inspect published npm dependency metadata without installing
        shell: bash
        run: |
          set -euo pipefail
          npm config set fetch-retries 1
          for pkg in \
            chromium-bidi@14.0.0 \
            chromium-bidi@157.0.8090-0 \
            chromium-bidi@159.0.8154-11 \
            puppeteer-core@24.43.1 \
            puppeteer-core@25.17.0 \
            lighthouse@12.6.1 \
            @lhci/cli@0.15.1; do
            echo "::group::$pkg"
            npm view "$pkg" version dependencies --json
            echo "::endgroup::"
          done
