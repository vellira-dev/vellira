name: PR 985 tooling regression probe

on:
  push:
    branches: [probe/pr985-tooling-regression-20260910]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      HUSKY: '0'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify candidate formatting and identity
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p .artifacts/pr985-tooling
          files=(
            scripts/checks/token-semantic/cli.test.ts
            scripts/generators/component-page/audit-options.ts
            scripts/generators/component-page/audit-options.test.ts
            scripts/generators/component-page/audit-component-pages.ts
            scripts/generators/component-page/cli.test.ts
            scripts/generators/component-page/README.md
          )
          pnpm exec prettier "${files[@]}" --check
          git ls-files -s -- "${files[@]}" > .artifacts/pr985-tooling/source-blobs.txt
          { git rev-parse HEAD; node --version; pnpm --version; pnpm exec tsc --version; } > .artifacts/pr985-tooling/environment.txt
      - name: Build the normal CI surfaces
        run: |
          set -euo pipefail
          pnpm ci:build 2>&1 | tee .artifacts/pr985-tooling/build.log
      - name: Authoritative tooling typecheck
        run: |
          set -euo pipefail
          pnpm typecheck:tooling 2>&1 | tee .artifacts/pr985-tooling/typecheck.log
      - name: Full tooling suite without filters or retries
        run: |
          set -euo pipefail
          pnpm test:tooling 2>&1 | tee .artifacts/pr985-tooling/tooling.log
      - name: Verify the default full catalog audit
        run: |
          set -euo pipefail
          pnpm component-pages:audit 2>&1 | tee .artifacts/pr985-tooling/catalog-audit.log
      - name: Verify semantic report and unchanged authorities
        run: |
          set -euo pipefail
          pnpm --silent check:tokens-semantic:json > .artifacts/pr985-tooling/report.json
          git diff --check
          git diff --exit-code -- scripts/checks/token-semantic scripts/generators/component-page packages/tokens/src/preservation
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr985-tooling-probe-evidence
          path: .artifacts/pr985-tooling/
          if-no-files-found: error
          retention-days: 3
