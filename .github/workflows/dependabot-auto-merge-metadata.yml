name: Dependabot Auto Merge Metadata

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  inspect:
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ github.token }}

      - name: Write immutable auto-merge decision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          mkdir -p .dependabot-auto-merge
          node <<'NODE'
          const fs = require('node:fs');

          const pullRequestNumber = Number(process.env.PR_NUMBER);
          const headSha = process.env.PR_HEAD_SHA ?? '';
          const updateType = process.env.UPDATE_TYPE ?? '';

          if (!Number.isSafeInteger(pullRequestNumber) || pullRequestNumber <= 0) {
            throw new Error('Dependabot pull request number must be a positive integer');
          }
          if (!/^[0-9a-f]{40}$/.test(headSha)) {
            throw new Error('Dependabot pull request head must be an exact SHA');
          }

          const decision = {
            schemaVersion: 1,
            repository: process.env.REPOSITORY,
            pullRequestNumber,
            author: process.env.PR_AUTHOR,
            headSha,
            baseRef: process.env.PR_BASE_REF,
            updateType,
            eligible: updateType === 'version-update:semver-patch',
          };

          fs.writeFileSync(
            '.dependabot-auto-merge/decision.json',
            `${JSON.stringify(decision, null, 2)}\n`,
            'utf8'
          );
          console.log(JSON.stringify(decision));
          NODE

      - name: Upload auto-merge decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-auto-merge-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: .dependabot-auto-merge/decision.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  inspect-security-remediation:
    if: >
      github.event.pull_request.user.login == 'vellira-release-sync[bot]' &&
      github.event.pull_request.head.ref == 'automation/dependabot-security-remediation' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Validate immutable remediation envelope
        id: envelope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$PR_TITLE" = 'chore(security): remediate dependency alerts'

          gh api --paginate \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            | jq -s 'add | map(.filename) | sort' \
            > /tmp/security-remediation-files.json

          node <<'NODE'
          const fs = require('node:fs');

          const files = JSON.parse(
            fs.readFileSync('/tmp/security-remediation-files.json', 'utf8')
          );
          const allowed = new Set(['pnpm-lock.yaml', 'pnpm-workspace.yaml']);
          const unexpected = files.filter((file) => !allowed.has(file));
          if (files.length === 0 || unexpected.length > 0) {
            throw new Error(
              `Security remediation has forbidden changed files: ${unexpected.join(', ')}`
            );
          }
          const body = process.env.PR_BODY ?? '';
          const marker =
            /<!-- vellira-security-remediation-v1 base-sha=([0-9a-f]{40}) head-sha=([0-9a-f]{40}) source-run=([0-9]+) source-attempt=([0-9]+) audit-level=(high|low) scope=(development) -->/.exec(
              body
            );
          if (!marker) {
            throw new Error(
              'Security remediation provenance marker is missing or malformed'
            );
          }
          if (
            !/^[0-9a-f]{40}$/.test(process.env.PR_BASE_SHA ?? '') ||
            !/^[0-9a-f]{40}$/.test(process.env.PR_HEAD_SHA ?? '')
          ) {
            throw new Error(
              'Security remediation current PR base/head must be exact SHAs'
            );
          }

          const sourceRunId = Number(marker[3]);
          const sourceRunAttempt = Number(marker[4]);
          if (
            !Number.isSafeInteger(sourceRunId) ||
            sourceRunId <= 0 ||
            !Number.isSafeInteger(sourceRunAttempt) ||
            sourceRunAttempt <= 0
          ) {
            throw new Error('Security remediation source run identity is invalid');
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `candidate_base_sha=${marker[1]}\n` +
              `candidate_head_sha=${marker[2]}\n` +
              `source_run_id=${sourceRunId}\n` +
              `source_run_attempt=${sourceRunAttempt}\n` +
              `audit_level=${marker[5]}\n` +
              `dependency_scope=${marker[6]}\n`
          );
          NODE

      - name: Validate trusted remediation source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_BASE_SHA: ${{ steps.envelope.outputs.candidate_base_sha }}
          SOURCE_RUN_ID: ${{ steps.envelope.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.envelope.outputs.source_run_attempt }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            > /tmp/security-remediation-source-run.json

          node <<'NODE'
          const fs = require('node:fs');

          const run = JSON.parse(
            fs.readFileSync(
              '/tmp/security-remediation-source-run.json',
              'utf8'
            )
          );
          const expectedRunId = Number(process.env.SOURCE_RUN_ID);
          const expectedAttempt = Number(process.env.SOURCE_RUN_ATTEMPT);
          const expectedBaseSha = process.env.EXPECTED_BASE_SHA ?? '';

          if (run.id !== expectedRunId) {
            throw new Error('Security remediation source run ID mismatch');
          }
          if (run.run_attempt !== expectedAttempt) {
            throw new Error('Security remediation source run attempt mismatch');
          }
          if (
            run.path !==
            '.github/workflows/dependabot-security-remediation.yml'
          ) {
            throw new Error('Security remediation source workflow mismatch');
          }
          if (run.head_branch !== 'main') {
            throw new Error('Security remediation source must run from main');
          }
          if (
            !/^[0-9a-f]{40}$/.test(expectedBaseSha) ||
            run.head_sha !== expectedBaseSha
          ) {
            throw new Error(
              'Security remediation source run does not match the exact candidate base'
            );
          }
          if (
            run.event !== 'schedule' &&
            run.event !== 'workflow_dispatch' &&
            run.event !== 'push'
          ) {
            throw new Error('Security remediation source event is not trusted');
          }
          if (run.repository?.full_name !== process.env.REPOSITORY) {
            throw new Error('Security remediation source repository mismatch');
          }
          NODE

      - name: Download immutable remediation candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependabot-security-remediation-candidate-${{ steps.envelope.outputs.source_run_id }}-${{ steps.envelope.outputs.source_run_attempt }}
          path: /tmp/security-remediation-source
          run-id: ${{ steps.envelope.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Authenticate immutable remediation candidate
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_BASE_SHA: ${{ steps.envelope.outputs.candidate_base_sha }}
          CANDIDATE_HEAD_SHA: ${{ steps.envelope.outputs.candidate_head_sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUDIT_LEVEL: ${{ steps.envelope.outputs.audit_level }}
          DEPENDENCY_SCOPE: ${{ steps.envelope.outputs.dependency_scope }}
          SOURCE_RUN_ID: ${{ steps.envelope.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.envelope.outputs.source_run_attempt }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const candidate = JSON.parse(
            fs.readFileSync(
              '/tmp/security-remediation-source/candidate.json',
              'utf8'
            )
          );

          const sourceRun = JSON.parse(
            fs.readFileSync(
              '/tmp/security-remediation-source-run.json',
              'utf8'
            )
          );
          const expected = {
            repository: process.env.REPOSITORY,
            baseSha: process.env.CANDIDATE_BASE_SHA,
            headSha: process.env.CANDIDATE_HEAD_SHA,
            branch: process.env.PR_HEAD_REF,
            auditLevel: process.env.AUDIT_LEVEL,
            dependencyScope: process.env.DEPENDENCY_SCOPE,
            sourceRunId: Number(process.env.SOURCE_RUN_ID),
            sourceRunAttempt: Number(process.env.SOURCE_RUN_ATTEMPT),
            sourceEvent: sourceRun.event,
          };
          const validPackageList = (value) =>
            Array.isArray(value) &&
            value.length > 0 &&
            value.every(
              (entry) => typeof entry === 'string' && entry.length > 0
            );
          const validGhsaList = (value) =>
            Array.isArray(value) &&
            value.every(
              (entry) =>
                typeof entry === 'string' &&
                /^GHSA-[23456789cfghjmpqrvwx]{4}-[23456789cfghjmpqrvwx]{4}-[23456789cfghjmpqrvwx]{4}$/i.test(
                  entry
                )
            );
          const validRegistryUnavailablePatches = (value) =>
            Array.isArray(value) &&
            value.every(
              (entry) =>
                entry &&
                typeof entry === 'object' &&
                !Array.isArray(entry) &&
                validGhsaList([entry.ghsaId]) &&
                typeof entry.package === 'string' &&
                entry.package.length > 0 &&
                typeof entry.firstPatchedVersion === 'string' &&
                entry.firstPatchedVersion.length > 0
            ) &&
            new Set(
              value.map(
                (entry) =>
                  `${entry.ghsaId}\0${entry.package}\0${entry.firstPatchedVersion}`
              )
            ).size === value.length;
          const validAuditGapMaterializations = (value) =>
            value &&
            typeof value === 'object' &&
            !Array.isArray(value) &&
            value.schemaVersion === 1 &&
            Array.isArray(value.packages) &&
            value.packages.every(
              (entry) => typeof entry === 'string' && entry.length > 0
            ) &&
            Array.isArray(value.materializations) &&
            value.materializations.every(
              (entry) =>
                entry &&
                typeof entry === 'object' &&
                !Array.isArray(entry) &&
                typeof entry.package === 'string' &&
                value.packages.includes(entry.package) &&
                typeof entry.vulnerableVersionRange === 'string' &&
                entry.vulnerableVersionRange.length > 0 &&
                typeof entry.selector === 'string' &&
                entry.selector.length > 0 &&
                typeof entry.target === 'string' &&
                entry.target.length > 0 &&
                typeof entry.releaseAgeEntry === 'string' &&
                entry.releaseAgeEntry.length > 0 &&
                Array.isArray(entry.alertNumbers) &&
                entry.alertNumbers.every(Number.isSafeInteger) &&
                Array.isArray(entry.ghsaIds) &&
                validGhsaList(entry.ghsaIds)
            );

          if (
            candidate.schemaVersion !== 1 ||
            candidate.kind !== 'dependabot-security-remediation' ||
            candidate.workflowPath !==
              '.github/workflows/dependabot-security-remediation.yml' ||
            candidate.repository !== expected.repository ||
            candidate.baseSha !== expected.baseSha ||
            candidate.headSha !== expected.headSha ||
            candidate.branch !== expected.branch ||
            candidate.auditLevel !== expected.auditLevel ||
            candidate.dependencyScope !== expected.dependencyScope ||
            expected.dependencyScope !== 'development' ||
            candidate.sourceRunId !== expected.sourceRunId ||
            candidate.sourceRunAttempt !== expected.sourceRunAttempt ||
            candidate.sourceEvent !== expected.sourceEvent ||
            !['schedule', 'workflow_dispatch', 'push'].includes(
              candidate.sourceEvent
            ) ||
            (candidate.sourceEvent === 'push'
              ? !/^[0-9a-f]{40}$/.test(candidate.sourceBeforeSha ?? '')
              : candidate.sourceBeforeSha !== null) ||
            (candidate.sourceEvent === 'push' &&
              candidate.auditLevel !== 'low') ||
            !validPackageList(candidate.authorizedPackages) ||
            !validPackageList(candidate.changedPackages) ||
            candidate.changedPackages.some(
              (packageName) =>
                !candidate.authorizedPackages.includes(packageName)
            ) ||
            !validGhsaList(candidate.ignoredRuntimeGhsas) ||
            !validRegistryUnavailablePatches(
              candidate.registryUnavailablePatches
            ) ||
            !validAuditGapMaterializations(
              candidate.auditGapMaterializations
            )
          ) {
            throw new Error(
              'Security remediation candidate artifact does not authenticate the immutable source candidate'
            );
          }
          NODE

      - name: Validate bounded self-proof push provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.envelope.outputs.candidate_base_sha }}
        run: |
          set -euo pipefail

          source_event="$(
            jq -r '.sourceEvent'               /tmp/security-remediation-source/candidate.json
          )"
          if [[ "$source_event" != "push" ]]; then
            exit 0
          fi

          before_sha="$(
            jq -r '.sourceBeforeSha'               /tmp/security-remediation-source/candidate.json
          )"
          [[ "$before_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Self-proof candidate is missing an exact before SHA."
            exit 1
          }

          gh api             -H "Accept: application/vnd.github+json"             "repos/$REPOSITORY/commits/$BASE_SHA/pulls?per_page=100"             > /tmp/security-remediation-source-pulls.json
          jq -e             --arg sha "$BASE_SHA"             --arg before "$before_sha"             '
              [
                .[]
                | select(.state == "closed")
                | select(.merged_at != null)
                | select(.merge_commit_sha == $sha)
                | select(.base.ref == "main")
                | select(.base.sha == $before)
              ] | length == 1
            '             /tmp/security-remediation-source-pulls.json             > /dev/null || {
              echo "::error::Self-proof source is not one exact protected pull request merge."
              exit 1
            }

          gh api "repos/$REPOSITORY/compare/$before_sha...$BASE_SHA"             > /tmp/security-remediation-source-compare.json
          mapfile -t changed_files < <(
            jq -r '.files[].filename'               /tmp/security-remediation-source-compare.json
          )
          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "::error::Self-proof source compare contains no authority changes."
            exit 1
          fi

          for file in "${changed_files[@]}"; do
            case "$file" in
              .github/workflows/dependabot-security-remediation.yml|.github/workflows/dependabot-auto-merge-metadata.yml|.github/workflows/dependabot-auto-merge.yml|scripts/ci/dependabot-security-remediation.mjs|scripts/ci/dependabot-security-remediation.test.mjs|scripts/ci/dependabot-security-remediation-policy.test.ts|scripts/ci/dependabot-auto-merge-policy.test.ts)
                ;;
              *)
                echo "::error::Self-proof source changed forbidden path: $file"
                exit 1
                ;;
            esac
          done

      - name: Checkout exact remediation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Install exact remediated dependency graph
        run: pnpm install --frozen-lockfile

      - name: Revalidate registry-unavailable patched releases
        shell: bash
        run: |
          set -euo pipefail
          response_file="/tmp/security-remediation-registry-response.json"

          while IFS= read -r row; do
            ghsa="$(jq -r '.ghsaId' <<<"$row")"
            package="$(jq -r '.package' <<<"$row")"
            version="$(jq -r '.firstPatchedVersion' <<<"$row")"

            [[ "$ghsa" =~ ^GHSA-[23456789cfghjmpqrvwx]{4}-[23456789cfghjmpqrvwx]{4}-[23456789cfghjmpqrvwx]{4}$ ]] || {
              echo "::error::Invalid authenticated registry-unavailable GHSA: $ghsa"
              exit 1
            }
            encoded_package="$(
              node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$package"
            )"
            encoded_version="$(
              node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$version"
            )"

            set +e
            http_status="$(
              curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 10 \
                --max-time 30 \
                --output "$response_file" \
                --write-out '%{http_code}' \
                "https://registry.npmjs.org/${encoded_package}/${encoded_version}"
            )"
            curl_status=$?
            set -e

            if [[ "$curl_status" -ne 0 ]]; then
              echo "::error::npm registry revalidation failed for $package@$version."
              exit "$curl_status"
            fi

            case "$http_status" in
              404) ;;
              200)
                echo "::error::Previously unavailable patched release is now published: $package@$version. Regenerate the remediation candidate."
                exit 1
                ;;
              *)
                echo "::error::npm registry returned HTTP $http_status while revalidating $package@$version."
                cat "$response_file" >&2 || true
                exit 1
                ;;
            esac
          done < <(
            jq -c '.registryUnavailablePatches[]' \
              /tmp/security-remediation-source/candidate.json
          )
          rm -f "$response_file"

      - name: Validate dependency-only remediation diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          node scripts/ci/dependabot-security-remediation.mjs validate-pr
          --base "$BASE_SHA"
          --candidate /tmp/security-remediation-source/candidate.json

      - name: Prove authenticated registry advisories are closed
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm audit --dev --audit-level ${{ steps.envelope.outputs.audit_level }} --json > /tmp/security-remediation-source/audit-current.json
          status=$?
          set -e
          echo "Authenticated candidate audit exit code: $status" >> "$GITHUB_STEP_SUMMARY"

          node scripts/ci/dependabot-security-remediation.mjs verify-remediated-audit \
            --audit /tmp/security-remediation-source/audit-current.json \
            --candidate /tmp/security-remediation-source/candidate.json \
            --level ${{ steps.envelope.outputs.audit_level }}

      - name: Write immutable security auto-merge decision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUDIT_LEVEL: ${{ steps.envelope.outputs.audit_level }}
          DEPENDENCY_SCOPE: ${{ steps.envelope.outputs.dependency_scope }}
          SOURCE_RUN_ID: ${{ steps.envelope.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.envelope.outputs.source_run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p .dependabot-auto-merge
          node <<'NODE'
          const fs = require('node:fs');

          const pullRequestNumber = Number(process.env.PR_NUMBER);
          const headSha = process.env.PR_HEAD_SHA ?? '';
          const baseSha = process.env.PR_BASE_SHA ?? '';
          const headRef = process.env.PR_HEAD_REF ?? '';
          const auditLevel = process.env.AUDIT_LEVEL ?? '';
          const dependencyScope = process.env.DEPENDENCY_SCOPE ?? '';
          const sourceRunId = Number(process.env.SOURCE_RUN_ID);
          const sourceRunAttempt = Number(process.env.SOURCE_RUN_ATTEMPT);
          const candidate = JSON.parse(
            fs.readFileSync(
              '/tmp/security-remediation-source/candidate.json',
              'utf8'
            )
          );

          if (!Number.isSafeInteger(pullRequestNumber) || pullRequestNumber <= 0) {
            throw new Error(
              'Security remediation PR number must be a positive integer'
            );
          }
          if (
            !/^[0-9a-f]{40}$/.test(headSha) ||
            !/^[0-9a-f]{40}$/.test(baseSha)
          ) {
            throw new Error(
              'Security remediation decision requires exact head/base SHAs'
            );
          }
          if (headRef !== 'automation/dependabot-security-remediation') {
            throw new Error('Security remediation branch authority mismatch');
          }
          if (auditLevel !== 'high' && auditLevel !== 'low') {
            throw new Error('Security remediation audit level is invalid');
          }
          if (dependencyScope !== 'development') {
            throw new Error('Security remediation dependency scope is invalid');
          }
          if (
            !Number.isSafeInteger(sourceRunId) ||
            sourceRunId <= 0 ||
            !Number.isSafeInteger(sourceRunAttempt) ||
            sourceRunAttempt <= 0
          ) {
            throw new Error('Security remediation source identity is invalid');
          }
          if (
            !['schedule', 'workflow_dispatch', 'push'].includes(
              candidate.sourceEvent
            ) ||
            (candidate.sourceEvent === 'push'
              ? !/^[0-9a-f]{40}$/.test(candidate.sourceBeforeSha ?? '')
              : candidate.sourceBeforeSha !== null) ||
            (candidate.sourceEvent === 'push' && auditLevel !== 'low')
          ) {
            throw new Error('Security remediation source provenance is invalid');
          }

          const decision = {
            schemaVersion: 2,
            kind: 'security-remediation',
            repository: process.env.REPOSITORY,
            pullRequestNumber,
            author: process.env.PR_AUTHOR,
            headSha,
            headRef,
            baseRef: process.env.PR_BASE_REF,
            baseSha,
            updateType: 'security-remediation',
            auditLevel,
            dependencyScope,
            sourceRunId,
            sourceRunAttempt,
            sourceEvent: candidate.sourceEvent,
            sourceBeforeSha: candidate.sourceBeforeSha,
            sourceCandidateBaseSha: candidate.baseSha,
            sourceCandidateHeadSha: candidate.headSha,
            authorizedPackages: candidate.authorizedPackages,
            changedPackages: candidate.changedPackages,
            ignoredRuntimeGhsas: candidate.ignoredRuntimeGhsas,
            registryUnavailablePatches:
              candidate.registryUnavailablePatches,
            auditGapMaterializations:
              candidate.auditGapMaterializations,
            eligible: true,
          };

          fs.writeFileSync(
            '.dependabot-auto-merge/decision.json',
            `${JSON.stringify(decision, null, 2)}\n`,
            'utf8'
          );
          console.log(JSON.stringify(decision));
          NODE

      - name: Upload security auto-merge decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-auto-merge-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: .dependabot-auto-merge/decision.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
