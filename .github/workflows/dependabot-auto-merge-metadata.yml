name: Dependabot Auto Merge Metadata

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  pull-requests: read

jobs:
  disarm:
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Inspect legacy auto-merge request
        id: legacy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          enabled="$(
            gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" \
              --jq 'if .auto_merge == null then "false" else "true" end'
          )"
          case "$enabled" in
            true|false) ;;
            *)
              echo "Unexpected auto-merge state: $enabled" >&2
              exit 1
              ;;
          esac
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "Legacy auto-merge enabled: $enabled"

      - name: Create short-lived cleanup GitHub App token
        if: steps.legacy.outputs.enabled == 'true'
        id: cleanup-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_SYNC_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Disable legacy auto-merge request
        if: steps.legacy.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.cleanup-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --disable-auto

      - name: Verify no persistent auto-merge request remains
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          enabled="$(
            gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" \
              --jq 'if .auto_merge == null then "false" else "true" end'
          )"
          if [ "$enabled" != 'false' ]; then
            echo 'Persistent auto-merge request is still enabled' >&2
            exit 1
          fi

  inspect:
    needs: disarm
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ github.token }}

      - name: Write immutable auto-merge decision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          mkdir -p .dependabot-auto-merge
          node <<'NODE'
          const fs = require('node:fs');

          const pullRequestNumber = Number(process.env.PR_NUMBER);
          const headSha = process.env.PR_HEAD_SHA ?? '';
          const updateType = process.env.UPDATE_TYPE ?? '';

          if (!Number.isSafeInteger(pullRequestNumber) || pullRequestNumber <= 0) {
            throw new Error('Dependabot pull request number must be a positive integer');
          }
          if (!/^[0-9a-f]{40}$/.test(headSha)) {
            throw new Error('Dependabot pull request head must be an exact SHA');
          }

          const decision = {
            schemaVersion: 1,
            repository: process.env.REPOSITORY,
            pullRequestNumber,
            author: process.env.PR_AUTHOR,
            headSha,
            baseRef: process.env.PR_BASE_REF,
            updateType,
            eligible: updateType === 'version-update:semver-patch',
          };

          fs.writeFileSync(
            '.dependabot-auto-merge/decision.json',
            `${JSON.stringify(decision, null, 2)}\n`,
            'utf8'
          );
          console.log(JSON.stringify(decision));
          NODE

      - name: Upload auto-merge decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-auto-merge-decision
          path: .dependabot-auto-merge/decision.json
          if-no-files-found: error
          retention-days: 1
