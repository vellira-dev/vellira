name: Discovery export format probe 1652

on:
  push:
    branches:
      - fix/discovery-contract-adoption-gate-20261013
    paths:
      - .github/workflows/discovery-export-format-probe-1652.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Emit exact Prettier patch
        run: |
          pnpm exec prettier --write scripts/seo/component-discovery-audit.ts scripts/seo/component-discovery-contract.test.ts
          echo '===BEGIN_DISCOVERY_EXPORT_PATCH==='
          git diff -- scripts/seo/component-discovery-audit.ts scripts/seo/component-discovery-contract.test.ts
          echo '===END_DISCOVERY_EXPORT_PATCH==='
