name: Release

on:
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@vellira-ui'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Quality checks
        run: pnpm ci:quality

      - name: Build packages and apps
        run: pnpm ci:build

      - name: Typecheck & API validation
        run: pnpm ci:typecheck

      - name: Install Playwright browser
        run: pnpm ci:playwright

      - name: Unit and Storybook tests
        run: pnpm test:unit && pnpm test:storybook

      - name: Coverage
        run: pnpm test:coverage

      - name: Smoke packages
        run: pnpm ci:smoke

      - name: Verify npm CLI and registry
        run: |
          pnpm exec npm --version
          pnpm exec npm ping --registry=https://registry.npmjs.org

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Detect version sync changes
        id: version-sync
        shell: bash
        run: |
          release_paths=(
            package.json
            pnpm-lock.yaml
            packages/*/package.json
          )

          if git diff --quiet -- "${release_paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No release-managed files changed; skipping version sync PR."
            exit 0
          fi

          version="$(node -p "require('./package.json').version")"

          if [ -z "$version" ]; then
            echo "Unable to determine the prepared release version."
            exit 1
          fi

          git diff --check -- "${release_paths[@]}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=chore/sync-release-$version" >> "$GITHUB_OUTPUT"
          echo "Release-managed files changed for version $version."

      - name: Verify release sync token
        if: steps.version-sync.outputs.changed == 'true'
        env:
          RELEASE_SYNC_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
        run: |
          if [ -z "$RELEASE_SYNC_TOKEN" ]; then
            echo "RELEASE_SYNC_TOKEN secret is required to create the version sync PR as a maintainer."
            exit 1
          fi

      - name: Close superseded version sync PRs
        if: steps.version-sync.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
          CURRENT_VERSION: ${{ steps.version-sync.outputs.version }}
          CURRENT_BRANCH: ${{ steps.version-sync.outputs.branch }}
        run: |
          set -euo pipefail

          while IFS=$'\t' read -r pr_number head_branch; do
            if [ -z "$pr_number" ] || [ -z "$head_branch" ]; then
              continue
            fi

            if [ "$head_branch" = "$CURRENT_BRANCH" ]; then
              echo "Keeping current release sync PR #$pr_number ($head_branch)."
              continue
            fi

            echo "Closing superseded release sync PR #$pr_number ($head_branch)."

            gh pr close "$pr_number" \
              --comment "Superseded by release sync for v${CURRENT_VERSION}."
          done < <(
            gh pr list \
              --state open \
              --base main \
              --json number,headRefName \
              --jq '.[] |
                select(.headRefName | startswith("chore/sync-release-")) |
                [.number, .headRefName] |
                @tsv'
          )

      - name: Create version sync PR
        if: steps.version-sync.outputs.changed == 'true'
        id: version-sync-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.RELEASE_SYNC_TOKEN }}
          add-paths: |
            package.json
            pnpm-lock.yaml
            packages/*/package.json
          branch: ${{ steps.version-sync.outputs.branch }}
          commit-message: 'chore(release): sync package versions'
          delete-branch: true
          title: 'chore(release): sync package versions'
          body: |
            Sync package manifests and lockfile with version ${{ steps.version-sync.outputs.version }} prepared by semantic-release.

      - name: Verify version sync PR creation
        if: steps.version-sync.outputs.changed == 'true'
        env:
          VERSION_SYNC_PR: ${{ steps.version-sync-pr.outputs.pull-request-number }}
        run: |
          if [ -z "$VERSION_SYNC_PR" ]; then
            echo "Release-managed files changed, but no version sync PR was created or found."
            exit 1
          fi

      - name: Enable auto-merge for version sync PR
        if: steps.version-sync.outputs.changed == 'true' && steps.version-sync-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
        run: |
          gh pr merge ${{ steps.version-sync-pr.outputs.pull-request-number }} \
            --auto \
            --squash \
            --delete-branch
