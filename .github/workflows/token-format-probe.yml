name: Token Formatting Probe

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: token-format-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0

      - run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting and remove probe
        shell: bash
        env:
          VELLIRA_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            scripts/checks/token-semantic/consumer-reference-completeness.ts \
            scripts/checks/token-semantic/semantic-vocabulary-consumers.test.ts \
            scripts/checks/token-semantic/state-vocabulary-composition.test.ts \
            scripts/checks/token-semantic/state-vocabulary-composition.ts \
            scripts/checks/token-semantic/value-kind-repository.test.ts \
            scripts/checks/token-semantic/value-kind-repository.ts \
            scripts/generators/component/token-semantic-readiness.test.ts \
            scripts/generators/component/token-semantic-readiness.ts
          git rm .github/workflows/token-format-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/checks/token-semantic scripts/generators/component/token-semantic-readiness.ts scripts/generators/component/token-semantic-readiness.test.ts
          git diff --cached --check
          git commit -m 'style(tokens): format semantic enforcement tooling'
          git push origin HEAD:"$VELLIRA_HEAD_REF"
