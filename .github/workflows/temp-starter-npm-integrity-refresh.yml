name: Temporary Starter npm Integrity Refresh

on:
  push:
    branches:
      - 'security/starter-cleanroom-npm-integrity-20261023'

permissions:
  contents: write

concurrency:
  group: temporary-starter-npm-integrity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'chore(security): regenerate published Starter lock integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned bootstrap commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable bootstrap identity
        env:
          EXPECTED_REF: 'refs/heads/security/starter-cleanroom-npm-integrity-20261023'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(node -p "require('./package.json').version")" = '2.186.7'
      - name: Set up matching Starter npm toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - name: Regenerate exact npm integrity locks
        run: |
          set -euo pipefail
          node scripts/sync-workspace-starter-lockfiles.cjs
          node scripts/sync-workspace-starter-lockfiles.cjs --check
          node --test scripts/sync-workspace-starter-lockfiles.test.cjs
          node scripts/sync-workspace-starter-versions.cjs 2.186.7 --check
      - name: Enforce strict lockfile-only change boundary
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test -n "$changed"
          printf '%s\n' "$changed" | sort > /tmp/changed.txt
          printf '%s\n' \
            examples/workspace-starter/native/package-lock.json \
            examples/workspace-starter/web/package-lock.json | sort > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
          git status --short
      - name: Commit and publish regenerated lockfiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- examples/workspace-starter/web/package-lock.json examples/workspace-starter/native/package-lock.json
          git diff --cached --check
          git commit -m 'chore(security): refresh exact published Starter npm integrity locks'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/security/starter-cleanroom-npm-integrity-20261023"
