name: One-shot Input legacy docs safe adoption
on:
  push:
    branches:
      - feat/docs-input-safe-adoption-20261015
permissions:
  contents: write
jobs:
  input-adoption:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout Input candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Canonicalize new Input contract and tests
        run: |
          pnpm exec prettier apps/docs/src/component-docs/Input.docs.ts apps/docs/src/component-docs/index.ts scripts/generators/component-docs/input-published-docs.test.ts --write
      - name: Guarded two-platform Input adoption
        shell: bash
        run: |
          pnpm component-docs:adopt Input --dry-run --json > "$RUNNER_TEMP/input-preview.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const proof = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/input-preview.json', 'utf8'));
          if (proof.status !== 'preview' || proof.entries.length !== 2) {
            throw new Error('Expected legacy Input guides on both platforms');
          }
          for (const entry of proof.entries) {
            const original = execFileSync('git', ['show', 'HEAD:' + entry.file]).toString('utf8');
            const sha = crypto.createHash('sha256').update(original).digest('hex');
            if (sha !== entry.originalSha256) throw new Error('Original Input source digest mismatch: ' + entry.file);
            console.log('Input ' + entry.platform + ' original SHA256=' + sha + ' bytes=' + Buffer.byteLength(original));
          }
          NODE
          REACT_SHA="$(node -p "require(process.env.RUNNER_TEMP + '/input-preview.json').entries.find(e => e.platform === 'react').originalSha256")"
          NATIVE_SHA="$(node -p "require(process.env.RUNNER_TEMP + '/input-preview.json').entries.find(e => e.platform === 'react-native').originalSha256")"
          pnpm component-docs:adopt Input --write --json "--expected-react-sha256=${REACT_SHA}" "--expected-react-native-sha256=${NATIVE_SHA}" > "$RUNNER_TEMP/input-adopted.json"
      - name: Preserve authored guides with reversible heading-only changes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import prettier from 'prettier';
          import crypto from 'node:crypto';
          const start = '<!-- vellira-component-docs:authored:start -->';
          const end = '<!-- vellira-component-docs:authored:end -->';
          const headings = new Map([
            ['## When To Use', '## Practical Usage Guidance'],
            ['## Accessibility', '## Additional Accessibility Details'],
            ['## See Also', '## Further Reading'],
          ]);
          const revert = new Map([...headings].map(([oldValue, newValue]) => [newValue, oldValue]));
          const preview = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/input-preview.json', 'utf8'));
          const adopted = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/input-adopted.json', 'utf8'));
          if (adopted.status !== 'adopted' || adopted.entries.length !== 2) throw new Error('Input adoption incomplete');
          for (const platform of ['react', 'react-native']) {
            const entry = preview.entries.find(row => row.platform === platform);
            if (!entry) throw new Error('Missing source digest: '+platform);
            const original = execFileSync('git', ['show', 'HEAD:' + entry.file]).toString('utf8');
            const legacy = /^---\r?\n[\s\S]*?\r?\n---\r?\n\s*# Input\r?\n([\s\S]*)$/.exec(original);
            if (!legacy) throw new Error('Invalid original frontmatter/H1: '+platform);
            const config = await prettier.resolveConfig(entry.file);
            const canonical = (await prettier.format(legacy[1].trim(), { ...config, parser: 'markdown', filepath: entry.file })).trim();
            const before = fs.readFileSync(entry.file, 'utf8');
            const a=before.indexOf(start), b=before.indexOf(end,a);
            if (a<0 || b<a || before.indexOf(start,a+start.length)!==-1 || before.indexOf(end,b+end.length)!==-1) throw new Error('Invalid authored-region ownership: '+platform);
            const body=before.slice(a+start.length,b);
            if (body.trim()!==canonical) throw new Error('Editorial loss during Input adoption: '+platform);
            let renamed=0;
            const rewritten=body.split('\n').map(line=>{
              const mapped=headings.get(line);
              if (mapped) renamed++;
              return mapped || line;
            }).join('\n');
            if (renamed !== (platform === 'react' ? 3 : 2)) throw new Error('Unexpected original Input heading set: '+platform+', renamed='+renamed);
            const recovered=rewritten.split('\n').map(line=>revert.get(line)||line).join('\n').trim();
            if (recovered!==canonical) throw new Error('Authored Input body cannot be restored: '+platform);
            const updated=before.slice(0,a+start.length)+rewritten+before.slice(b);
            const allH2=updated.split('\n').filter(line=>line.startsWith('## '));
            if (allH2.length !== new Set(allH2).size) throw new Error('Duplicate generated/authored headings: '+platform);
            fs.writeFileSync(entry.file,updated);
            const digest=crypto.createHash('sha256').update(canonical).digest('hex');
            console.log('Input '+platform+': original='+entry.originalSha256+'; canonical authored='+digest+'; preserved bytes='+Buffer.byteLength(canonical)+'; renamed H2='+renamed);
          }
          NODE
      - name: Verify no-op generator, editorial tests and formatting
        run: |
          pnpm component-docs:generate Input --check
          pnpm component-docs:adopt Input --dry-run --json
          pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component-docs scripts/checks/component-completeness/cli.test.ts
          pnpm format:check
      - name: Remove one-shot workflow and commit bounded changes
        shell: bash
        run: |
          rm .github/workflows/input-docs-adoption-proof-once.yml
          while IFS= read -r file; do
            case "$file" in
              apps/docs/src/react/input.md|apps/docs/src/react-native/input.md|apps/docs/src/component-docs/Input.docs.ts|apps/docs/src/component-docs/index.ts|scripts/generators/component-docs/input-published-docs.test.ts|.github/workflows/input-docs-adoption-proof-once.yml) ;;
              *) echo "::error::Unexpected modified file: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m "docs(input): preserve React and native legacy guides under generator ownership"
          git push origin HEAD:feat/docs-input-safe-adoption-20261015
