name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ci:
    name: Build, Test & Validate
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      COMPONENT_QUALITY_ENFORCEMENT: advisory
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show publication gate Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier scripts/blog/check-publication-state.ts --write
          git diff --no-ext-diff -- scripts/blog/check-publication-state.ts
          git checkout -- scripts/blog/check-publication-state.ts

      - name: Quality checks
        run: pnpm ci:quality

      - name: Validate Blog publication state
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        env:
          VELLIRA_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          VELLIRA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VELLIRA_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VELLIRA_PR_HEAD_REF" == agent/content-article-* ]]; then
            git fetch --no-tags --depth=2 origin "refs/heads/$VELLIRA_PR_HEAD_REF"
          fi
          pnpm exec tsx scripts/blog/check-publication-state.ts

      - name: Component Quality Checker
        id: component-quality
        shell: bash
        run: |
          set +e

          pnpm check:component-quality --all
          status=$?

          set -e

          if [ "$status" -eq 2 ]; then
            echo "::error::Component Quality Checker failed with a runtime/configuration error."
            exit 2
          fi

          if [ "$status" -eq 1 ]; then
            if [ "$COMPONENT_QUALITY_ENFORCEMENT" = "blocking" ]; then
              echo "::error::Component Quality Checker reported blocking quality findings."
              exit 1
            fi

            echo "::warning::Component Quality Checker reported blocking findings, but enforcement is advisory during the rollout window."
          fi

      - name: Generate Component Quality report
        if: always()
        run: pnpm check:component-quality:json -- --output .artifacts/component-quality/report.json

      - name: Upload Component Quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-quality-report
          path: .artifacts/component-quality/report.json
          if-no-files-found: error

      - name: Build packages and apps
        run: pnpm build

      - name: Build docs
        run: pnpm --filter @vellira/docs build

      - name: Typecheck
        run: pnpm typecheck

      - name: Tooling tests
        run: pnpm test:tooling

      - name: IndexNow tests
        run: pnpm test:indexnow

      - name: Tests and coverage
        run: pnpm test:coverage

      - name: Visual regression
        run: pnpm test:visual

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Smoke packages
        run: pnpm smoke:packages
