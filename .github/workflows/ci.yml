name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  cloudflare-cache-migration:
    name: Cloudflare cache and multi-deployment browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:next-rsc-patch
      - name: Lint deployment and diagnostic scripts
        run: >-
          pnpm exec eslint apps/website/cloudflare-worker.mjs apps/website/cloudflare/*.mjs
          apps/website/scripts/*.mjs apps/react-storybook/scripts/cloudflare-browser-diagnostics*.mjs
          apps/react-storybook/scripts/cloudflare-navigation-soak.mjs
      - run: pnpm test:cloudflare-cache
      - name: Build actual OpenNext runtime
        env:
          VELLIRA_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VELLIRA_BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # PR events expose a synthetic merge SHA. This job deliberately builds
          # the checked-out PR HEAD, never a deployable PR merge artifact.
          test "$(git rev-parse HEAD)" = "$VELLIRA_CHECKOUT_SHA"
          export GITHUB_SHA="$VELLIRA_CHECKOUT_SHA"
          pnpm exec turbo run build --filter='@vellira-ui/website^...'
          pnpm --dir apps/website run sync:brand
          pnpm --dir apps/website run build:opennext
          pnpm --dir apps/website exec opennextjs-cloudflare populateCache local
          node apps/website/scripts/cloudflare-local-runtime.mjs
      - run: pnpm test:cloudflare-migration
      - name: Retain exact-head migration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cache-migration-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/website/.open-next/local-runtime-contract.json
            apps/website/.open-next/asset-audit-preactivation.json
            apps/react-storybook/test-results/cloudflare-migration/*/evidence.json
            apps/react-storybook/test-results/cloudflare-migration/summary.json
            apps/react-storybook/test-results/cloudflare-migration/*.log
          retention-days: 14
          include-hidden-files: true
  ci:
    name: Build, Test & Validate
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      COMPONENT_QUALITY_ENFORCEMENT: advisory
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality checks
        run: pnpm ci:quality

      - name: Validate Blog publication state
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        env:
          VELLIRA_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          VELLIRA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VELLIRA_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$VELLIRA_PR_HEAD_REF" == agent/content-article-* ]]; then
            git fetch --no-tags --depth=2 origin "refs/heads/$VELLIRA_PR_HEAD_REF"
          fi
          pnpm exec tsx scripts/blog/check-publication-state.ts

      - name: Component Quality Checker
        id: component-quality
        shell: bash
        run: |
          set +e

          pnpm check:component-quality --all
          status=$?

          set -e

          if [ "$status" -eq 2 ]; then
            echo "::error::Component Quality Checker failed with a runtime/configuration error."
            exit 2
          fi

          if [ "$status" -eq 1 ]; then
            if [ "$COMPONENT_QUALITY_ENFORCEMENT" = "blocking" ]; then
              echo "::error::Component Quality Checker reported blocking quality findings."
              exit 1
            fi

            echo "::warning::Component Quality Checker reported blocking quality findings. Advisory mode is active, so CI will continue."
          fi

          exit 0

      - name: Generate Component Quality report
        if: always()
        shell: bash
        run: |
          mkdir -p .artifacts/component-quality

          set +e
          pnpm check:component-quality:json \
            > .artifacts/component-quality/report.json
          status=$?
          set -e

          if [ "$status" -eq 2 ]; then
            echo "::error::Failed to generate Component Quality Checker report."
            exit 2
          fi

      - name: Upload Component Quality report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: component-quality-report
          path: .artifacts/component-quality/report.json
          if-no-files-found: error
          retention-days: 14

      - name: Build packages and apps
        run: pnpm ci:build

      - name: Build docs
        run: pnpm docs:build

      - name: Typecheck
        run: pnpm ci:typecheck

      - name: Tooling tests
        run: pnpm test:tooling

      - name: IndexNow tests
        run: node --test scripts/submit-indexnow.test.mjs

      - name: Tests and coverage
        run: pnpm ci:test

      - name: Visual regression
        run: pnpm test:e2e:web:visual
        env:
          VELLIRA_VISUAL_ENVIRONMENT: playwright-v1.61.1-noble

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts
          path: |
            apps/react-storybook/test-results
            apps/react-storybook/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke packages
        run: pnpm ci:smoke
