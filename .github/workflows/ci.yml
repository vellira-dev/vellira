name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ci:
    name: Build, Test & Validate
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      COMPONENT_QUALITY_ENFORCEMENT: advisory
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Token semantic audit report
        id: token-semantic-report
        env:
          VELLIRA_AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/token-semantic
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD > .artifacts/token-semantic/checkout-sha.txt
          printf '%s\n' "$VELLIRA_AUDIT_HEAD_SHA" > .artifacts/token-semantic/head-sha.txt
          pnpm --silent check:tokens-semantic:json > .artifacts/token-semantic/report.json
          node --input-type=module -e "import fs from 'node:fs'; const r = JSON.parse(fs.readFileSync('.artifacts/token-semantic/report.json', 'utf8')); console.log('Token semantic report mode:', r.status, JSON.stringify(r.summary));"

      - name: Upload token semantic audit report
        if: always() && steps.token-semantic-report.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: token-semantic-report
          path: .artifacts/token-semantic/
          if-no-files-found: error
          retention-days: 14

      - name: Token semantic audit tests
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/checks/token-semantic

      - name: Quality checks
        run: pnpm ci:quality

      - name: Validate Blog publication state
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        env:
          VELLIRA_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          VELLIRA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VELLIRA_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$VELLIRA_PR_HEAD_REF" == agent/content-article-* ]]; then
            git fetch --no-tags --depth=2 origin "refs/heads/$VELLIRA_PR_HEAD_REF"
          fi
          pnpm exec tsx scripts/blog/check-publication-state.ts

      - name: Component Quality Checker
        id: component-quality
        shell: bash
        run: |
          set +e

          pnpm check:component-quality --all
          status=$?

          set -e

          if [ "$status" -eq 2 ]; then
            echo "::error::Component Quality Checker failed with a runtime/configuration error."
            exit 2
          fi

          if [ "$status" -eq 1 ]; then
            if [ "$COMPONENT_QUALITY_ENFORCEMENT" = "blocking" ]; then
              echo "::error::Component Quality Checker reported blocking quality findings."
              exit 1
            fi

            echo "::warning::Component Quality Checker reported blocking quality findings. Advisory mode is active, so CI will continue."
          fi

          exit 0

      - name: Generate Component Quality report
        if: always()
        shell: bash
        run: |
          mkdir -p .artifacts/component-quality

          set +e
          pnpm check:component-quality:json \
            > .artifacts/component-quality/report.json
          status=$?
          set -e

          if [ "$status" -eq 2 ]; then
            echo "::error::Failed to generate Component Quality Checker report."
            exit 2
          fi

      - name: Upload Component Quality report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: component-quality-report
          path: .artifacts/component-quality/report.json
          if-no-files-found: error
          retention-days: 14

      - name: Build packages and apps
        run: pnpm ci:build

      - name: Build docs
        run: pnpm docs:build

      - name: Typecheck
        run: pnpm ci:typecheck

      - name: Tooling tests
        run: pnpm test:tooling

      - name: IndexNow tests
        run: node --test scripts/submit-indexnow.test.mjs

      - name: Tests and coverage
        run: pnpm ci:test

      - name: Visual regression
        run: pnpm test:e2e:web:visual
        env:
          VELLIRA_VISUAL_ENVIRONMENT: playwright-v1.61.1-noble

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts
          path: |
            apps/react-storybook/test-results
            apps/react-storybook/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke packages
        run: pnpm ci:smoke
