name: PR 907 Storybook Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  storybook-diagnostic:
    name: Storybook diagnostic
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and apps
        run: pnpm ci:build

      - name: Capture React resolution
        shell: bash
        run: |
          node --input-type=module <<'NODE' > react-resolution.log
          import fs from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';

          const bases = [
            '.',
            'apps/react-storybook',
            'packages/react',
            'packages/icons',
            'packages/react-native',
          ];
          const specs = [
            'react',
            'react-dom',
            'storybook',
            '@storybook/react',
            '@storybook/react-vite',
            '@storybook/react-dom-shim',
          ];

          function packageInfo(resolved) {
            let directory = path.dirname(resolved);
            for (;;) {
              const packageJson = path.join(directory, 'package.json');
              if (fs.existsSync(packageJson)) {
                const data = JSON.parse(fs.readFileSync(packageJson, 'utf8'));
                if (data.name && data.version) {
                  return `${data.name}@${data.version} (${resolved}; real=${fs.realpathSync(resolved)})`;
                }
              }
              const parent = path.dirname(directory);
              if (parent === directory) return resolved;
              directory = parent;
            }
          }

          for (const base of bases) {
            const require = createRequire(path.resolve(base, 'package.json'));
            console.log(`base=${base}`);
            for (const spec of specs) {
              try {
                console.log(`  ${spec} -> ${packageInfo(require.resolve(spec))}`);
              } catch (error) {
                console.log(`  ${spec} -> UNRESOLVED: ${error.code ?? error.message}`);
              }
            }
          }
          NODE
          cat react-resolution.log

      - name: Capture one Storybook browser smoke
        shell: bash
        run: |
          set +e
          pnpm --filter @vellira-ui/react-storybook exec playwright test \
            --config=playwright.config.ts \
            --project=chromium \
            --grep "Vellira font" \
            --retries=0 \
            > storybook-smoke.log 2>&1
          status=$?
          set -e
          cat storybook-smoke.log
          printf '%s\n' "$status" > storybook-smoke.status

      - name: Upload Storybook diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr907-storybook-diagnostic
          path: |
            react-resolution.log
            storybook-smoke.log
            storybook-smoke.status
            apps/react-storybook/test-results
          if-no-files-found: error
          retention-days: 1
