name: PR 907 Coverage Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage-diagnostic:
    name: Coverage diagnostic
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and apps
        run: pnpm ci:build

      - name: Capture CI test output
        shell: bash
        run: |
          set +e
          pnpm ci:test > ci-test.log 2>&1
          status=$?
          set -e
          cat ci-test.log
          printf '%s\n' "$status" > ci-test.status

      - name: Upload CI test diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr907-ci-test-diagnostic
          path: |
            ci-test.log
            ci-test.status
          if-no-files-found: error
          retention-days: 1
