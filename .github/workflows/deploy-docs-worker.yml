name: Deploy Docs Worker

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-docs-worker.yml'
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-docs-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-worker-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.0
  DOCS_DIST_DIR: apps/docs/src/.vitepress/dist
  CLOUDFLARE_WORKER_NAME: vellira-docs

jobs:
  deploy:
    name: Build and deploy Docs Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PRs exercise the deployment build on a fresh runner, without restored dist.
      - name: Verify clean-checkout regression precondition
        if: github.event_name == 'pull_request'
        run: |
          existing_dist="$(find apps packages -type d -name node_modules -prune -o -type d -name dist -print)"
          if [ -n "$existing_dist" ]; then
            printf 'Unexpected pre-existing workspace dist directories:\n%s\n' "$existing_dist"
            exit 1
          fi

      - name: Build docs workspace dependencies
        run: pnpm exec turbo run build --filter='@vellira-ui/docs^...'

      - name: Build docs
        run: pnpm docs:build

      - name: Verify docs artifact
        run: test -f "$DOCS_DIST_DIR/index.html"

      - name: Deploy docs to Cloudflare Workers
        if: github.event_name != 'pull_request'
        run: >
          pnpm exec wrangler deploy
          --name "$CLOUDFLARE_WORKER_NAME"
          --assets "$DOCS_DIST_DIR"
          --compatibility-date 2026-09-06
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
