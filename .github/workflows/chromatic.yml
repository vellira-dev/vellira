name: Chromatic Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Only supersede attempts for the same PR; preserve non-PR runs.
concurrency:
  group: chromatic-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromatic:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify visual impact
        id: impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          trusted_classifier="$RUNNER_TEMP/chromatic-impact.mjs"

          if git cat-file -e "${BASE_SHA}:scripts/ci/chromatic-impact.mjs" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/ci/chromatic-impact.mjs" > "$trusted_classifier"
            node "$trusted_classifier" --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            {
              echo 'run_chromatic=true'
              echo 'reason=trusted-classifier-unavailable'
              echo 'changed_files=[]'
            } >> "$GITHUB_OUTPUT"
            echo 'Trusted base revision has no Chromatic impact classifier; running full Chromatic path.'               >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record intentional Chromatic skip
        if: steps.impact.outputs.run_chromatic != 'true'
        shell: bash
        env:
          IMPACT_REASON: ${{ steps.impact.outputs.reason }}
          IMPACT_FILES: ${{ steps.impact.outputs.changed_files }}
        run: |
          {
            echo '### Chromatic visual-impact gate'
            echo
            echo "Skipped expensive Storybook/Chromatic work: \`$IMPACT_REASON\`."
            echo
            echo "Changed files: \`$IMPACT_FILES\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.impact.outputs.run_chromatic == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.impact.outputs.run_chromatic == 'true'
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        if: steps.impact.outputs.run_chromatic == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build packages
        if: steps.impact.outputs.run_chromatic == 'true'
        run: pnpm build

      - name: Disable unrelated Google Chrome apt source
        if: steps.impact.outputs.run_chromatic == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t chrome_sources < <(
            grep -RIl 'dl.google.com/linux/chrome-stable/deb' /etc/apt/sources.list.d 2>/dev/null || true
          )

          if (( ${#chrome_sources[@]} == 0 )); then
            echo 'No Google Chrome apt source found; nothing to disable.'
            exit 0
          fi

          printf 'Disabling unrelated apt source(s):\n'
          printf '  %s\n' "${chrome_sources[@]}"
          for source in "${chrome_sources[@]}"; do
            sudo mv "$source" "$source.disabled"
          done

      - name: Install Playwright browsers
        if: steps.impact.outputs.run_chromatic == 'true'
        run: pnpm ci:playwright

      - name: Test Storybook
        if: steps.impact.outputs.run_chromatic == 'true'
        run: pnpm test:storybook

      - name: Publish to Chromatic
        if: steps.impact.outputs.run_chromatic == 'true' && github.actor != 'dependabot[bot]'
        uses: chromaui/action@db3ceb5efb0cd7447d63c2d8cce7da732ce89322 # v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          workingDir: apps/react-storybook
          autoAcceptChanges: 'main'
          exitOnceUploaded: true
