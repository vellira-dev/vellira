name: Chromatic Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  chromatic:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Disable unrelated Google Chrome apt source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t chrome_sources < <(
            grep -RIl 'dl.google.com/linux/chrome-stable/deb' /etc/apt/sources.list.d 2>/dev/null || true
          )

          if (( ${#chrome_sources[@]} == 0 )); then
            echo 'No Google Chrome apt source found; nothing to disable.'
            exit 0
          fi

          printf 'Disabling unrelated apt source(s):\n'
          printf '  %s\n' "${chrome_sources[@]}"
          for source in "${chrome_sources[@]}"; do
            sudo mv "$source" "$source.disabled"
          done

      - name: Install Playwright browsers
        run: pnpm ci:playwright

      - name: Test Storybook
        run: pnpm test:storybook

      - name: Publish to Chromatic
        if: github.actor != 'dependabot[bot]'
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          workingDir: apps/react-storybook
          autoAcceptChanges: 'main'
          exitOnceUploaded: true
