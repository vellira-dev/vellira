name: Submit URLs to IndexNow

run-name: IndexNow — manual main

# Automatic notifications run only after verified production deployment.
# Keep this entry point for notification retries without another deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    name: Submit production URLs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - name: Submit URLs to IndexNow
        run: node scripts/submit-indexnow.mjs
