name: One-time Textarea Semantic Completion

on:
  push:
    branches:
      - feat/textarea-launch-component

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/textarea-launch-component
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Close Textarea governance and post-production contracts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceOnce = (file, before, after, description) => {
            let source = fs.readFileSync(file, 'utf8');
            if (source.includes(after)) return;
            if (!source.includes(before)) {
              throw new Error(`${description} marker not found in ${file}`);
            }
            source = source.replace(before, after);
            fs.writeFileSync(file, source);
          };

          const baselineMarker =
            '// Baseline contract: render, accessibility, callback, controlled, uncontrolled, disabled, required, invalid';
          for (const file of [
            'packages/react/src/primitives/Textarea/Textarea.test.tsx',
            'packages/react-native/src/primitives/Textarea/Textarea.test.tsx',
          ]) {
            let source = fs.readFileSync(file, 'utf8');
            if (!source.startsWith(baselineMarker)) {
              fs.writeFileSync(file, `${baselineMarker}\n${source}`);
            }
          }

          replaceOnce(
            'README.md',
            '| Tabs       |  ✅   |      ✅      |\n| Tooltip    |  ✅   |      ✅      |',
            '| Tabs       |  ✅   |      ✅      |\n| Textarea   |  ✅   |      ✅      |\n| Tooltip    |  ✅   |      ✅      |',
            'README Textarea inventory'
          );

          replaceOnce(
            'packages/metadata/src/tokenLifecycle.ts',
            "purpose: 'Reserved for the canonical Textarea component token contract.'",
            "purpose: 'Canonical Textarea component token contract.'",
            'Textarea token lifecycle purpose'
          );

          replaceOnce(
            'packages/tokens/src/token-architecture.ts',
            `  {\n    name: 'createTabsTokens',\n    source: 'packages/tokens/src/factories/components/createTabsTokens.ts',\n    semanticAdapter: null,\n    stateKeys: ['default', 'hover', 'active', 'disabled'],\n  },\n  {\n    name: 'createTooltipTokens',`,
            `  {\n    name: 'createTabsTokens',\n    source: 'packages/tokens/src/factories/components/createTabsTokens.ts',\n    semanticAdapter: null,\n    stateKeys: ['default', 'hover', 'active', 'disabled'],\n  },\n  {\n    name: 'createTextareaTokens',\n    source: 'packages/tokens/src/factories/components/createTextareaTokens.ts',\n    semanticAdapter: null,\n    stateKeys: ['default', 'hover', 'pressed', 'error', 'disabled'],\n  },\n  {\n    name: 'createTooltipTokens',`,
            'Textarea maintained factory inventory'
          );

          replaceOnce(
            'packages/tokens/src/component-token-factory-conventions.test.ts',
            "  'createTabsTokens',\n  'createTooltipTokens',",
            "  'createTabsTokens',\n  'createTextareaTokens',\n  'createTooltipTokens',",
            'Textarea factory convention inventory'
          );

          replaceOnce(
            'packages/tokens/src/component-token-dependencies.ts',
            `  {\n    factory: 'createTabsTokens',\n    component: 'tabs',\n    file: 'tabs.ts',\n    primitiveColorUsage: [\n      'intent-palette-construction',\n      'component-owned-presentation',\n    ],\n    unresolved: [],\n  },\n  {\n    factory: 'createTooltipTokens',`,
            `  {\n    factory: 'createTabsTokens',\n    component: 'tabs',\n    file: 'tabs.ts',\n    primitiveColorUsage: [\n      'intent-palette-construction',\n      'component-owned-presentation',\n    ],\n    unresolved: [],\n  },\n  {\n    factory: 'createTextareaTokens',\n    component: 'textarea',\n    file: 'textarea.ts',\n    primitiveColorUsage: ['none'],\n    unresolved: [],\n  },\n  {\n    factory: 'createTooltipTokens',`,
            'Textarea semantic dependency inventory'
          );

          replaceOnce(
            'scripts/check-public-api.mjs',
            "    'BaseTabsTriggerProps',\n    'BaseTooltipProps',",
            "    'BaseTabsTriggerProps',\n    'BaseTextareaProps',\n    'BaseTooltipProps',",
            'Textarea shared base public API'
          );
          replaceOnce(
            'scripts/check-public-api.mjs',
            "    'TabsVariant',\n    'TextWrap',",
            "    'TabsVariant',\n    'TextareaSize',\n    'TextWrap',",
            'Textarea size public API'
          );

          replaceOnce(
            'scripts/component-production/missing-component-request.test.ts',
            "nextAction: 'link-or-create-component-token-reservation-issue',",
            "nextAction: 'link-or-create-component-issue',",
            'Textarea current-token production routing expectation'
          );

          replaceOnce(
            'scripts/canonical-gap/contract.test.ts',
            "kind: 'component-token-reservation',\n      canonicalTarget: 'Textarea',",
            "kind: 'component',\n      canonicalTarget: 'Textarea',",
            'Textarea canonical gap component expectation'
          );
          replaceOnce(
            'scripts/canonical-gap/contract.test.ts',
            `    expect(batch.requests.map(({ kind }) => kind).sort()).toEqual([\n      'component-token-reservation',\n      'icon',\n      'token',\n      'token',\n    ]);`,
            `    expect(batch.requests.map(({ kind }) => kind).sort()).toEqual([\n      'icon',\n      'token',\n      'token',\n    ]);`,
            'Textarea resolved UI finding canonical gap expectation'
          );
          replaceOnce(
            'scripts/canonical-gap/contract.test.ts',
            `    expect(\n      batch.requests.some(\n        ({ canonicalTarget }) => canonicalTarget === 'Textarea'\n      )\n    ).toBe(true);`,
            `    expect(\n      batch.requests.some(\n        ({ canonicalTarget }) => canonicalTarget === 'Textarea'\n      )\n    ).toBe(false);`,
            'Textarea resolved canonical target expectation'
          );

          replaceOnce(
            'scripts/checks/vellira-ui-usage/checker.test.ts',
            "it('routes textarea through the missing-component workflow while Textarea is absent',",
            "it('reports authored textarea when canonical Textarea exists',",
            'Textarea Vellira UI usage test title'
          );
          replaceOnce(
            'scripts/checks/vellira-ui-usage/checker.test.ts',
            `      ruleId: 'vellira-ui.missing-component',\n      detected: 'textarea',\n      severity: 'warning',\n      blocking: false,\n      nextAction: 'request-missing-component',`,
            `      ruleId: 'vellira-ui.existing-component-bypass',\n      detected: 'textarea',\n      severity: 'warning',\n      blocking: false,\n      nextAction: 'reuse-existing',`,
            'Textarea Vellira UI usage expectation'
          );
          replaceOnce(
            'scripts/checks/vellira-ui-usage/checker.test.ts',
            '    expect(finding.canonicalAlternative).toBeUndefined();',
            "    expect(finding.canonicalAlternative).toBe('Textarea');",
            'Textarea canonical alternative expectation'
          );

          replaceOnce(
            'scripts/generators/component-page/renderers/catalog-preview-registry.ts',
            "  return `${generatedFileHeader}'use client';\n\nimport { ${demoName} } from './${demoName}';\n\nexport function ${model.componentName}CatalogPreview() {\n  return <${demoName} />;\n}\n`;",
            "  return `${generatedFileHeader}'use client';\n\nimport { ComponentDemoStateProvider } from '../../shared/ComponentDemoStateProvider';\n\nimport { ${demoName} } from './${demoName}';\n\nexport function ${model.componentName}CatalogPreview() {\n  return (\n    <ComponentDemoStateProvider resetKey='catalog:${model.slug}'>\n      <${demoName} />\n    </ComponentDemoStateProvider>\n  );\n}\n`;",
            'generated catalog preview state provider'
          );

          replaceOnce(
            'scripts/generators/component-page/renderers/catalog-preview-registry.test.ts',
            "    expect(source).toContain('return <AvatarDemo />;');",
            `    expect(source).toContain(\n      "import { ComponentDemoStateProvider } from '../../shared/ComponentDemoStateProvider';"\n    );\n    expect(source).toContain(\n      "<ComponentDemoStateProvider resetKey='catalog:avatar'>"\n    );\n    expect(source).toContain('<AvatarDemo />');`,
            'React catalog preview provider regression'
          );
          replaceOnce(
            'scripts/generators/component-page/renderers/catalog-preview-registry.test.ts',
            "    expect(source).toContain('return <NativeNativeOnlyDemo />;');",
            `    expect(source).toContain(\n      "<ComponentDemoStateProvider resetKey='catalog:nativeonly'>"\n    );\n    expect(source).toContain('<NativeNativeOnlyDemo />');`,
            'Native catalog preview provider regression'
          );
          NODE

          pnpm exec prettier \
            README.md \
            packages/metadata/src/tokenLifecycle.ts \
            packages/react/src/primitives/Textarea/Textarea.test.tsx \
            packages/react-native/src/primitives/Textarea/Textarea.test.tsx \
            packages/tokens/src/token-architecture.ts \
            packages/tokens/src/component-token-factory-conventions.test.ts \
            packages/tokens/src/component-token-dependencies.ts \
            scripts/check-public-api.mjs \
            scripts/component-production/missing-component-request.test.ts \
            scripts/canonical-gap/contract.test.ts \
            scripts/checks/vellira-ui-usage/checker.test.ts \
            scripts/generators/component-page/renderers/catalog-preview-registry.ts \
            scripts/generators/component-page/renderers/catalog-preview-registry.test.ts \
            --write

      - name: Align RN TextInput test harness with multiline props
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'packages/react-native/test/react-native.mock.tsx';
          let source = fs.readFileSync(file, 'utf8');

          const propsMarker = "  value?: string;\n  editable?: boolean;\n  placeholder?: string;";
          if (!source.includes(propsMarker)) {
            throw new Error('RN TextInput mock props marker not found.');
          }
          source = source.replace(
            propsMarker,
            "  value?: string;\n  defaultValue?: string;\n  multiline?: boolean;\n  editable?: boolean;\n  placeholder?: string;\n  maxLength?: number;"
          );

          const start = source.indexOf(
            'export const TextInput = forwardRef<HTMLInputElement, NativeProps>('
          );
          const endMarker = "TextInput.displayName = 'TextInput';";
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0) {
            throw new Error('RN TextInput mock implementation marker not found.');
          }

          const block = `export const TextInput = forwardRef<\n  HTMLInputElement | HTMLTextAreaElement,\n  NativeProps\n>(\n  (\n    {\n      value,\n      defaultValue,\n      multiline = false,\n      numberOfLines,\n      placeholder,\n      maxLength,\n      editable = true,\n      secureTextEntry,\n      keyboardType,\n      returnKeyType,\n      autoFocus,\n      onChangeText,\n      onFocus,\n      onBlur,\n      style,\n      testID,\n      nativeID,\n      accessibilityLabel,\n      accessibilityHint,\n      accessibilityLabelledBy,\n      'aria-describedby': ariaDescribedBy,\n      accessibilityState,\n    },\n    ref\n  ) => {\n    const sharedProps = {\n      'data-testid': testID,\n      id: nativeID,\n      'data-keyboard-type': keyboardType,\n      'data-return-key-type': returnKeyType,\n      'data-auto-focus': autoFocus ? 'true' : undefined,\n      'aria-label': accessibilityLabel,\n      'aria-description': accessibilityHint,\n      'aria-labelledby': accessibilityLabelledBy,\n      'aria-describedby': ariaDescribedBy,\n      placeholder,\n      maxLength,\n      disabled: !editable,\n      autoFocus,\n      style: flattenStyle(style),\n      onChange: (\n        event: React.ChangeEvent<HTMLInputElement | HTMLTextAreaElement>\n      ) => onChangeText?.(event.currentTarget.value),\n      onFocus,\n      onBlur,\n      ...stateProps(accessibilityState),\n    };\n\n    if (multiline) {\n      return (\n        <textarea\n          {...sharedProps}\n          ref={ref as React.ForwardedRef<HTMLTextAreaElement>}\n          data-multiline='true'\n          data-number-of-lines={numberOfLines}\n          rows={numberOfLines}\n          value={value}\n          defaultValue={value === undefined ? defaultValue : undefined}\n        />\n      );\n    }\n\n    return (\n      <input\n        {...sharedProps}\n        ref={ref as React.ForwardedRef<HTMLInputElement>}\n        value={value ?? ''}\n        type={secureTextEntry ? 'password' : 'text'}\n        inputMode={keyboardType === 'numeric' ? 'numeric' : undefined}\n      />\n    );\n  }\n);\nTextInput.displayName = 'TextInput';`;

          source =
            source.slice(0, start) +
            block +
            source.slice(end + endMarker.length);

          fs.writeFileSync(file, source);
          NODE

          pnpm exec prettier packages/react-native/test/react-native.mock.tsx --write

      - name: Prove Textarea runtime semantics
        shell: bash
        run: |
          pnpm --filter @vellira-ui/tokens preservation:check
          pnpm --filter @vellira-ui/react exec vitest run --config vitest.config.ts src/primitives/Textarea/Textarea.test.tsx
          pnpm --filter @vellira-ui/react-native exec vitest run --config vitest.config.ts src/primitives/Textarea/Textarea.test.tsx

      - name: Record semantic evidence only after proofs pass
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'packages/metadata/src/components/Textarea.metadata.ts';
          let source = fs.readFileSync(file, 'utf8');
          if (source.includes('semanticCapabilities:')) {
            throw new Error('Textarea semantic evidence already exists.');
          }
          const marker = "  capabilities: [\n    'controlled',\n    'uncontrolled',\n    'disabled',\n    'required',\n    'invalid',\n  ],\n";
          if (!source.includes(marker)) {
            throw new Error('Textarea metadata capability marker not found.');
          }
          source = source.replace(
            marker,
            `${marker}  semanticCapabilities: ['multiline', 'accessible-name'],\n`
          );
          fs.writeFileSync(file, source);
          NODE

          pnpm exec prettier packages/metadata/src/components/Textarea.metadata.ts --write
          pnpm --filter @vellira-ui/metadata test

      - name: Regenerate canonical public surfaces
        shell: bash
        run: |
          pnpm docs:api
          pnpm component-docs:generate
          pnpm component-pages:generate
          pnpm component-docs:check
          pnpm component-pages:check

      - name: Verify final Textarea integration
        shell: bash
        run: |
          pnpm check:tokens-semantic:strict
          pnpm check:component --all
          pnpm check:public-api
          pnpm docs:api:check
          pnpm test:tooling
          pnpm exec turbo run build --filter=@vellira-ui/website

      - name: Commit verified semantic completion and remove helper
        shell: bash
        run: |
          rm .github/workflows/one-time-textarea-semantic-completion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(textarea): complete canonical semantic intent"
          git push origin HEAD:feat/textarea-launch-component
