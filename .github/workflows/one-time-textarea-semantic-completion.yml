name: One-time Textarea Semantic Completion

on:
  push:
    branches:
      - feat/textarea-launch-component

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/textarea-launch-component
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align RN TextInput test harness with multiline props
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'packages/react-native/test/react-native.mock.tsx';
          let source = fs.readFileSync(file, 'utf8');

          const propsMarker = "  value?: string;\n  editable?: boolean;\n  placeholder?: string;";
          if (!source.includes(propsMarker)) {
            throw new Error('RN TextInput mock props marker not found.');
          }
          source = source.replace(
            propsMarker,
            "  value?: string;\n  defaultValue?: string;\n  multiline?: boolean;\n  editable?: boolean;\n  placeholder?: string;\n  maxLength?: number;"
          );

          const destructureMarker = `      value,\n      placeholder,\n      editable = true,\n      secureTextEntry,\n      keyboardType,\n      returnKeyType,\n      autoFocus,\n      onChangeText,\n      onFocus,\n      onBlur,\n      style,\n      testID,\n      nativeID,\n      accessibilityLabel,\n      accessibilityHint,\n      accessibilityLabelledBy,\n      accessibilityState,`;
          if (!source.includes(destructureMarker)) {
            throw new Error('RN TextInput mock destructure marker not found.');
          }
          source = source.replace(
            destructureMarker,
            `      value,\n      defaultValue,\n      multiline,\n      numberOfLines,\n      placeholder,\n      maxLength,\n      editable = true,\n      secureTextEntry,\n      keyboardType,\n      returnKeyType,\n      autoFocus,\n      onChangeText,\n      onFocus,\n      onBlur,\n      style,\n      testID,\n      nativeID,\n      accessibilityLabel,\n      accessibilityHint,\n      accessibilityLabelledBy,\n      'aria-describedby': ariaDescribedBy,\n      accessibilityState,`
          );

          const jsxMarker = `      data-return-key-type={returnKeyType}\n      data-auto-focus={autoFocus ? 'true' : undefined}\n      aria-label={accessibilityLabel}\n      aria-description={accessibilityHint}\n      aria-labelledby={accessibilityLabelledBy}\n      value={value ?? ''}\n      placeholder={placeholder}\n      disabled={!editable}\n      autoFocus={autoFocus}`;
          if (!source.includes(jsxMarker)) {
            throw new Error('RN TextInput mock JSX marker not found.');
          }
          source = source.replace(
            jsxMarker,
            `      data-return-key-type={returnKeyType}\n      data-auto-focus={autoFocus ? 'true' : undefined}\n      data-multiline={multiline ? 'true' : undefined}\n      data-number-of-lines={numberOfLines}\n      aria-label={accessibilityLabel}\n      aria-description={accessibilityHint}\n      aria-labelledby={accessibilityLabelledBy}\n      aria-describedby={ariaDescribedBy}\n      value={value}\n      defaultValue={value === undefined ? defaultValue : undefined}\n      placeholder={placeholder}\n      maxLength={maxLength}\n      disabled={!editable}\n      autoFocus={autoFocus}`
          );

          fs.writeFileSync(file, source);
          NODE

          cat > packages/react-native/src/primitives/Textarea/Textarea.test.tsx <<'TSX'
          import { act } from 'react';

          import { afterEach, describe, expect, it, vi } from 'vitest';

          import { FormField } from '../../patterns/FormField';
          import { render } from '../../test-utils/render';

          import { Textarea } from './Textarea';

          afterEach(() => {
            document.body.innerHTML = '';
          });

          describe('Native Textarea', () => {
            it('renders a labelled multiline TextInput with help and error semantics', () => {
              const { container, unmount } = render(
                <Textarea
                  label='Biography'
                  description='Tell us about yourself.'
                  error='Biography is required.'
                  defaultValue='Vellira builder'
                  placeholder='Write a short biography'
                  numberOfLines={4}
                  maxLength={120}
                />
              );

              const input = container.querySelector<HTMLInputElement>('input');

              expect(input?.value).toBe('Vellira builder');
              expect(input?.placeholder).toBe('Write a short biography');
              expect(input?.dataset.multiline).toBe('true');
              expect(input?.dataset.numberOfLines).toBe('4');
              expect(input?.maxLength).toBe(120);
              expect(input?.getAttribute('aria-label')).toBe('Biography');
              expect(container.textContent).toContain('Tell us about yourself.');
              expect(container.textContent).toContain('Biography is required.');

              unmount();
            });

            it('emits uncontrolled multiline value changes', () => {
              const onValueChange = vi.fn();
              const { container, unmount } = render(
                <Textarea
                  accessibilityLabel='Message'
                  defaultValue='First line'
                  onValueChange={onValueChange}
                />
              );
              const input = container.querySelector<HTMLInputElement>('input');
              const valueSetter = Object.getOwnPropertyDescriptor(
                HTMLInputElement.prototype,
                'value'
              )?.set;

              act(() => {
                valueSetter?.call(input, 'First line\nSecond line');
                input?.dispatchEvent(new Event('input', { bubbles: true }));
              });

              expect(onValueChange).toHaveBeenCalledWith('First line\nSecond line');
              expect(input?.value).toBe('First line\nSecond line');
              expect(input?.dataset.multiline).toBe('true');

              unmount();
            });

            it('uses label as accessible-name fallback and allows native override', () => {
              const { container, rerender, unmount } = render(
                <Textarea label='Notes' value='' />
              );

              expect(container.querySelector('input')?.getAttribute('aria-label')).toBe(
                'Notes'
              );

              rerender(
                <Textarea
                  label='Notes'
                  accessibilityLabel='Private notes'
                  value=''
                />
              );

              expect(container.querySelector('input')?.getAttribute('aria-label')).toBe(
                'Private notes'
              );

              unmount();
            });

            it('inherits FormField state without rendering a nested field wrapper', () => {
              const { container, unmount } = render(
                <FormField
                  id='notes'
                  label='Notes'
                  description='Internal notes.'
                  required
                  disabled
                  invalid
                  size='sm'
                >
                  <Textarea value='' />
                </FormField>
              );

              const input = container.querySelector<HTMLInputElement>('input');

              expect(input?.id).toBe('notes');
              expect(input?.disabled).toBe(true);
              expect(input?.getAttribute('aria-disabled')).toBe('true');
              expect(input?.getAttribute('aria-labelledby')).toBe('notes-label');
              expect(input?.getAttribute('aria-describedby')).toBe('notes-description');
              expect(container.querySelectorAll('input')).toHaveLength(1);
              expect(container.textContent).toContain('Internal notes.');

              unmount();
            });

            it('preserves controlled value and clamps numberOfLines to a multiline control', () => {
              const { container, unmount } = render(
                <Textarea
                  accessibilityLabel='Controlled message'
                  value='Controlled\nvalue'
                  numberOfLines={0}
                />
              );

              const input = container.querySelector<HTMLInputElement>('input');

              expect(input?.value).toBe('Controlled\nvalue');
              expect(input?.dataset.multiline).toBe('true');
              expect(input?.dataset.numberOfLines).toBe('1');

              unmount();
            });
          });
          TSX

      - name: Prove Textarea runtime semantics
        shell: bash
        run: |
          pnpm --filter @vellira-ui/tokens preservation:check
          pnpm --filter @vellira-ui/react exec vitest run --config vitest.config.ts src/primitives/Textarea/Textarea.test.tsx
          pnpm --filter @vellira-ui/react-native exec vitest run --config vitest.config.ts src/primitives/Textarea/Textarea.test.tsx

      - name: Record semantic evidence only after proofs pass
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'packages/metadata/src/components/Textarea.metadata.ts';
          let source = fs.readFileSync(file, 'utf8');
          if (source.includes('semanticCapabilities:')) {
            throw new Error('Textarea semantic evidence already exists.');
          }
          const marker = "  capabilities: [\n    'controlled',\n    'uncontrolled',\n    'disabled',\n    'required',\n    'invalid',\n  ],\n";
          if (!source.includes(marker)) {
            throw new Error('Textarea metadata capability marker not found.');
          }
          source = source.replace(
            marker,
            `${marker}  semanticCapabilities: ['multiline', 'accessible-name'],\n`
          );
          fs.writeFileSync(file, source);
          NODE

          pnpm --filter @vellira-ui/metadata test

      - name: Regenerate canonical public surfaces
        shell: bash
        run: |
          pnpm docs:api
          pnpm component-docs:generate
          pnpm component-pages:generate
          pnpm component-docs:check
          pnpm component-pages:check

      - name: Verify semantic completion contract
        shell: bash
        run: |
          pnpm check:component --all
          pnpm check:public-api

      - name: Commit verified semantic completion and remove helper
        shell: bash
        run: |
          rm .github/workflows/one-time-textarea-semantic-completion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(textarea): complete canonical semantic intent"
          git push origin HEAD:feat/textarea-launch-component
