name: Isolated security 967 preparation

on:
  push:
    branches: [repair/security-967-0ab29e7a]
    paths: [.github/workflows/security-967-prepare.yml]

permissions:
  contents: read

concurrency:
  group: security-967-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'vellira-dev/vellira' && github.ref == 'refs/heads/repair/security-967-0ab29e7a'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 0ab29e7a2f6addba750efeebb09eb7f89eb44ea1
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
      - name: Update only the three accepted overrides and regenerate the lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0ab29e7a2f6addba750efeebb09eb7f89eb44ea1
          test "$(pnpm --version)" = 11.20.0
          cp pnpm-lock.yaml "$RUNNER_TEMP/security-967-before.yaml"
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          let text = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          for (const [before, after] of [
            ["'js-yaml@<4': 3.15.1", "'js-yaml@<4': 3.15.2"],
            ["'js-yaml@>=4 <5': 4.3.1", "'js-yaml@>=4 <5': 4.3.2"],
            ['sharp: 0.35.3', 'sharp: 0.35.4'],
          ]) {
            assert.equal(text.split(before).length, 2, `Expected exactly one ${before}`);
            text = text.replace(before, after);
          }
          fs.writeFileSync('pnpm-workspace.yaml', text);
          NODE
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify graph, bounded YAML regressions and native sharp runtime
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { parse } = require('yaml');
          const base = '0ab29e7a2f6addba750efeebb09eb7f89eb44ea1';
          const allowed = ['pnpm-lock.yaml', 'pnpm-workspace.yaml'];
          const original = file => execFileSync('git', ['show', `${base}:${file}`], { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 });
          const read = file => fs.readFileSync(file, 'utf8');
          const before = parse(read(path.join(process.env.RUNNER_TEMP, 'security-967-before.yaml')));
          const after = parse(read('pnpm-lock.yaml'));
          const workspaceBefore = parse(original('pnpm-workspace.yaml'));
          const workspaceAfter = parse(read('pnpm-workspace.yaml'));
          const expectedWorkspace = structuredClone(workspaceBefore);
          expectedWorkspace.overrides['js-yaml@<4'] = '3.15.2';
          expectedWorkspace.overrides['js-yaml@>=4 <5'] = '4.3.2';
          expectedWorkspace.overrides.sharp = '0.35.4';
          assert.deepEqual(workspaceAfter, expectedWorkspace, 'Unexpected policy change');
          assert.deepEqual(after.overrides, expectedWorkspace.overrides);
          assert.deepEqual(after.settings, before.settings, 'Lock settings changed');
          assert.deepEqual(execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').sort(), allowed, 'Unexpected changed paths');
          const targets = { 'js-yaml': ['3.15.2', '4.3.2'], sharp: ['0.35.4'] };
          const decode = key => /^(@[^/]+\/[^@]+|[^@]+)@([^()]+)(?:\(|$)/.exec(key);
          function inspect(lock) {
            const errors = [];
            const inventory = {};
            if (lock.lockfileVersion !== '9.0' || !lock.packages || !lock.snapshots || !lock.importers) return { errors: ['Incomplete lockfile'], inventory, edges: 0 };
            for (const section of ['packages', 'snapshots']) {
              const found = {};
              for (const key of Object.keys(lock[section])) {
                const match = decode(key);
                if (!match) continue;
                const [, name, version] = match;
                if (targets[name]) {
                  (found[name] ??= new Set()).add(version);
                  (inventory[name] ??= new Set()).add(version);
                  if (!targets[name].includes(version)) errors.push(`${section}: ${key}`);
                }
                if ((name === 'vitest' || name === '@vitest/mocker') && version !== '4.1.11') errors.push(`Vitest regression: ${key}`);
                if (name.startsWith('@img/sharp-')) {
                  const expected = name.startsWith('@img/sharp-libvips-') ? '1.3.3' : '0.35.4';
                  if (version !== expected) errors.push(`Native binary mismatch: ${key}`);
                }
              }
              for (const [name, versions] of Object.entries(targets)) {
                if (JSON.stringify([...(found[name] || [])].sort()) !== JSON.stringify(versions)) errors.push(`${section}: incomplete ${name} inventory`);
              }
            }
            let edges = 0;
            for (const [owner, snapshot] of Object.entries(lock.snapshots)) {
              for (const kind of ['dependencies', 'optionalDependencies']) {
                for (const [name, version] of Object.entries(snapshot[kind] || {})) {
                  if (!targets[name] && !name.startsWith('@img/sharp-')) continue;
                  edges++;
                  const plain = version.split('(')[0];
                  const expected = targets[name] || [name.startsWith('@img/sharp-libvips-') ? '1.3.3' : '0.35.4'];
                  if (!expected.includes(plain) || !lock.snapshots[`${name}@${version}`]) errors.push(`Invalid edge: ${owner} -> ${name}@${version}`);
                }
              }
            }
            if (edges === 0) errors.push('Missing dependency edges');
            return { errors, edges, inventory: Object.fromEntries(Object.entries(inventory).map(([name, versions]) => [name, [...versions].sort()])) };
          }
          (async () => {
            const oldGraph = inspect(before);
            for (const key of ['js-yaml@3.15.1', 'js-yaml@4.3.1', 'sharp@0.35.3']) assert.ok(oldGraph.errors.some(e => e.includes(key)), `Baseline must reject ${key}`);
            const graph = inspect(after);
            assert.deepEqual(graph.errors, [], 'Incomplete remediation');
            for (const key of ['js-yaml@3.15.1', 'js-yaml@4.3.1', 'sharp@0.35.3']) {
              const broken = structuredClone(after);
              broken.packages[key] = {};
              assert.ok(inspect(broken).errors.length, `Regression escaped: ${key}`);
            }
            const missing = structuredClone(after);
            for (const key of Object.keys(missing.packages)) if (key.startsWith('sharp@')) delete missing.packages[key];
            assert.ok(inspect(missing).errors.length, 'Missing inventory must fail');
            for (const [importer, data] of Object.entries(before.importers)) {
              for (const kind of ['dependencies', 'devDependencies', 'optionalDependencies']) {
                assert.deepEqual(Object.keys(after.importers[importer][kind] || {}).sort(), Object.keys(data[kind] || {}).sort(), `Dependency keys changed: ${importer}`);
                for (const [name, dep] of Object.entries(data[kind] || {})) {
                  const next = after.importers[importer][kind][name];
                  assert.equal(next.specifier, dep.specifier, `Specifier changed: ${importer}:${name}`);
                  if (!targets[name]) assert.equal(next.version.split('(')[0], dep.version.split('(')[0], `Unrelated direct bump: ${importer}:${name}`);
                }
              }
            }
            const yamlPaths = execFileSync('find', ['node_modules', '-type', 'f', '-path', '*/js-yaml/package.json'], { encoding: 'utf8', timeout: 30000 }).trim().split('\n').filter(Boolean);
            const yamlVersions = new Set();
            for (const filename of yamlPaths) {
              const manifest = JSON.parse(read(filename));
              assert.ok(targets['js-yaml'].includes(manifest.version), `Installed old YAML: ${manifest.version}`);
              const yaml = require(path.resolve(path.dirname(filename)));
              assert.deepEqual(yaml.load('value: 7\nactive: true\n'), { value: 7, active: true });
              assert.deepEqual(yaml.load(yaml.dump({ value: 7 })), { value: 7 });
              assert.deepEqual(yaml.load('base: &base { value: 7 }\nresult:\n  <<: *base\n').result, { value: 7 });
              const emptyMerges = 'sources: &sources [' + Array(12).fill('{}').join(',') + ']\nresult:\n  <<: *sources\n';
              assert.throws(() => yaml.load(emptyMerges, { maxTotalMergeKeys: 4 }), /maxTotalMergeKeys/);
              yamlVersions.add(manifest.version);
            }
            assert.deepEqual([...yamlVersions].sort(), targets['js-yaml'], 'Both YAML majors must be exercised');
            const sharp = require('sharp');
            assert.equal(sharp.versions.sharp, '0.35.4');
            assert.equal(sharp.versions.heif, '1.23.2');
            const png = await sharp({ create: { width: 8, height: 8, channels: 3, background: { r: 20, g: 30, b: 40 } } }).png().toBuffer();
            const avif = await sharp(png).resize(4, 4).avif().toBuffer();
            const decoded = await sharp(avif).raw().toBuffer({ resolveWithObject: true });
            assert.equal(decoded.info.width, 4);
            assert.equal(decoded.info.height, 4);
            await assert.rejects(sharp(Buffer.from('not-an-image')).metadata());
            execFileSync('git', ['diff', '--check'], { stdio: 'inherit' });
            const evidence = { base, inventory: graph.inventory, resolvedEdges: graph.edges, baselineRejected: true, oldVersionRegressionsRejected: true, missingInventoryRejected: true, yamlRuntimeVersions: [...yamlVersions].sort(), emptyMergeBudgetRejected: true, sharpVersions: sharp.versions, pngAvifRoundTripPassed: true, invalidImageRejected: true, frozenInstallWithoutScriptsPassed: true, unchangedPolicyExceptThreeOverrides: true, directDependencyVersionsPreserved: true };
            const entries = allowed.map(filename => {
              const content = read(filename);
              const bytes = Buffer.from(content);
              const sha = crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
              return { path: filename, content, sha };
            });
            const out = path.join(process.env.RUNNER_TEMP, 'security-967-output');
            fs.mkdirSync(out, { recursive: true });
            const payload = JSON.stringify({ evidence, entries });
            fs.writeFileSync(path.join(out, 'repair.json'), payload);
            fs.writeFileSync(path.join(out, 'evidence.json'), JSON.stringify(evidence, null, 2));
            fs.writeFileSync(path.join(out, 'repair.patch'), execFileSync('git', ['diff', '--', ...allowed], { maxBuffer: 8 * 1024 * 1024 }));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `digest=${crypto.createHash('sha256').update(payload).digest('hex')}\n`);
            console.log(JSON.stringify(evidence, null, 2));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Preserve diagnostic diff
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-967-output"
          git diff --stat > "$RUNNER_TEMP/security-967-output/diff-stat.txt"
          git diff > "$RUNNER_TEMP/security-967-output/diagnostic.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: security-967-preparation
          path: ${{ runner.temp }}/security-967-output/
          if-no-files-found: error
          retention-days: 7

  store-blobs:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-967-preparation
          path: repair-input
      - name: Store verified blobs without modifying refs, PRs or deployments
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          (async () => {
            assert.equal(process.env.GITHUB_REPOSITORY, 'vellira-dev/vellira');
            assert.equal(process.env.GITHUB_REF, 'refs/heads/repair/security-967-0ab29e7a');
            const payload = fs.readFileSync('repair-input/repair.json');
            assert.equal(crypto.createHash('sha256').update(payload).digest('hex'), process.env.EXPECTED_DIGEST);
            const { evidence, entries } = JSON.parse(payload);
            assert.equal(evidence.base, '0ab29e7a2f6addba750efeebb09eb7f89eb44ea1');
            assert.deepEqual(entries.map(e => e.path), ['pnpm-lock.yaml', 'pnpm-workspace.yaml']);
            const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' };
            const blobs = [];
            for (const entry of entries) {
              const bytes = Buffer.from(entry.content);
              assert.equal(crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex'), entry.sha);
              const response = await fetch('https://api.github.com/repos/vellira-dev/vellira/git/blobs', { method: 'POST', headers, body: JSON.stringify({ content: entry.content, encoding: 'utf-8' }) });
              assert.ok(response.ok, `Blob upload failed: ${response.status}`);
              const result = await response.json();
              assert.equal(result.sha, entry.sha);
              blobs.push({ path: entry.path, sha: result.sha, mode: '100644', type: 'blob' });
            }
            console.log('SECURITY_967_BLOBS=' + JSON.stringify(blobs));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Preparation only. No refs, PRs, main or deployments changed.\n\n```json\n' + JSON.stringify({ ...evidence, blobs }, null, 2) + '\n```\n');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
