name: Disposable Avatar Contract Prettier Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/avatar-contract-format-proof.yml'

permissions:
  contents: read

jobs:
  format-evidence:
    name: Render canonical formatter result without committing code
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact proposed public PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.2'
      - name: Install current canonical formatter without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Emit actual canonical Prettier bytes in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier \
            docs/architecture/avatar-source-contract-v2.md \
            scripts/component-production/specs/Avatar.planning.json \
            scripts/component-program/avatar-contract.test.ts --write
          pnpm exec prettier \
            docs/architecture/avatar-source-contract-v2.md \
            scripts/component-production/specs/Avatar.planning.json \
            scripts/component-program/avatar-contract.test.ts --check
          git diff --check
      - name: Upload formatted files for reviewed changes only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avatar-v2-canonical-formatted-${{ github.run_id }}
          path: |
            docs/architecture/avatar-source-contract-v2.md
            scripts/component-production/specs/Avatar.planning.json
            scripts/component-program/avatar-contract.test.ts
          if-no-files-found: error
          retention-days: 1
