name: Coordinate Website Production Recovery

on:
  workflow_run:
    workflows: ['Deploy Website Cloudflare Production']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: vellira-production-recovery-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Check production gap and dispatch one verified recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/website/scripts/cloudflare-recovery-coordinator.mjs
