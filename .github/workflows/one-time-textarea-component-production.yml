name: One-time Textarea Component Production

on:
  push:
    branches:
      - feat/textarea-launch-component

permissions:
  contents: write

jobs:
  scaffold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/textarea-launch-component
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical Textarea production scaffold
        shell: bash
        run: |
          cat > /tmp/textarea-production.json <<'JSON'
          {
            "schemaVersion": "1",
            "componentName": "Textarea",
            "platform": "both",
            "layer": "primitives",
            "category": "form",
            "profile": "form-control",
            "control": "text",
            "capabilities": [
              "controlled",
              "uncontrolled",
              "disabled",
              "required",
              "invalid"
            ],
            "componentTokens": "standard",
            "parts": []
          }
          JSON

          node --import tsx scripts/component-production/cli.ts \
            --spec /tmp/textarea-production.json \
            > /tmp/textarea-production-result.json

          cat /tmp/textarea-production-result.json

          node - <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('/tmp/textarea-production-result.json', 'utf8'));
          if (result.status !== 'blocked' || result.lifecycle?.current !== 'semantic-completion-required') {
            console.error('Expected generated Textarea to stop at semantic-completion-required.');
            process.exit(1);
          }
          NODE

      - name: Commit deterministic scaffold and remove helper
        shell: bash
        run: |
          rm .github/workflows/one-time-textarea-component-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(textarea): generate canonical cross-platform scaffold"
          git push origin HEAD:feat/textarea-launch-component
