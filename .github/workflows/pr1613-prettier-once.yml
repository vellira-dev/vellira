name: PR 1613 scoped Prettier pass (temporary)

on:
  push:
    branches:
      - feat/core-account-overview-v1
    paths:
      - .github/workflows/pr1613-prettier-once.yml

permissions:
  contents: write

jobs:
  format:
    name: Format approved Core account files
    if: github.ref == 'refs/heads/feat/core-account-overview-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/core-account-overview-v1
          fetch-depth: 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - name: Format only the nine files reported by Quality CI
        run: |
          pnpm exec prettier --write \
            apps/website/src/component-catalog/shared/ComponentNavigationShell/ComponentNavigationShell.tsx \
            apps/website/src/components/layout/SiteHeader/SiteHeader.module.css \
            apps/website/src/components/layout/SiteHeader/SiteHeader.tsx \
            apps/website/src/product-app/AccountSettings.tsx \
            apps/website/src/product-app/AppSession.tsx \
            apps/website/src/product-app/AppShell.module.css \
            apps/website/src/product-app/AppShell.tsx \
            apps/website/src/product-app/BillingSettings.tsx \
            apps/website/src/product-app/EmailVerificationResend.tsx
          # CSS formatting in this large app shell needs a second canonical pass.
          # Check immediately afterward so we never commit non-idempotent output.
          pnpm exec prettier --write apps/website/src/product-app/AppShell.module.css
          pnpm exec prettier --check \
            apps/website/src/component-catalog/shared/ComponentNavigationShell/ComponentNavigationShell.tsx \
            apps/website/src/components/layout/SiteHeader/SiteHeader.module.css \
            apps/website/src/components/layout/SiteHeader/SiteHeader.tsx \
            apps/website/src/product-app/AccountSettings.tsx \
            apps/website/src/product-app/AppSession.tsx \
            apps/website/src/product-app/AppShell.module.css \
            apps/website/src/product-app/AppShell.tsx \
            apps/website/src/product-app/BillingSettings.tsx \
            apps/website/src/product-app/EmailVerificationResend.tsx
      # The scoped CSS selector has been aligned with the repo Stylelint policy.
      - name: Commit scoped formatting, preserving the account design
        run: |
          git config user.name "vellira-format[bot]"
          git config user.email "vellira-format[bot]@users.noreply.github.com"
          git add -- \
            apps/website/src/component-catalog/shared/ComponentNavigationShell/ComponentNavigationShell.tsx \
            apps/website/src/components/layout/SiteHeader/SiteHeader.module.css \
            apps/website/src/components/layout/SiteHeader/SiteHeader.tsx \
            apps/website/src/product-app/AccountSettings.tsx \
            apps/website/src/product-app/AppSession.tsx \
            apps/website/src/product-app/AppShell.module.css \
            apps/website/src/product-app/AppShell.tsx \
            apps/website/src/product-app/BillingSettings.tsx \
            apps/website/src/product-app/EmailVerificationResend.tsx
          if git diff --cached --quiet; then
            echo 'Nothing to format; no commit necessary.'
          else
            git commit -m "style(app): apply canonical Prettier to Core account files"
            git push origin HEAD:refs/heads/feat/core-account-overview-v1
          fi
