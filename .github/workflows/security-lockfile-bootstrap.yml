name: Temporary security lockfile bootstrap
on:
  push:
    branches:
      - 'security/patch-vite6-glob-ip-20261023'
permissions:
  contents: write
jobs:
  lockfile:
    if: >-
      github.event.head_commit.message == 'chore(security): seed bounded Vite glob ip fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact authored branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable bootstrap identity
        env:
          EXPECTED_REF: 'refs/heads/security/patch-vite6-glob-ip-20261023'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --porcelain)" = ''
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          cache: pnpm
      - name: Resolve lockfile without relaxing supply-chain policy
        run: pnpm install --lockfile-only
      - name: Reject stale vulnerable resolutions
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = readFileSync('pnpm-lock.yaml','utf8');
          for (const target of ['vite@6.4.3','glob@10.3.3','ip-address@10.7.1']) {
            assert.ok(!new RegExp('^  ' + target.replaceAll('.', '\\.') + ':', 'm').test(lock), `vulnerable ${target} remains`);
          }
          for (const target of ['vite@6.4.4','glob@10.5.0','ip-address@10.7.4','next@16.4.2','node-forge@1.4.0']) {
            assert.ok(lock.includes('\n  ' + target + ':'), `missing ${target}`);
          }
          assert.match(lock, /node-forge@1\.4\.0\(patch_hash=/);
          assert.match(lock, /sharp: 0\.35\.5/);
          NODE
          git diff --check
          test -z "$(git diff --name-only -- . ':!pnpm-lock.yaml')"
      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile
      - name: Commit regenerated lockfile to exact feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$(git diff --name-only -- pnpm-lock.yaml)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          git commit -m 'chore(security): regenerate audited pnpm lockfile'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/security/patch-vite6-glob-ip-20261023"
