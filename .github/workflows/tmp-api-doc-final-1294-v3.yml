name: Temporary API docs final 1294 v3

on:
  push:
    branches:
      - tmp/api-doc-final-1294-v3

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - name: Format tooling files
        run: pnpm exec prettier --write scripts/generate-api-docs.ts scripts/generate-api-docs.silent.test.ts
      - name: Focused tests
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generate-api-docs.silent.test.ts
      - name: API docs check
        run: pnpm docs:api:check
      - name: Component docs check
        run: pnpm component-docs:check
      - name: Capture formatted tooling files
        shell: bash
        run: |
          mkdir -p .artifacts/final/scripts
          cp scripts/generate-api-docs.ts .artifacts/final/scripts/
          cp scripts/generate-api-docs.silent.test.ts .artifacts/final/scripts/
          git diff --binary > .artifacts/final/generated.patch
          git status --short > .artifacts/final/status.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: api-doc-final-1294-v3
          path: .artifacts/final
          if-no-files-found: error
