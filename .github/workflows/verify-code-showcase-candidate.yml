name: Verify post-852 Vellira UI baseline

on:
  push:
    branches: [ci/852-code-showcase-verification]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c83761dd4a83eff4d514bc72cacd34de185cdd62
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture exact post-852 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c83761dd4a83eff4d514bc72cacd34de185cdd62
          mkdir -p .artifacts/vellira-ui-baseline
          pnpm check:vellira-ui-usage:json > .artifacts/vellira-ui-baseline/report.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('.artifacts/vellira-ui-baseline/report.json', 'utf8'));
          const byRule = new Map();
          const byPath = new Map();
          for (const finding of report.findings) {
            byRule.set(finding.ruleId, (byRule.get(finding.ruleId) ?? 0) + 1);
            byPath.set(finding.path, (byPath.get(finding.path) ?? 0) + 1);
          }
          console.log('SUMMARY', JSON.stringify(report.summary));
          console.log('RULES');
          for (const [rule, count] of [...byRule].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]))) console.log(`${count}\t${rule}`);
          console.log('TOP_PATHS');
          for (const [path, count] of [...byPath].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])).slice(0,30)) console.log(`${count}\t${path}`);
          console.log('FINDINGS');
          for (const finding of report.findings) {
            console.log(JSON.stringify({ruleId:finding.ruleId,path:finding.path,line:finding.line,column:finding.column,detected:finding.detected,canonicalAlternative:finding.canonicalAlternative,nextAction:finding.nextAction,message:finding.message}));
          }
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: post-852-vellira-ui-baseline
          path: .artifacts/vellira-ui-baseline/report.json
          if-no-files-found: error
          retention-days: 7
