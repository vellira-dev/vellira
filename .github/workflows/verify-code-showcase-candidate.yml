name: Verify isolated CodeShowcase candidate

on:
  push:
    branches: [ci/852-code-showcase-verification]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fe717ac2249780f923be5a4468238d96d4e7f804
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact canonical formatting diff
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = fe717ac2249780f923be5a4468238d96d4e7f804
          pnpm exec prettier scripts/checks/vellira-ui-usage/code-showcase.test.ts --write
          git diff --check
          git diff -- scripts/checks/vellira-ui-usage/code-showcase.test.ts
      - name: Run targeted source and negative regressions
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/checks/vellira-ui-usage/code-showcase.test.ts
      - name: Build candidate website and dependencies
        run: pnpm exec turbo run build --filter='@vellira-ui/website...'
      - name: Run built website browser regression
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/website exec next start -p 3101 > /tmp/code-showcase-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3101/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            cat /tmp/code-showcase-next.log >&2
            exit 1
          fi
          WEBSITE_URL=http://127.0.0.1:3101 pnpm --filter @vellira-ui/react-storybook exec node scripts/code-showcase-website-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isolated-code-showcase-evidence
          path: apps/react-storybook/test-results/code-showcase
          if-no-files-found: ignore
          retention-days: 7
