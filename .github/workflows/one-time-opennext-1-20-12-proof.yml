name: One-time OpenNext 1.20.12 candidate proof

on:
  push:
    branches:
      - security/next-16-4-2-sharp-20261023
    paths:
      - .github/workflows/one-time-opennext-1-20-12-proof.yml

permissions:
  contents: read

concurrency:
  group: one-time-opennext-1841
  cancel-in-progress: false

jobs:
  candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2

      - name: Prepare isolated version candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packagePath = 'apps/website/package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          if (pkg.dependencies.next !== '16.4.2' || pkg.devDependencies['@opennextjs/cloudflare'] !== '1.20.6') {
            throw new Error('Candidate starting versions changed; review before regeneration');
          }
          pkg.devDependencies['@opennextjs/cloudflare'] = '1.20.12';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          const workspace = 'pnpm-workspace.yaml';
          let yaml = fs.readFileSync(workspace, 'utf8');
          const old = "  '@opennextjs/cloudflare@1.20.6': patches/@opennextjs__cloudflare@1.20.6.patch\n";
          if (yaml.split(old).length !== 2) throw new Error('Old OpenNext patch mapping missing or duplicated');
          yaml = yaml.replace(old, '');
          fs.writeFileSync(workspace, yaml);
          NODE
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile
          pnpm patch @opennextjs/cloudflare@1.20.12 --edit-dir "$RUNNER_TEMP/opennext-patch-edit"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const base = path.join(process.env.RUNNER_TEMP, 'opennext-patch-edit', 'dist/cli/build/utils');
          const js = path.join(base, 'workerd.js');
          const src = fs.readFileSync(js, 'utf8');
          const needle = 'export function transformBuildCondition(conditionMap, condition) {';
          if (src.split(needle).length !== 2) throw new Error('OpenNext workerd.js API changed: manual review required');
          if (src.includes('typeof conditionMap !== "object"')) throw new Error('Upstream already includes fix: review patch removal');
          fs.writeFileSync(js, src.replace(needle, needle + '\n    if (typeof conditionMap !== "object" || conditionMap === null) {\n        return { transformedExports: conditionMap, hasBuildCondition: false };\n    }'));
          // Runtime fix only. Upstream TypeScript declarations are left intact;
          // the existing behavior tests must pass before candidate promotion.
          NODE
          pnpm patch-commit "$RUNNER_TEMP/opennext-patch-edit" --patches-dir patches
          pnpm install --frozen-lockfile

      - name: Prove OpenNext shorthand exports compatibility
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/website/scripts/opennext-string-exports-patch.test.mjs
          pnpm check:next-rsc-patch
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('node_modules/@opennextjs/cloudflare/package.json', 'utf8'));
          if (pkg.version !== '1.20.12') throw new Error('Incorrect installed OpenNext version');
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          if (!lock.includes('sharp: 0.35.5') || !lock.includes('next@16.4.2')) {
            throw new Error('Critical Next/sharp dependency resolution changed');
          }
          if (lock.includes('sharp@0.35.4:')) throw new Error('Vulnerable sharp remains resolved');
          NODE

      - name: Build and exercise actual Cloudflare Worker
        shell: bash
        env:
          VELLIRA_CHECKOUT_SHA: ${{ github.sha }}
          VELLIRA_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export GITHUB_SHA="$VELLIRA_CHECKOUT_SHA"
          pnpm exec turbo run build --filter='@vellira-ui/website^...'
          pnpm --dir apps/website run sync:brand
          pnpm --dir apps/website run build:opennext
          node apps/website/scripts/cloudflare-populate-local-cache.mjs
          node apps/website/scripts/cloudflare-local-runtime.mjs

      - name: Retain lockfile and runtime evidence for reviewed PR update
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opennext-1-20-12-pr1841-candidate-${{ github.run_id }}
          path: |
            apps/website/package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
            patches/@opennextjs__cloudflare@1.20.12.patch
            apps/website/.open-next/local-runtime-contract.json
            apps/website/.open-next/asset-audit-preactivation.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
