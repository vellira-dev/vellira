name: Expo SDK 58 Patch Lockfile Repair (2142)

on:
  push:
    branches:
      - fix/expo-58-patch-clean-consumer-2142
    paths:
      - 'apps/native-playground/package.json'
      - 'examples/workspace-starter/native/package.json'
      - '.github/workflows/expo-58-patch-lockfile-2142.yml'

permissions:
  contents: write

jobs:
  generate:
    name: Regenerate Expo patch lockfiles only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/expo-58-patch-clean-consumer-2142
          fetch-depth: 1
      - name: Reject wrong branch or unrelated Expo version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/expo-58-patch-clean-consumer-2142"
          node - <<'NODE'
          const fs = require('node:fs');
          for (const path of ['apps/native-playground/package.json', 'examples/workspace-starter/native/package.json']) {
            const manifest = JSON.parse(fs.readFileSync(path));
            if (manifest.dependencies.expo !== '58.0.24') throw Error('Unexpected Expo version in ' + path);
          }
          NODE
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Generate workspace pnpm lockfile without scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Generate independent Native Starter npm lockfile without scripts
        working-directory: examples/workspace-starter/native
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove both manifest versions and lockfile importers match
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const yaml = fs.readFileSync('pnpm-lock.yaml','utf8');
          const section = yaml.split('  apps/native-playground:')[1]?.split('\n  apps/')[0];
          if (!section || !/expo:\s*\n\s*specifier: 58\.0\.24\s*\n\s*version: 58\.0\.24\b/.test(section)) {
            throw Error('Native Playground pnpm lock importer does not match Expo 58.0.24');
          }
          const lock = JSON.parse(fs.readFileSync('examples/workspace-starter/native/package-lock.json','utf8'));
          if (lock.packages[''].dependencies.expo !== '58.0.24' || lock.packages['node_modules/expo'].version !== '58.0.24') {
            throw Error('Native Starter npm lock does not resolve Expo 58.0.24');
          }
          NODE
      - name: Commit generated lockfiles back to isolated PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- pnpm-lock.yaml examples/workspace-starter/native/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(native): regenerate Expo 58.0.24 lockfiles"
          git push origin HEAD:fix/expo-58-patch-clean-consumer-2142
