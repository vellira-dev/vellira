name: One-shot Checkbox docs guardrail hardening proof
on:
  push:
    branches:
      - feat/docs-checkbox-safe-adoption-20261014
permissions:
  contents: write
jobs:
  guardrail-proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Canonically format guardrail sources
        run: |
          pnpm exec prettier scripts/generators/component-docs/adopt-legacy-docs.ts scripts/generators/component-docs/adopt-legacy-docs.test.ts --write
      - name: Run negative concurrency and frontmatter regression suite
        run: |
          pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component-docs/adopt-legacy-docs.test.ts
      - name: Confirm managed Checkbox output remains deterministic
        run: |
          pnpm component-docs:generate Checkbox --check
          pnpm component-docs:adoption-audit Checkbox --json
          pnpm format:check
      - name: Remove temporary proof and push checked source
        shell: bash
        run: |
          rm .github/workflows/checkbox-docs-guardrail-proof-once.yml
          while IFS= read -r file; do
            case "$file" in
              scripts/generators/component-docs/adopt-legacy-docs.ts|scripts/generators/component-docs/adopt-legacy-docs.test.ts|.github/workflows/checkbox-docs-guardrail-proof-once.yml) ;;
              *) echo "::error::Unexpected generated change: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m "test(docs): format and verify fail-closed adoption hardening"
          git push origin HEAD:feat/docs-checkbox-safe-adoption-20261014
