name: Expo Zod Input Guard Prototype

on:
  pull_request:
    paths:
      - 'examples/workspace-starter/native/scripts/security-expo-output-boundary-prototype*.cjs'
      - '.github/workflows/expo-zod-input-guard-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-output:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - name: Test bounded input prototype
        run: node --test examples/workspace-starter/native/scripts/security-expo-output-boundary-prototype.test.cjs
