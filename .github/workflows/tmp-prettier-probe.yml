name: Temporary Prettier Probe

on:
  push:
    branches:
      - tmp/format-public-api-contract-1066

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      - name: Format and print exact file
        run: |
          pnpm exec prettier scripts/generators/component/public-api-contract.ts --write
          echo '-----BEGIN PRETTIER OUTPUT-----'
          cat scripts/generators/component/public-api-contract.ts
          echo '-----END PRETTIER OUTPUT-----'
