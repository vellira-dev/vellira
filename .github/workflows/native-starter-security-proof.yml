name: Native Starter Package-Exact Security Proof

on:
  pull_request:
    paths:
      - '.github/workflows/native-starter-security-proof.yml'
      - 'examples/workspace-starter/native/**'
  push:
    branches:
      - main
      - security/native-expo-package-exact-proof-20261025
    paths:
      - '.github/workflows/native-starter-security-proof.yml'
      - 'examples/workspace-starter/native/**'
      - 'examples/workspace-starter/native/scripts/security-certificate-proof.cjs'
      - 'examples/workspace-starter/native/scripts/security-asn1-adversarial.cjs'
      - 'examples/workspace-starter/native/scripts/security-expo-certificate-contract.cjs'
      - 'examples/workspace-starter/native/scripts/node-forge-1.4.0-candidate.patch'
      - 'examples/workspace-starter/native/scripts/apply-node-forge-patch.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-exact-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/workspace-starter/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
      - name: Install exact npm lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove lifecycle-disabled install is blocked at verification
        shell: bash
        run: |
          set -euo pipefail
          if npm run security:verify-patch > "$RUNNER_TEMP/unpatched.txt" 2>&1; then
            echo "::error::Lifecycle-disabled installation unexpectedly passed Expo guard verification"
            exit 1
          fi
          grep -F 'Unpatched Expo CLI' "$RUNNER_TEMP/unpatched.txt"
      - name: Verify installed code signing and basic RSA behavior
        run: npm run security:certificate-proof
      - name: Diagnose malformed nested ASN.1 DigestAlgorithm
        run: node scripts/security-asn1-adversarial.cjs
      - name: Verify published Forge 1.4.2 and guarded Expo lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-node-forge-patch.cjs --verify
          node scripts/security-asn1-adversarial.cjs --require-rejection
          node scripts/security-expo-58-guard.cjs --apply
          npm run security:verify-patch
          npm run security:certificate-proof
          node scripts/security-expo-certificate-contract.cjs
          cp node_modules/node-forge/lib/rsa.js "$RUNNER_TEMP/rsa-known-good.js"
          printf '\n// altered installed bytes\n' >> node_modules/node-forge/lib/rsa.js
          if node scripts/apply-node-forge-patch.cjs --verify; then
            echo "::error::Tampered published Forge RSA source passed verification"
            exit 1
          fi
          cp "$RUNNER_TEMP/rsa-known-good.js" node_modules/node-forge/lib/rsa.js
          node scripts/apply-node-forge-patch.cjs --verify
          npm ci --no-audit --no-fund
          npm run security:verify-patch
          node scripts/security-asn1-adversarial.cjs --require-rejection
          npm run security:certificate-proof
          node scripts/security-expo-certificate-contract.cjs
          echo "Clean npm ci checks published Forge RSA and pinned Expo schema-output guard." >> "$GITHUB_STEP_SUMMARY"
      - name: Typecheck Starter
        run: npm run typecheck
