name: Native Starter Package-Exact Security Proof

on:
  push:
    branches:
      - security/native-expo-package-exact-proof-20261025
    paths:
      - '.github/workflows/native-starter-security-proof.yml'
      - 'examples/workspace-starter/native/package.json'
      - 'examples/workspace-starter/native/scripts/security-certificate-proof.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-exact-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/workspace-starter/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - name: Install exact npm lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify installed code signing and basic RSA behavior
        run: npm run security:certificate-proof
      - name: Diagnose malformed nested ASN.1 DigestAlgorithm\n        run: node scripts/security-asn1-adversarial.cjs\n      - name: Typecheck Starter
        run: npm run typecheck
