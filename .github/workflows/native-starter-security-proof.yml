name: Native Starter Package-Exact Security Proof

on:
  push:
    branches:
      - security/native-expo-package-exact-proof-20261025
    paths:
      - '.github/workflows/native-starter-security-proof.yml'
      - 'examples/workspace-starter/native/package.json'
      - 'examples/workspace-starter/native/scripts/security-certificate-proof.cjs'
      - 'examples/workspace-starter/native/scripts/security-asn1-adversarial.cjs'
      - 'examples/workspace-starter/native/scripts/security-expo-certificate-contract.cjs'
      - 'examples/workspace-starter/native/scripts/node-forge-1.4.0-candidate.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-exact-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/workspace-starter/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - name: Install exact npm lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify installed code signing and basic RSA behavior
        run: npm run security:certificate-proof
      - name: Diagnose malformed nested ASN.1 DigestAlgorithm
        run: node scripts/security-asn1-adversarial.cjs
      - name: Prove fixed-behavior assertion fails on vulnerable package
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/security-asn1-adversarial.cjs --require-rejection > "$RUNNER_TEMP/rsa-rejection.txt" 2>&1; then
            echo "::error::Known-vulnerable node-forge unexpectedly passed the fixed-behavior regression."
            exit 1
          fi
          grep -F 'malformed DigestAlgorithm must be rejected' "$RUNNER_TEMP/rsa-rejection.txt"
          echo "Expected red regression confirmed; dependency is NOT remediated." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify offline pinned upstream candidate patch
        shell: bash
        run: |
          set -euo pipefail
          node -e "if(require('node-forge/package.json').version!=='1.4.0') throw Error('unexpected forge baseline')"
          test "$(grep -c '^@@ ' scripts/node-forge-1.4.0-candidate.patch)" -eq 3
          cp node_modules/node-forge/lib/rsa.js "$RUNNER_TEMP/rsa-original.js"
          trap 'cp "$RUNNER_TEMP/rsa-original.js" node_modules/node-forge/lib/rsa.js' EXIT
          git apply --check --unsafe-paths scripts/node-forge-1.4.0-candidate.patch
          git apply --unsafe-paths scripts/node-forge-1.4.0-candidate.patch
          node scripts/security-asn1-adversarial.cjs --require-rejection
          npm run security:certificate-proof
          node scripts/security-expo-certificate-contract.cjs
          echo "Pinned candidate applied locally from reviewed patch; no runtime fetch and no production mutation." >> "$GITHUB_STEP_SUMMARY"
      - name: Typecheck Starter
        run: npm run typecheck
