name: Issue 852 ComponentShowcase token probe

on:
  push:
    branches:
      - probe/852-component-showcase-tokens

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: probe/852-component-showcase-tokens
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture baseline audit
        run: pnpm check:vellira-ui-usage:json > /tmp/vellira-ui-before.json

      - name: Apply exact ComponentShowcase token migration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/website/src/sections/home/ComponentShowcase/ComponentShowcase.module.css';
          let source = fs.readFileSync(path, 'utf8');

          function replaceExact(before, after, expected) {
            const count = source.split(before).length - 1;
            if (count !== expected) {
              throw new Error(`${JSON.stringify(before)} expected ${expected} occurrences, got ${count}`);
            }
            source = source.split(before).join(after);
          }

          replaceExact('var(--text-tertiary)', 'var(--text-muted)', 7);
          replaceExact('var(--font-size-base)', 'var(--font-size-md)', 1);
          replaceExact(
            'var(--button-neutral-outline-focus-border)',
            'var(--button-neutral-ring)',
            1
          );
          replaceExact(
            `box-shadow:\n    0 30px 90px rgb(0 0 0 / 11%),\n    inset 0 1px 0 rgb(255 255 255 / 7%);`,
            `box-shadow: var(--shadow-xl), var(--shadow-inset);`,
            1
          );
          replaceExact(
            'box-shadow: 0 18px 44px rgb(0 0 0 / 10%);',
            'box-shadow: var(--shadow-lg);',
            1
          );
          replaceExact(
            'box-shadow: 0 18px 44px rgb(0 0 0 / 9%);',
            'box-shadow: var(--shadow-lg);',
            1
          );

          fs.writeFileSync(path, source);
          NODE

      - name: Format migrated stylesheet
        run: pnpm exec prettier apps/website/src/sections/home/ComponentShowcase/ComponentShowcase.module.css --write

      - name: Verify exact audit delta
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:vellira-ui-usage:json > /tmp/vellira-ui-after.json
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('/tmp/vellira-ui-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('/tmp/vellira-ui-after.json', 'utf8'));
          const prefix = 'apps/website/src/sections/home/ComponentShowcase/';
          const beforeTarget = before.findings.filter((finding) => finding.path.startsWith(prefix));
          const afterTarget = after.findings.filter((finding) => finding.path.startsWith(prefix));
          const afterCss = afterTarget.filter((finding) => finding.path.endsWith('.module.css'));
          const afterBypass = afterTarget.filter((finding) => finding.ruleId === 'vellira-ui.existing-component-bypass');

          if (beforeTarget.length !== 15) {
            throw new Error(`expected 15 baseline ComponentShowcase findings, got ${beforeTarget.length}`);
          }
          if (afterTarget.length !== 3 || afterCss.length !== 0 || afterBypass.length !== 3) {
            throw new Error(
              `expected only 3 existing-component-bypass findings after CSS migration, got ${JSON.stringify(afterTarget)}`
            );
          }
          if (before.summary.findings - after.summary.findings !== 12) {
            throw new Error(
              `expected global audit delta -12, got ${before.summary.findings} -> ${after.summary.findings}`
            );
          }

          const source = fs.readFileSync(
            'apps/website/src/sections/home/ComponentShowcase/ComponentShowcase.module.css',
            'utf8'
          );
          for (const forbidden of [
            '--text-tertiary',
            '--font-size-base',
            '--button-neutral-outline-focus-border',
            'rgb(0 0 0 / 11%)',
            'rgb(0 0 0 / 10%)',
            'rgb(0 0 0 / 9%)',
          ]) {
            if (source.includes(forbidden)) {
              throw new Error(`legacy/raw token usage remains: ${forbidden}`);
            }
          }

          console.log(`ComponentShowcase findings: ${beforeTarget.length} -> ${afterTarget.length}`);
          console.log(`ComponentShowcase CSS findings: 12 -> ${afterCss.length}`);
          console.log(`Global findings: ${before.summary.findings} -> ${after.summary.findings}`);
          NODE

      - name: Validate website
        run: |
          pnpm website:typecheck
          pnpm build
          pnpm website:build

      - name: Check diff
        run: git diff --check

      - name: Commit validated production tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-852-component-showcase-token-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/website/src/sections/home/ComponentShowcase/ComponentShowcase.module.css \
            .github/workflows/issue-852-component-showcase-token-probe.yml
          git commit -m 'refactor(website): migrate ComponentShowcase to canonical tokens'
          git push origin HEAD:probe/852-component-showcase-tokens
