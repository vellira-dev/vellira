name: PR 907 Storybook Peer Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 907
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install aligned Storybook React peers
        run: >-
          pnpm --filter @vellira-ui/react-storybook add -D --save-exact
          @storybook/react@10.5.7
          @storybook/react-dom-shim@10.5.7

      - name: Commit generated dependency graph
        shell: bash
        run: |
          if git diff --quiet -- apps/react-storybook/package.json pnpm-lock.yaml; then
            echo "Dependency graph already aligned."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/react-storybook/package.json pnpm-lock.yaml
          git commit -m "fix(storybook): pin aligned React peer graph"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
