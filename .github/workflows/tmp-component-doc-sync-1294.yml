name: Temporary component docs sync 1294

on:
  push:
    branches:
      - tmp/api-doc-component-sync-1294

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check scripts/generate-api-docs.ts scripts/generate-api-docs.silent.test.ts
      - run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generate-api-docs.silent.test.ts
      - run: pnpm docs:api:check
      - name: Check component docs
        shell: bash
        run: |
          set +e
          pnpm component-docs:check
          status=$?
          set -e
          mkdir -p .artifacts/component-sync
          echo "$status" > .artifacts/component-sync/check-status.txt
      - name: Regenerate component docs for evidence
        run: pnpm component-docs:generate
      - name: Capture component docs diff
        shell: bash
        run: |
          git diff --binary > .artifacts/component-sync/generated.patch
          git status --short > .artifacts/component-sync/status.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: component-doc-sync-1294
          path: .artifacts/component-sync
          if-no-files-found: error
