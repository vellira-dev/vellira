name: Expo Zod Remaining Surface Audit

on:
  pull_request:
    paths:
      - '.github/workflows/expo-zod-remaining-surfaces.yml'
      - 'examples/workspace-starter/native/scripts/security-expo-zod-remaining-surfaces.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: examples/workspace-starter/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - run: npm ci --no-audit --no-fund
      - name: Verify pinned local mitigations
        run: npm run security:verify-patch
      - name: Audit remaining installed Zod call sites
        run: node scripts/security-expo-zod-remaining-surfaces.cjs
