name: Docs adoption Prettier second pass 1654

on:
  push:
    branches:
      - fix/component-docs-safe-legacy-adoption-20261014
    paths:
      - .github/workflows/docs-adoption-format-pass2-1654.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Print second-pass formatting delta
        run: |
          pnpm exec prettier --write scripts/generators/component-docs/legacy-adoption.ts
          echo '===BEGIN_ADOPTION_PASS2_DIFF==='
          git diff -- scripts/generators/component-docs/legacy-adoption.ts
          echo '===END_ADOPTION_PASS2_DIFF==='
