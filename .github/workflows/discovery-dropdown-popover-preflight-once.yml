name: One-shot Dropdown Popover Discovery preflight
on:
  push:
    branches:
      - feat/discovery-dropdown-popover-20261014
permissions:
  contents: write
jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate and format canonical pages
        run: |
          pnpm create:component-page Dropdown --force
          pnpm create:component-page Popover --force
          pnpm exec prettier apps/website/src/component-catalog/components/Dropdown/metadata.ts apps/website/src/component-catalog/components/Popover/metadata.ts apps/website/src/component-catalog/registry/componentPages.ts apps/website/src/component-catalog/registry/componentPresentation.ts scripts/seo/component-discovery-contract.ts scripts/seo/component-discovery-contract.test.ts --write
          pnpm format:check
          pnpm component-pages:check
          pnpm check:component-discovery
      - name: Enforce exact scope and self-remove
        run: |
          rm .github/workflows/discovery-dropdown-popover-preflight-once.yml
          unexpected="$(git diff --name-only | grep -v -E '^(apps/website/src/component-catalog/components/(Dropdown|Popover)/metadata\.ts|apps/website/src/component-catalog/registry/(componentPages|componentPresentation)\.ts|scripts/seo/component-discovery-contract(\.test)?\.ts)$' | grep -v -F -x '.github/workflows/discovery-dropdown-popover-preflight-once.yml' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m "chore(discovery): canonical generation and formatting"
          git push origin HEAD:feat/discovery-dropdown-popover-20261014
