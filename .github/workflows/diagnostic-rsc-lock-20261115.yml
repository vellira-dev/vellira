name: One-time RSC lock proof (diagnostic only)
on:
  push:
    branches:
      - diagnostic/rsc-security-lock-20261115
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
      - name: Regenerate only lockfile, without lifecycle scripts
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const s = fs.readFileSync('pnpm-lock.yaml','utf8');
          assert.match(s, /react-server-dom-webpack@19\\.2\\.9:/);
          assert.doesNotMatch(s, /react-server-dom-webpack@19\\.2\\.8:/);
          assert.match(s, /'@expo\\/router-server>react-server-dom-webpack': 19\\.2\\.9/);
          console.log('RSC 19.2.9 replacement graph verified; 19.2.8 absent');
          NODE
          pnpm install --lockfile-only --ignore-scripts --frozen-lockfile
          git diff --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: rsc-19-2-9-lock
          path: |
            pnpm-workspace.yaml
            pnpm-lock.yaml
          retention-days: 1
