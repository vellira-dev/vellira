name: One-shot Checkbox failed-rollback recovery proof
on:
  push:
    branches:
      - feat/docs-checkbox-safe-adoption-20261014
permissions:
  contents: write
jobs:
  recovery-proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Canonical source formatting
        run: pnpm exec prettier scripts/generators/component-docs/adopt-legacy-docs.ts scripts/generators/component-docs/adopt-legacy-docs.test.ts --write
      - name: Test retained backups on failed rollback
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component-docs/adopt-legacy-docs.test.ts
      - name: Test full component docs generator
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component-docs
      - name: Verify deterministic docs and Prettier
        run: |
          pnpm component-docs:generate Checkbox --check
          pnpm component-docs:adoption-audit Checkbox --json
          pnpm format:check
      - name: Self remove and commit bounded formatting changes
        shell: bash
        run: |
          rm .github/workflows/checkbox-docs-recovery-proof-once.yml
          while IFS= read -r file; do
            case "$file" in
              scripts/generators/component-docs/adopt-legacy-docs.ts|scripts/generators/component-docs/adopt-legacy-docs.test.ts|.github/workflows/checkbox-docs-recovery-proof-once.yml) ;;
              *) echo "::error::Unexpected modified file: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m "test(docs): format and verify retained recovery backups"
          git push origin HEAD:feat/docs-checkbox-safe-adoption-20261014
