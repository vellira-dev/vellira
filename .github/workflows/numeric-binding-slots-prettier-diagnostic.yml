name: Finite Numeric Slots Prettier Diagnostic
on:
  push:
    branches:
      - feat/numeric-binding-slots-contract-v1
permissions:
  contents: read
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Print canonical formatter changes (read-only)
        run: |
          npx --yes prettier@3.9.8 --write packages/metadata/src/componentProgram.ts scripts/component-program/parse.ts scripts/component-program/compile.ts scripts/component-program/numeric-binding-slots.ts scripts/component-program/numeric-binding-slots.test.ts docs/architecture/FINITE_NUMERIC_BINDING_SLOTS_V1.md
          git diff -- packages/metadata/src/componentProgram.ts scripts/component-program/parse.ts scripts/component-program/compile.ts scripts/component-program/numeric-binding-slots.ts scripts/component-program/numeric-binding-slots.test.ts docs/architecture/FINITE_NUMERIC_BINDING_SLOTS_V1.md
