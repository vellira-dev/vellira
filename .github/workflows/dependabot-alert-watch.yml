name: Dependabot Alert Watch

on:
  schedule:
    # Every day at 08:00 UTC
    - cron: '0 8 * * *'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/dependabot.yml'
      - '.github/dependabot-verified-backports.json'
      - 'patches/**'
      - 'scripts/ci/dependabot-verified-backports.mjs'
      - '.github/workflows/dependabot-alert-watch.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  issues: write

concurrency:
  group: dependabot-alert-watch
  cancel-in-progress: true

jobs:
  check-alerts:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve exact main revision
        id: main
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          test "$main_sha" != "null"
          test -n "$main_sha"
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout observed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.main.outputs.sha }}
          persist-credentials: false

      - name: Check unresolved High and Critical Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ISSUE_TITLE="Unresolved Dependabot security alerts"
          main_sha="${{ steps.main.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "$main_sha"

          read_alerts() {
            gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GH_REPO}/dependabot/alerts?state=open&per_page=100" \
            | jq -s '
                add
                | map(
                    select(
                      .security_advisory.severity == "high"
                      or .security_advisory.severity == "critical"
                    )
                  )
              '
          }

          max_reads=1
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # Dependency graph / Dependabot alert refresh is asynchronous after
            # a lockfile or manifest merge. Give the API a bounded convergence
            # window before publishing the canonical tracker state.
            max_reads=4
          fi

          read_number=1
          while true; do
            raw_alerts="$(read_alerts)"
            jq -e 'type == "array"' <<< "$raw_alerts" > /dev/null
            printf '%s\n' "$raw_alerts" > /tmp/dependabot-alerts-raw.json

            node scripts/ci/dependabot-verified-backports.mjs \
              /tmp/dependabot-alerts-raw.json \
              /tmp/dependabot-alerts-effective.json \
              /tmp/dependabot-verified-backports.json

            alerts="$(cat /tmp/dependabot-alerts-effective.json)"
            verified_backports="$(cat /tmp/dependabot-verified-backports.json)"
            raw_count="$(jq 'length' <<< "$raw_alerts")"
            count="$(jq 'length' <<< "$alerts")"
            verified_count="$(jq 'length' <<< "$verified_backports")"

            if [[ "$count" -eq 0 || "$read_number" -ge "$max_reads" ]]; then
              break
            fi

            echo "Dependabot still reports $count unmitigated High/Critical alert(s) after dependency change; waiting for graph convergence (read $read_number/$max_reads)." >> "$GITHUB_STEP_SUMMARY"
            sleep 30
            read_number=$((read_number + 1))
          done

          development_count="$(
            jq '[.[] | select(.dependency.scope == "development")] | length' <<< "$alerts"
          )"
          runtime_count="$(
            jq '[.[] | select(.dependency.scope != "development")] | length' <<< "$alerts"
          )"
          {
            echo "Raw open High/Critical alerts: $raw_count"
            echo "Verified backports: $verified_count"
            echo "Unmitigated High/Critical alerts: $count"
            echo "Development-scope alerts: $development_count"
            echo "Runtime-scope alerts: $runtime_count"
            echo "Dependency graph reads: $read_number"
            echo "Trigger SHA: $GITHUB_SHA"
            echo "Observed main SHA: $main_sha"
          } >> "$GITHUB_STEP_SUMMARY"

          find_tracker() {
            local state="$1"
            gh issue list \
              --repo "$GH_REPO" \
              --state "$state" \
              --search "\"${ISSUE_TITLE}\" in:title" \
              --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" \
              | head -n 1
          }

          existing_open="$(find_tracker open)"
          existing_closed=""
          if [ -z "$existing_open" ]; then
            existing_closed="$(find_tracker closed)"
          fi

          if [ "$count" -eq 0 ]; then
            echo "No unmitigated High/Critical Dependabot alerts."

            if [ -n "$existing_open" ]; then
              backport_note=""
              if [ "$verified_count" -gt 0 ]; then
                backport_note=" Raw Dependabot alert(s) remain visible only where an exact fail-closed verified backport is active."
              fi
              gh issue close "$existing_open" \
                --repo "$GH_REPO" \
                --comment "All unmitigated High/Critical Dependabot alerts have been resolved automatically against observed main \`${main_sha}\`.${backport_note}"
            fi

            exit 0
          fi

          {
            echo "## Unresolved Dependabot security alerts"
            echo
            echo "This issue is maintained automatically."
            echo
            echo "Found **${count}** unmitigated High/Critical alert(s)."
            if [ "$verified_count" -gt 0 ]; then
              echo
              echo "**${verified_count}** additional raw alert(s) are covered by exact verified backports and remain visible in Dependabot."
            fi
            echo
            echo "| Severity | Scope | Package | Manifest | Alert |"
            echo "| --- | --- | --- | --- | --- |"

            jq -r '
              .[] |
              "| \(.security_advisory.severity | ascii_upcase) | \(.dependency.scope // "unknown") | `\(.dependency.package.name)` | `\(.dependency.manifest_path // "unknown")` | \(.security_advisory.summary) (#\(.number)) |"
            ' <<< "$alerts"

            echo
            echo "_Last checked: $(date -u '+%Y-%m-%d %H:%M UTC') against observed main \`${main_sha}\` after ${read_number} dependency-graph read(s)_"
          } > /tmp/dependabot-alerts.md

          if [ -n "$existing_open" ]; then
            echo "Updating open issue #${existing_open}."

            gh issue edit "$existing_open" \
              --repo "$GH_REPO" \
              --body-file /tmp/dependabot-alerts.md
          elif [ -n "$existing_closed" ]; then
            echo "Reopening and updating closed issue #${existing_closed}."

            gh issue reopen "$existing_closed" \
              --repo "$GH_REPO" \
              --comment "High/Critical Dependabot alerts remain unresolved; reopening this launch security gate automatically."

            gh issue edit "$existing_closed" \
              --repo "$GH_REPO" \
              --body-file /tmp/dependabot-alerts.md
          else
            echo "Creating tracking issue."

            gh issue create \
              --repo "$GH_REPO" \
              --title "$ISSUE_TITLE" \
              --body-file /tmp/dependabot-alerts.md
          fi