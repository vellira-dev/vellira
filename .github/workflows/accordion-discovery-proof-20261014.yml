name: Accordion Discovery Pilot Validation

on:
  push:
    branches:
      - feat/discovery-accordion-pilot-20261014
    paths:
      - .github/workflows/accordion-discovery-proof-20261014.yml

permissions:
  contents: read

jobs:
  source-and-generated-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
      - name: Install frozen graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format source and project exact component
        run: |
          pnpm exec prettier --write apps/website/src/component-catalog/components/Accordion/metadata.ts apps/website/src/component-catalog/registry/componentPages.ts scripts/seo/component-discovery-contract.ts
          echo '===BEGIN_ACCORDION_SOURCE_FORMAT_PATCH==='
          git diff -- apps/website/src/component-catalog/components/Accordion/metadata.ts apps/website/src/component-catalog/registry/componentPages.ts scripts/seo/component-discovery-contract.ts
          echo '===END_ACCORDION_SOURCE_FORMAT_PATCH==='
          pnpm create:component-page Accordion --force
          echo '===BEGIN_ACCORDION_GENERATION_PATCH==='
          git diff -- apps/website/src/component-catalog/registry/componentPages.ts apps/website/src/component-catalog/registry/componentPresentation.ts apps/website/src/component-catalog/components/Accordion
          echo '===END_ACCORDION_GENERATION_PATCH==='
          pnpm create:component-page Accordion --force --check --json
          pnpm check:component-discovery
          git status --short
