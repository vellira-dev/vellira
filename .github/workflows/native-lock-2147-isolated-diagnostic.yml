name: Native Starter lockfile diagnostic (isolated)
on:
  push:
    branches:
      - diagnostic/native-lock-2147-20261115
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: examples/workspace-starter/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          registry-url: https://registry.npmjs.org
      - name: Generate exact npm lock without running lifecycle scripts
        run: |
          set -euo pipefail
          npm pkg set dependencies.expo=58.0.25 'dependencies.expo-blur=~58.0.6'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node - <<'NODE'
          const a = require('node:assert/strict');
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const l = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          a.equal(m.dependencies.expo, '58.0.25');
          a.equal(m.dependencies['expo-blur'], '~58.0.6');
          a.equal(l.packages['node_modules/expo']?.version, '58.0.25');
          a.equal(l.packages['node_modules/expo-blur']?.version, '58.0.6');
          a.equal(l.packages['node_modules/node-forge']?.version, '1.4.3');
          a.equal(l.packages['']?.dependencies.react, '19.3.0');
          a.equal(l.packages['']?.dependencies['react-dom'], '19.3.0');
          console.log('EXACT NPM LOCK GENERATED; no lifecycle scripts executed.');
          NODE
          mkdir -p "$RUNNER_TEMP/native-starter-evidence"
          cp package.json package-lock.json "$RUNNER_TEMP/native-starter-evidence/"
          cp node_modules/expo/node_modules/@expo/cli/build/src/start/server/devtools/DevToolsPluginCliExtensionResults.js "$RUNNER_TEMP/native-starter-evidence/expo-cli-parser.js"
          cp node_modules/expo/node_modules/@expo/cli/package.json "$RUNNER_TEMP/native-starter-evidence/expo-cli-package.json"
          cp node_modules/node-forge/lib/rsa.js "$RUNNER_TEMP/native-starter-evidence/forge-rsa.js"
          sha256sum "$RUNNER_TEMP/native-starter-evidence/"*.js
          echo "EXPO CLI METADATA:"
          node -p "JSON.stringify({version:require('./node_modules/expo/node_modules/@expo/cli/package.json').version,zod:require('./node_modules/expo/node_modules/@expo/cli/package.json').dependencies.zod})"
      - name: Persist exact generated lockfile in isolated branch only
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "vellira-lock-diagnostic[bot]"
          git config user.email "vellira-lock-diagnostic[bot]@users.noreply.github.com"
          git add examples/workspace-starter/native/package.json examples/workspace-starter/native/package-lock.json
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to persist"; exit 0; }
          git commit -m "test(starter): publish exact isolated npm lock [skip ci]"
          git push origin HEAD:refs/heads/diagnostic/native-lock-2147-20261115
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-starter-lock-2147
          path: ${{ runner.temp }}/native-starter-evidence/
          retention-days: 1
