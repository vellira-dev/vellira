name: Temporary API docs materializer 1294

on:
  push:
    branches:
      - tmp/api-doc-materialize-1294

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - run: pnpm install --frozen-lockfile

      - name: Format tooling files
        run: pnpm exec prettier --write scripts/generate-api-docs.ts scripts/generate-api-docs.silent.test.ts

      - name: Focused deterministic tests
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generate-api-docs.silent.test.ts

      - name: Generate API docs
        run: pnpm docs:api

      - name: Generate dependent component docs
        run: pnpm component-docs:generate

      - name: Verify generated docs
        run: |
          pnpm docs:api:check
          pnpm component-docs:check
          git diff --check

      - name: Commit canonical outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/generate-api-docs.ts \
            scripts/generate-api-docs.silent.test.ts \
            packages/react/API.md \
            packages/react-native/API.md \
            apps/docs/src/react \
            apps/docs/src/react-native
          if git diff --cached --quiet; then
            echo "No canonical changes to commit."
            exit 0
          fi
          git commit -m "chore(tmp): materialize deterministic API docs"
          git push origin HEAD:tmp/api-doc-materialize-1294
