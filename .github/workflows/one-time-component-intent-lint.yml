name: One-time Component Intent Lint

on:
  push:
    branches:
      - feat/component-intent-capability-coverage-v1

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/component-intent-capability-coverage-v1
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Autofix exact metadata files
        run: |
          pnpm exec prettier --write \
            packages/metadata/src/componentIntent.ts \
            packages/metadata/src/componentIntent.test.ts
          pnpm exec eslint --fix \
            packages/metadata/src/componentIntent.ts \
            packages/metadata/src/componentIntent.test.ts
          pnpm exec prettier --write \
            packages/metadata/src/componentIntent.ts \
            packages/metadata/src/componentIntent.test.ts

      - name: Validate metadata contract
        run: |
          pnpm --filter @vellira-ui/metadata test
          pnpm --filter @vellira-ui/metadata typecheck
          pnpm --filter @vellira-ui/metadata build
          pnpm exec eslint \
            packages/metadata/src/componentIntent.ts \
            packages/metadata/src/componentIntent.test.ts
          pnpm exec prettier --check \
            packages/metadata/src/componentIntent.ts \
            packages/metadata/src/componentIntent.test.ts

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/one-time-component-intent-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/metadata/src/componentIntent.ts \
            packages/metadata/src/componentIntent.test.ts \
            .github/workflows/one-time-component-intent-lint.yml
          if git diff --cached --quiet; then
            echo "No normalization changes; creating cleanup commit only."
          fi
          git commit -m "style(metadata): normalize component intent contract"
          git push origin HEAD:feat/component-intent-capability-coverage-v1
