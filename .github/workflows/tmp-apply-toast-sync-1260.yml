name: Temporary apply Toast deterministic sync 1260

on:
  push:
    branches:
      - tmp/toast-targeted-apply-1260

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/issue-564-toast-production
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - run: pnpm install --frozen-lockfile

      - name: Synchronize deterministic Toast ownership
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';

          import {
            parseComponentProductionInput,
            createComponentProductionGeneratorOptions,
          } from './scripts/component-production/contracts.ts';
          import { createComponentGenerationPlan } from './scripts/generators/component/plan.ts';
          import {
            createComponentMetadataFromPlan,
            createMetadataTemplateParamsFromPlan,
          } from './scripts/generators/component/metadata.ts';
          import { renderMetadataTemplate } from './scripts/generators/component/templates/index.ts';
          import { formatGeneratedContent } from './scripts/generators/format-generated-files.ts';
          import { generateComponentDocumentation } from './scripts/generators/component/docs.ts';
          import {
            synchronizeComponentTokenArchitectureRegistration,
            checkComponentTokenArchitectureRegistration,
          } from './scripts/generators/component/token-architecture-registration-contract.ts';
          import { checkGeneratedPlanContract } from './scripts/generators/component/plan-contract.ts';

          const root = process.cwd();
          const input = parseComponentProductionInput(
            JSON.parse(
              fs.readFileSync(
                'scripts/component-production/specs/Toast.json',
                'utf8'
              )
            )
          );
          const plan = createComponentGenerationPlan({
            root,
            options: createComponentProductionGeneratorOptions(input),
          });

          const architectureResult = { updatedFiles: [] };
          await synchronizeComponentTokenArchitectureRegistration({
            plan,
            result: architectureResult,
          });

          const metadataSource = await formatGeneratedContent(
            plan.metadataFile,
            renderMetadataTemplate(createMetadataTemplateParamsFromPlan(plan))
          );
          fs.writeFileSync(plan.metadataFile, metadataSource);

          await generateComponentDocumentation({
            root,
            plan,
            metadata: createComponentMetadataFromPlan(plan),
            createdFiles: [],
            updatedFiles: [],
          });

          const architectureDrift =
            await checkComponentTokenArchitectureRegistration(plan);
          const planDrift = await checkGeneratedPlanContract(plan);

          if (architectureDrift.length > 0 || planDrift.length > 0) {
            throw new Error(
              JSON.stringify({ architectureDrift, planDrift }, null, 2)
            );
          }
          NODE

      - name: Verify exact targeted surface
        shell: bash
        run: |
          expected="$(cat <<'EOF'
apps/docs/src/react-native/toast.md
apps/docs/src/react/toast.md
packages/metadata/src/components/Toast.metadata.ts
packages/react-native/API.md
packages/react/API.md
packages/tokens/src/generated-component-factory-architecture.ts
EOF
)"
          actual="$(git diff --name-only | sort)"
          printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

          pnpm docs:api:check
          pnpm component-docs:check
          pnpm check:tokens-semantic:strict

      - name: Commit exact generated outputs
        shell: bash
        run: |
          git config user.name "Roman Bakurov"
          git config user.email "160579419+romanbakurov@users.noreply.github.com"
          git add             apps/docs/src/react-native/toast.md             apps/docs/src/react/toast.md             packages/metadata/src/components/Toast.metadata.ts             packages/react-native/API.md             packages/react/API.md             packages/tokens/src/generated-component-factory-architecture.ts
          git commit -m "fix(toast): sync canonical generated ownership"
          git push origin HEAD:codex/issue-564-toast-production
