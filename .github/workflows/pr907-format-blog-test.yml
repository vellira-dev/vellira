name: PR 907 Format Blog Test

on:
  push:
    branches:
      - feat/website-cloudflare-staging
    paths:
      - '.github/workflows/pr907-format-blog-test.yml'

permissions:
  contents: write

jobs:
  format:
    name: Format blog metrics tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/website-cloudflare-staging

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format and self-remove
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier scripts/blog/blog-experience.test.tsx --write
          git rm .github/workflows/pr907-format-blog-test.yml
          git add scripts/blog/blog-experience.test.tsx
          git diff --cached --check

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(blog): format metrics proxy tests'
          git push origin HEAD:feat/website-cloudflare-staging
