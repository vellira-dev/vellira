name: One-shot Checkbox atomic docs safety proof
on:
  push:
    branches:
      - feat/docs-checkbox-safe-adoption-20261014
permissions:
  contents: write
jobs:
  atomic-proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Canonical Prettier formatting
        run: pnpm exec prettier scripts/generators/component-docs/adopt-legacy-docs.ts scripts/generators/component-docs/adopt-legacy-docs.test.ts --write
      - name: Targeted atomic rollback and metadata safety proof
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component-docs/adopt-legacy-docs.test.ts
      - name: Verify complete generator suite
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component-docs
      - name: Verify outputs unchanged and formatting clean
        run: |
          pnpm component-docs:generate Checkbox --check
          pnpm component-docs:adoption-audit Checkbox --json
          pnpm format:check
      - name: Remove temporary job and commit bounded changes
        shell: bash
        run: |
          rm .github/workflows/checkbox-docs-atomic-proof-once.yml
          while IFS= read -r file; do
            case "$file" in
              scripts/generators/component-docs/adopt-legacy-docs.ts|scripts/generators/component-docs/adopt-legacy-docs.test.ts|.github/workflows/checkbox-docs-atomic-proof-once.yml) ;;
              *) echo "::error::Unexpected changed file: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m "test(docs): canonicalize atomic adoption proof"
          git push origin HEAD:feat/docs-checkbox-safe-adoption-20261014
