name: Materialize public token API formatting

on:
  push:
    branches: [refactor/public-token-api-deprecation-v1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/public-token-api-deprecation-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Materialize canonical Prettier output
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier packages/tokens/README.md packages/tokens/src/platform-output/component-token-web-compatibility.ts --write
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-public-token-api-format.yml
          git add packages/tokens/README.md packages/tokens/src/platform-output/component-token-web-compatibility.ts
          git commit -m 'style(tokens): format public API policy'
          git push origin HEAD:refactor/public-token-api-deprecation-v1
