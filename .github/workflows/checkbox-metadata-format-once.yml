name: One-time Checkbox Metadata Format

on:
  push:
    branches:
      - feat/checkbox-discovery-reference-fixture
    paths:
      - .github/workflows/checkbox-metadata-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/checkbox-discovery-reference-fixture
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Checkbox metadata
        run: pnpm exec prettier apps/website/src/component-catalog/components/Checkbox/metadata.ts --write
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          git rm .github/workflows/checkbox-metadata-format-once.yml
          git config user.name "vellira-fixture-reconcile[bot]"
          git config user.email "vellira-fixture-reconcile[bot]@users.noreply.github.com"
          git add apps/website/src/component-catalog/components/Checkbox/metadata.ts
          git commit -m "style(generator): format Checkbox metadata"
          git push origin HEAD:feat/checkbox-discovery-reference-fixture
