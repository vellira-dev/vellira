name: One-time R2 S3 transport check

on:
  push:
    branches:
      - chore/cloudflare-staging-pr-automation
    paths:
      - '.github/workflows/one-time-r2-s3-transport-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify direct R2 S3 predecessor archive path
        run: node apps/website/scripts/cloudflare-archive-preflight.mjs wrangler.jsonc
        env:
          WEBSITE_URL: https://vellira-website-staging.vellira.workers.dev
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
