name: Native Expo 58 Upgrade Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/native-expo-58-upgrade-preflight.yml'
      - 'examples/workspace-starter/native/package.json'
      - 'examples/workspace-starter/native/package-lock.json'
      - 'examples/workspace-starter/native/scripts/security-expo-58-guard.cjs'
      - 'examples/workspace-starter/native/scripts/security-certificate-proof.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/workspace-starter/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          registry-url: https://registry.npmjs.org
      - name: Install exact published npm graph without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirm published CLI integrity, absence of Zod, and source fingerprint
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const lock = require('./package-lock.json');
          const p = lock.packages;
          assert.equal(p['node_modules/expo']?.version, '58.0.23');
          assert.equal(p['node_modules/expo/node_modules/@expo/cli']?.version, '58.1.19');
          assert.equal(p['node_modules/@expo/metro-config']?.version, '58.0.21');
          assert.equal(p['node_modules/react-native']?.version, '0.88.1');
          assert.equal(p['node_modules/node-forge']?.version, '1.4.2');
          assert.equal(p['node_modules/@expo/schema-utils']?.version, '58.0.3');
          assert.ok(!Object.keys(p).some((k) => /(^|\/)node_modules\/zod$/.test(k)),
            'Vulnerable Zod survives in the exact installed dependency graph');
          assert.equal(p['node_modules/expo/node_modules/@expo/cli'].integrity,
            'sha512-zoLhSlFnln0xn1fiW0+kb1J0lNv06HAy+FQ27HHwEEWoAClCE13FnTQBOW5bOVYc3c7hsGM8ypKcZGS7RGqjQA==');
          const cli = require('./node_modules/expo/node_modules/@expo/cli/package.json');
          assert.equal(cli.dependencies.zod, undefined);
          assert.ok(cli.dependencies['@expo/schema-utils']);
          NODE
          published="$(npm view @expo/cli@58.1.19 dist.integrity --registry=https://registry.npmjs.org)"
          test "$published" = 'sha512-zoLhSlFnln0xn1fiW0+kb1J0lNv06HAy+FQ27HHwEEWoAClCE13FnTQBOW5bOVYc3c7hsGM8ypKcZGS7RGqjQA=='
          node scripts/security-expo-58-guard.cjs --report-source-hash | tee "$RUNNER_TEMP/expo58-cli-source.json"
      - name: Verify clean standard npm install and bounded schema-output guard
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run security:verify-patch
          node scripts/security-asn1-adversarial.cjs --require-rejection
          npm run security:certificate-proof
          node scripts/security-expo-certificate-contract.cjs
          node scripts/security-expo-58-guard.cjs --apply
          node scripts/security-expo-58-guard.cjs --verify
          node scripts/security-expo-58-executor-proof.cjs
          npx --no-install expo install --check
          npm run typecheck
          echo "Using audited pinned Expo Doctor version: 1.21.5"
          npx --yes expo-doctor@1.21.5
          echo 'Exact Expo 58 / CLI 58.1.19 / RN 0.88.1 / published Forge 1.4.2 validated; Zod absent.' >> "$GITHUB_STEP_SUMMARY"
      - name: Reject tampering of the installed bounded collector
        shell: bash
        run: |
          set -euo pipefail
          target=node_modules/expo/node_modules/@expo/cli/build/src/start/server/devtools/DevToolsPluginCliExtensionResults.js
          cp "$target" "$RUNNER_TEMP/expo58-good.js"
          printf '\n// tampered parser\n' >> "$target"
          if node scripts/security-expo-58-guard.cjs --verify; then
            echo '::error::Tampered Expo CLI passed guard verification'
            exit 1
          fi
          cp "$RUNNER_TEMP/expo58-good.js" "$target"
          npm run security:verify-patch
      - name: Retain exact package/source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/expo58-evidence"
          cp package.json package-lock.json "$RUNNER_TEMP/expo58-evidence/"
          if test -f "$RUNNER_TEMP/expo58-cli-source.json"; then
            cp "$RUNNER_TEMP/expo58-cli-source.json" "$RUNNER_TEMP/expo58-evidence/cli-source-sha.json"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: expo-58-migration-candidate
          path: ${{ runner.temp }}/expo58-evidence/
          retention-days: 7
