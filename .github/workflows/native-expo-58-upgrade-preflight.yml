name: Native Expo 58 Upgrade Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/native-expo-58-upgrade-preflight.yml'
      - 'examples/workspace-starter/native/scripts/security-expo-58-source-preflight.cjs'
      - 'examples/workspace-starter/native/scripts/security-expo-58-guard-prototype.cjs'
      - 'examples/workspace-starter/native/scripts/security-expo-58-guard.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          registry-url: https://registry.npmjs.org
      - name: Inspect published Expo 58 CLI dependencies before touching Starter
        shell: bash
        run: |
          set -euo pipefail
          npm view expo@58 version --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/expo58-versions.json"
          npm view @expo/cli@58.1.15 dependencies --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/cli58-deps.json"
          echo '=== Expo CLI 58.1.15 Zod requirement ==='
          node -e "const d=require(process.argv[1]); console.log(JSON.stringify({ zod: d.zod || null, cliVersion: '58.1.15' },null,2))" "$RUNNER_TEMP/cli58-deps.json"
      - name: Capture authentic published Expo CLI 58.1.17 source evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/expo-cli-package"
          npm view @expo/cli@58.1.17 dist.integrity --registry=https://registry.npmjs.org
          npm pack @expo/cli@58.1.17 --ignore-scripts --silent --registry=https://registry.npmjs.org --pack-destination "$RUNNER_TEMP/expo-cli-package"
          archive="$RUNNER_TEMP/expo-cli-package/expo-cli-58.1.17.tgz"
          test -s "$archive"
          sha256sum "$archive"
          parser=package/build/src/start/server/DevToolsPluginCliExtensionResults.js
          tar -xOzf "$archive" "$parser" > "$RUNNER_TEMP/expo-cli-parser.js"
          sha256sum "$RUNNER_TEMP/expo-cli-parser.js"
          echo 'EXPO_CLI_PARSER_BASE64_BEGIN'
          base64 -w0 "$RUNNER_TEMP/expo-cli-parser.js"
          echo
          echo 'EXPO_CLI_PARSER_BASE64_END'
      - name: Run isolated npm dependency resolution (do not change checked-in locks)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/expo58"
          cp -a examples/workspace-starter/native/. "$RUNNER_TEMP/expo58/"
          cd "$RUNNER_TEMP/expo58"
          npm pkg delete scripts.postinstall
          npm pkg delete scripts.prestart
          npm pkg delete scripts.preios
          npm pkg delete scripts.preandroid
          npm pkg delete scripts.preweb
          npm pkg delete scripts.pretypecheck
          npm pkg delete scripts.security:verify-patch
          # The SHA-pinned guard is validated for @expo/cli 58.1.15 only.
          # Keep the isolated Expo candidate compatible with the verified CLI guard;
          # current newer Expo releases require CLI >=58.1.17 and need separate SHA review.
          npm pkg set 'overrides.@expo/cli=58.1.15'
          npm install expo@58.0.19 react-native@0.88.0 --package-lock-only --ignore-scripts --no-audit --no-fund
          echo '=== Resolved Expo CLI / Zod / React Native ==='
          node - <<'NODE'
          const l=require('./package-lock.json');
          const matches=Object.entries(l.packages).filter(([k]) => /(^|\/)node_modules\/(zod|@expo\/cli|expo|react-native)$/.test(k));
          for(const [name,record] of matches) console.log(name,record.version);
          const zod=matches.filter(([k])=>k.endsWith('/zod'));
          console.log('ZOD_VERSIONS='+JSON.stringify(zod.map(([path,p])=>({path,version:p.version}))));
          NODE
          echo 'Preflight only: do not call this a security remediation until compatible dependency tree and consumer tests are proven.'
      - name: Build full SDK 58 migration candidate in isolated directory
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/expo58"
          # Preserve security integrity: do not apply the Expo CLI 57 SHA-pinned patch to SDK 58.
          npm install expo@58.0.19 react-native@0.88.0 --ignore-scripts --no-audit --no-fund
          npx --no-install expo install --fix --npm
          npm ci --ignore-scripts --no-audit --no-fund
          # SDK 58 removed the legacy newArchEnabled app config field.
          # Change only the isolated candidate, not the SDK 57 source.
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'app.json';
          const app = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (Object.prototype.hasOwnProperty.call(app.expo ?? {}, 'newArchEnabled')) {
            delete app.expo.newArchEnabled;
            fs.writeFileSync(file, JSON.stringify(app, null, 2) + '\n');
            console.log('Removed SDK 57 newArchEnabled from isolated Expo 58 candidate');
          }
          NODE
          npx --no-install expo install --check
          npm run typecheck
          npx --yes expo-doctor
          echo '=== Migrated package versions ==='
          npm ls expo react-native react-native-reanimated @expo/metro-runtime zod --all || true
      - name: Verify pinned Expo 58 CLI parser source structure
        run: node examples/workspace-starter/native/scripts/security-expo-58-source-preflight.cjs "$RUNNER_TEMP/expo58"
      - name: Exercise guarded Expo 58 output collector without patching disk
        run: node examples/workspace-starter/native/scripts/security-expo-58-guard-prototype.cjs "$RUNNER_TEMP/expo58"
      - name: Apply Expo 58 guard twice and verify the installed bytes
        shell: bash
        run: |
          set -euo pipefail
          script=examples/workspace-starter/native/scripts/security-expo-58-guard-prototype.cjs
          node "$script" "$RUNNER_TEMP/expo58" --apply
          node "$script" "$RUNNER_TEMP/expo58" --apply
          node "$script" "$RUNNER_TEMP/expo58" --verify
          target="$RUNNER_TEMP/expo58/node_modules/expo/node_modules/@expo/cli/build/src/start/server/DevToolsPluginCliExtensionResults.js"
          cp "$target" "$RUNNER_TEMP/expo58-known-good.js"
          printf '\n// tamper\n' >> "$target"
          if node "$script" "$RUNNER_TEMP/expo58" --verify; then
            echo '::error::Tampered Expo 58 parser passed verification'
            exit 1
          fi
          cp "$RUNNER_TEMP/expo58-known-good.js" "$target"
          node "$script" "$RUNNER_TEMP/expo58" --verify
      - name: Verify normal npm ci with Expo 58 and both security patches
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          cp examples/workspace-starter/native/scripts/security-expo-58-guard.cjs "$RUNNER_TEMP/expo58/scripts/security-expo-58-guard.cjs"
          cd "$RUNNER_TEMP/expo58"
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const rsa = 'node scripts/apply-node-forge-patch.cjs';
          const zod = 'node scripts/security-expo-58-guard.cjs';
          pkg.scripts.postinstall = rsa + ' && ' + zod + ' --apply';
          const verify = rsa + ' --verify && ' + zod + ' --verify';
          for (const name of ['prestart', 'preios', 'preandroid', 'preweb', 'pretypecheck', 'security:verify-patch'])
            pkg.scripts[name] = verify;
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run security:verify-patch
          npm run typecheck
          npx --no-install expo install --check
          npx --yes expo-doctor
      - name: Fingerprint Expo 58 CLI parser for safe Zod guard migration
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/expo58"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const cliRoot = path.join(process.cwd(), 'node_modules/expo/node_modules/@expo/cli');
          const pkg = require(path.join(cliRoot, 'package.json'));
          const file = path.join(cliRoot, 'build/src/start/server/DevToolsPluginCliExtensionResults.js');
          const source = fs.readFileSync(file);
          const result = {
            cli: pkg.version,
            zodRequirement: pkg.dependencies.zod,
            sourceLength: source.length,
            sha256: crypto.createHash('sha256').update(source).digest('hex'),
            sourceContainsZodOutputParse: source.includes('DevToolsPluginOutputSchema'),
          };
          console.log(JSON.stringify(result, null, 2));
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'expo58-cli-parser-evidence.json'),
            JSON.stringify(result, null, 2) + '\n');
          NODE
      - name: Export reviewable candidate manifests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/expo58-evidence"
          if test -f "$RUNNER_TEMP/expo58/package.json"; then
            cp "$RUNNER_TEMP/expo58/package.json" "$RUNNER_TEMP/expo58-evidence/package.json"
          fi
          if test -f "$RUNNER_TEMP/expo58-cli-parser-evidence.json"; then
            cp "$RUNNER_TEMP/expo58-cli-parser-evidence.json" "$RUNNER_TEMP/expo58-evidence/cli-parser-evidence.json"
          fi
          if test -f "$RUNNER_TEMP/expo58/app.json"; then
            cp "$RUNNER_TEMP/expo58/app.json" "$RUNNER_TEMP/expo58-evidence/app.json"
          fi
          if test -f "$RUNNER_TEMP/expo58/package-lock.json"; then
            cp "$RUNNER_TEMP/expo58/package-lock.json" "$RUNNER_TEMP/expo58-evidence/package-lock.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: expo-58-migration-candidate
          path: ${{ runner.temp }}/expo58-evidence/
          retention-days: 7
