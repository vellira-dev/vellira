name: Native Metro Matrix Diagnostic

on:
  workflow_dispatch:
    inputs:
      native_version:
        description: 'Exact published @vellira-ui/react-native version'
        required: true
        type: string

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
      - name: Validate exact requested native version
        env:
          NATIVE_VERSION: ${{ inputs.native_version }}
        run: |
          if ! [[ "$NATIVE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected exact published semver" >&2
            exit 1
          fi
      - name: Run native Metro diagnostic
        env:
          VELLIRA_NATIVE_VERSION: ${{ inputs.native_version }}
        run: node scripts/performance/native-metro-matrix.cjs
      - name: Retain matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-metro-matrix-evidence
          path: consumer-evidence/native-metro-matrix.json
          if-no-files-found: warn
          retention-days: 14
