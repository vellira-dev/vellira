name: Probe Chromatic Playwright apt source

on:
  push:
    branches:
      - probe/chromatic-playwright-apt-source

permissions:
  contents: read

jobs:
  playwright-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable unrelated Google Chrome apt source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t chrome_sources < <(
            grep -RIl 'dl.google.com/linux/chrome-stable/deb' /etc/apt/sources.list.d 2>/dev/null || true
          )

          if (( ${#chrome_sources[@]} == 0 )); then
            echo 'No Google Chrome apt source found; nothing to disable.'
            exit 0
          fi

          printf 'Disabling unrelated apt source(s):\n'
          printf '  %s\n' "${chrome_sources[@]}"
          for source in "${chrome_sources[@]}"; do
            sudo mv "$source" "$source.disabled"
          done

      - name: Install Playwright browsers
        run: pnpm ci:playwright
