name: Prettier Security Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/ci/dependabot-security-remediation-policy.test.ts'
      - '.github/workflows/prettier-security-diagnostic.yml'

permissions:
  contents: read

jobs:
  prettier-security-diagnostic:
    name: Show exact security policy Prettier diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - name: Format and show exact diff
        run: |
          pnpm exec prettier scripts/ci/dependabot-security-remediation-policy.test.ts --write
          git diff -- scripts/ci/dependabot-security-remediation-policy.test.ts
          git diff --exit-code -- scripts/ci/dependabot-security-remediation-policy.test.ts
