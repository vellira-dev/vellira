name: Numeric Source Git Pin Formatter Diagnostic
on:
  push:
    branches:
      - feat/numeric-source-git-pin-v1
permissions:
  contents: read
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Show canonical formatting without modifying repository
        run: |
          npx --yes prettier@3.9.8 --write scripts/component-program/numeric-source-git-pin.ts scripts/component-program/numeric-source-git-pin.test.ts docs/architecture/NUMERIC_GOVERNED_SOURCE_GIT_PIN_V1.md
          git diff -- scripts/component-program/numeric-source-git-pin.ts scripts/component-program/numeric-source-git-pin.test.ts docs/architecture/NUMERIC_GOVERNED_SOURCE_GIT_PIN_V1.md
