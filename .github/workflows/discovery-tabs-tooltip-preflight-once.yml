name: One-shot Discovery preflight
on:
  push:
    branches:
      - feat/discovery-tabs-tooltip-preflight-20261014
permissions:
  contents: write
jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canonical generator and formatting
        run: |
          pnpm create:component-page Tabs --force
          pnpm create:component-page Tooltip --force
          pnpm exec prettier apps/website/src/component-catalog/components/Tabs/metadata.ts apps/website/src/component-catalog/components/Tooltip/metadata.ts apps/website/src/component-catalog/registry/componentPages.ts apps/website/src/component-catalog/registry/componentPresentation.ts scripts/seo/component-discovery-contract.ts scripts/seo/component-discovery-contract.test.ts --write
          pnpm format:check
          pnpm component-pages:check
          pnpm check:component-discovery
      - name: Validate bounded scope and self-remove
        run: |
          rm .github/workflows/discovery-tabs-tooltip-preflight-once.yml
          changed="$(git diff --name-only | grep -v -E '^(apps/website/src/component-catalog/components/(Tabs|Tooltip)/metadata\.ts|apps/website/src/component-catalog/registry/(componentPages|componentPresentation)\.ts|scripts/seo/component-discovery-contract(\.test)?\.ts)$' | grep -v -F -x '.github/workflows/discovery-tabs-tooltip-preflight-once.yml' || true)"
          if [ -n "$changed" ]; then
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m "chore(discovery): canonical generator and preflight"
          git push origin HEAD:feat/discovery-tabs-tooltip-preflight-20261014
