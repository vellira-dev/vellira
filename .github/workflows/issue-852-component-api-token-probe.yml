name: Issue 852 ComponentApi token adoption probe

on:
  push:
    branches:
      - probe/852-component-api-tokens

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: probe/852-component-api-tokens
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture stacked baseline audit
        run: pnpm check:vellira-ui-usage:json > /tmp/audit-before.json

      - name: Migrate ComponentApi legacy token aliases
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/website/src/component-catalog/shared/ComponentApi/ComponentApi.module.css';
          let source = fs.readFileSync(path, 'utf8');

          function replaceExact(before, after, expected) {
            const count = source.split(before).length - 1;
            if (count !== expected) {
              throw new Error(`${before} expected ${expected} occurrences, got ${count}`);
            }
            source = source.split(before).join(after);
          }

          replaceExact('var(--text-tertiary)', 'var(--text-muted)', 7);
          replaceExact('var(--color-danger-600)', 'var(--color-error-600)', 1);
          replaceExact('var(--color-danger-500)', 'var(--color-error-500)', 1);

          fs.writeFileSync(path, source);
          NODE

      - name: Format migrated CSS
        run: pnpm exec prettier apps/website/src/component-catalog/shared/ComponentApi/ComponentApi.module.css --write

      - name: Verify exact audit delta
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:vellira-ui-usage:json > /tmp/audit-after.json
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('/tmp/audit-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('/tmp/audit-after.json', 'utf8'));
          const target = 'apps/website/src/component-catalog/shared/ComponentApi/ComponentApi.module.css';
          const beforeFindings = before.findings.filter((finding) => finding.path === target);
          const afterFindings = after.findings.filter((finding) => finding.path === target);

          if (before.summary.findings !== 127 || after.summary.findings !== 118) {
            throw new Error(`expected global 127 -> 118, got ${before.summary.findings} -> ${after.summary.findings}`);
          }
          if (beforeFindings.length !== 9 || afterFindings.length !== 0) {
            throw new Error(`expected ComponentApi 9 -> 0, got ${beforeFindings.length} -> ${afterFindings.length}`);
          }

          console.log('ComponentApi findings: 9 -> 0');
          console.log('Global findings: 127 -> 118');
          NODE

      - name: Validate website
        run: |
          pnpm website:typecheck
          pnpm build
          pnpm website:build

      - name: Check diff
        run: git diff --check

      - name: Commit validated production tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-852-component-api-token-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/website/src/component-catalog/shared/ComponentApi/ComponentApi.module.css \
            .github/workflows/issue-852-component-api-token-probe.yml
          git commit -m 'refactor(website): migrate ComponentApi to canonical tokens'
          git push origin HEAD:probe/852-component-api-tokens
