name: One-shot Discovery registry regeneration
on:
  push:
    branches:
      - feat/discovery-radio-radio-group-main-sync-20261014
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate two stale registry projections
        run: |
          pnpm create:component-page Checkbox --force
          pnpm create:component-page Textarea --force
          pnpm exec prettier apps/website/src/component-catalog/registry/componentPages.ts --write
          pnpm create:component-page Checkbox --force --check --json
          pnpm create:component-page Textarea --force --check --json
      - name: Enforce registry-only change and self-remove
        run: |
          rm .github/workflows/discovery-registry-regenerate-once.yml
          changed="$(git diff --name-only | grep -v -E '^(apps/website/src/component-catalog/registry/componentPages.ts|.github/workflows/discovery-registry-regenerate-once.yml)$' || true)"
          if [ -n "$changed" ]; then
            echo "Unexpected generated file modifications:"
            echo "$changed"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/website/src/component-catalog/registry/componentPages.ts .github/workflows/discovery-registry-regenerate-once.yml
          git diff --cached --quiet || git commit -m "fix(discovery): sync Checkbox and Textarea registry projections"
          git push origin HEAD:feat/discovery-radio-radio-group-main-sync-20261014
