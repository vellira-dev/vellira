name: Temporary Discovery Prettier Diagnostic

on:
  pull_request:
    paths:
      - 'scripts/generators/component/discovery-content.ts'
      - '.github/workflows/tmp-discovery-prettier-diagnostic.yml'

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          node -p "require('prettier/package.json').version"
          pnpm exec prettier scripts/generators/component/discovery-content.ts --write
          git --no-pager diff -- scripts/generators/component/discovery-content.ts
          exit 1
