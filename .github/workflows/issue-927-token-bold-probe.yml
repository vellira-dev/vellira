name: Issue 927 token bold probe

on:
  push:
    branches:
      - probe/token-bold-927

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: probe/token-bold-927
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Apply exact source changes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after) {
            const input = fs.readFileSync(path, 'utf8');
            const first = input.indexOf(before);
            const last = input.lastIndexOf(before);
            if (first === -1 || first !== last) {
              throw new Error(`${path}: expected exactly one patch anchor`);
            }
            fs.writeFileSync(path, input.slice(0, first) + after + input.slice(first + before.length));
          }

          replaceOnce(
            'packages/tokens/src/tokens/typography.ts',
            "  semibold: '600',\n} as const;",
            "  semibold: '600',\n  bold: '700',\n} as const;"
          );

          replaceOnce(
            'packages/tokens/src/preservation/token-migrations.ts',
            "export const tokenMigrationManifestV1 = [\n  ...stateVocabularyRenameMigrationsV1,",
            "const boldFontWeightAdditionV1 = {\n  id: '927-font-weight-bold-addition',\n  kind: 'addition',\n  issue: '#927',\n  reason:\n    'Add the canonical 700 bold weight already represented by the VelliraSans-Bold family so first-party consumers do not need a raw value or local token alias.',\n  to: 'tokens.typography.weight.bold',\n} as const satisfies TokenMigrationEntry;\n\nexport const tokenMigrationManifestV1 = [\n  ...stateVocabularyRenameMigrationsV1,\n  boldFontWeightAdditionV1,"
          );
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate canonical token artifacts
        run: pnpm --filter @vellira-ui/tokens run build:tokens

      - name: Format touched sources
        run: pnpm exec prettier packages/tokens/src/tokens/typography.ts packages/tokens/src/preservation/token-migrations.ts packages/tokens/src/generated/token-types.ts packages/tokens/src/generated/tokens.css --write

      - name: Verify canonical CSS and generated type authority
        shell: bash
        run: |
          set -euo pipefail
          grep -F -- '--font-weight-bold: 700;' packages/tokens/src/generated/tokens.css
          grep -F -- 'tokens.typography.weight.bold' packages/tokens/src/generated/token-types.ts
          grep -F -- '--font-weight-bold' packages/tokens/src/generated/token-types.ts

      - name: Validate token package
        run: |
          pnpm --filter @vellira-ui/tokens run preservation:check
          pnpm --filter @vellira-ui/tokens run typecheck
          pnpm --filter @vellira-ui/tokens run test

      - name: Verify SocialProof audit impact
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:vellira-ui-usage:json > /tmp/vellira-ui-usage.json
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/vellira-ui-usage.json', 'utf8'));
          const target = 'apps/website/src/sections/home/SocialProof/SocialProof.module.css';
          const findings = report.findings.filter((finding) => finding.path === target);
          const bold = findings.filter((finding) => String(finding.detected).includes('--font-weight-bold'));
          if (bold.length !== 0) {
            throw new Error(`expected 0 SocialProof bold-token findings, got ${bold.length}`);
          }
          if (findings.length !== 11) {
            throw new Error(`expected SocialProof findings 13 -> 11 after canonical bold resource, got ${findings.length}`);
          }
          console.log(`SocialProof findings after #927 authority change: ${findings.length}`);
          console.log(`Global findings after #927 authority change: ${report.summary.findings}`);
          NODE

      - name: Check source diff
        run: git diff --check

      - name: Remove probe workflow and commit validated tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-927-token-bold-probe.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/tokens/src/tokens/typography.ts \
            packages/tokens/src/preservation/token-migrations.ts \
            packages/tokens/src/generated/token-types.ts \
            packages/tokens/src/generated/tokens.css \
            .github/workflows/issue-927-token-bold-probe.yml
          git commit -m 'feat(tokens): add canonical bold font weight'
          git push origin HEAD:probe/token-bold-927
