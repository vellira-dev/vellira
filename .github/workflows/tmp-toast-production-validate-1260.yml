name: Temporary Toast production validation 1260

on:
  push:
    branches:
      - tmp/toast-production-validate-1260

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - run: pnpm install --frozen-lockfile

      - name: Run canonical Toast validation
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm component-production:validate:json             --spec scripts/component-production/specs/Toast.json             > artifacts/validation.json             2> artifacts/validation.stderr
          status=$?
          set -e
          echo "$status" > artifacts/exit-status.txt
          cat artifacts/validation.json || true
          cat artifacts/validation.stderr >&2 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: toast-production-validation-1260
          path: artifacts
          if-no-files-found: error
