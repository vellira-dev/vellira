name: Temporary package root exports flake proof

on:
  push:
    branches:
      - tmp/package-root-exports-flake-proof

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - name: Run flaky candidate repeatedly
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "attempt=$i"
            pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component/package-root-exports.test.ts
          done
