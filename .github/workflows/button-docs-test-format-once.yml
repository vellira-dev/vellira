name: One-shot Button docs regression formatting
on:
  push:
    branches:
      - feat/docs-button-safe-adoption-20261015
permissions:
  contents: write
jobs:
  regression-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout Button PR
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Format new Button docs regression test
        run: pnpm exec prettier scripts/generators/component-docs/button-published-docs.test.ts --write
      - name: Prove Button pages and all component-docs tests
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component-docs
      - name: Verify deterministic docs and formatting
        run: |
          pnpm component-docs:generate Button --check
          pnpm format:check
      - name: Delete one-shot workflow and push bounded changes
        shell: bash
        run: |
          rm .github/workflows/button-docs-test-format-once.yml
          while IFS= read -r file; do
            case "$file" in
              scripts/generators/component-docs/button-published-docs.test.ts|.github/workflows/button-docs-test-format-once.yml) ;;
              *) echo "::error::Unexpected modified file $file"; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m "test(docs): canonically format Button migration regression assertions"
          git push origin HEAD:feat/docs-button-safe-adoption-20261015
