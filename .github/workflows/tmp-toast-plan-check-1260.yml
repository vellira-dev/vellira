name: Temporary Toast plan contract check 1260

on:
  push:
    branches:
      - tmp/toast-plan-check-1260

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - name: Check generated plan contract
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {
            parseComponentProductionInput,
            createComponentProductionGeneratorOptions,
          } from './scripts/component-production/contracts.ts';
          import { createComponentGenerationPlan } from './scripts/generators/component/plan.ts';
          import { checkGeneratedPlanContract } from './scripts/generators/component/plan-contract.ts';

          const input = parseComponentProductionInput(
            JSON.parse(
              fs.readFileSync(
                'scripts/component-production/specs/Toast.json',
                'utf8'
              )
            )
          );
          const plan = createComponentGenerationPlan({
            root: process.cwd(),
            options: createComponentProductionGeneratorOptions(input),
          });
          const drifted = await checkGeneratedPlanContract(plan);
          console.log(
            JSON.stringify(
              {
                driftedFiles: drifted
                  .map((file) => path.relative(process.cwd(), file).split(path.sep).join('/'))
                  .sort(),
              },
              null,
              2
            )
          );
          NODE
