name: Release Sync Admission

# One always-present, lightweight required check on every pull request.
# Release/Starter sync PRs wait for the exact-head security suites; all
# other PRs exit quickly and retain ordinary branch protection.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: release-sync-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admission:
    name: Release Sync Admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
      - name: Check exact-head release and Starter sync admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release-sync-admission.mjs
