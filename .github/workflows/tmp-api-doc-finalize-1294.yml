name: Temporary API docs finalize 1294

on:
  push:
    branches:
      - tmp/api-doc-finalize-1294

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - run: pnpm install --frozen-lockfile

      - name: Format tooling files
        run: pnpm exec prettier --write scripts/generate-api-docs.ts scripts/generate-api-docs.silent.test.ts

      - name: Focused tests
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generate-api-docs.silent.test.ts

      - name: Generate canonical API docs
        run: pnpm docs:api

      - name: Check dependent component docs
        shell: bash
        run: |
          set +e
          pnpm component-docs:check
          echo $? > /tmp/component-docs-status
          set -e

      - name: Capture outputs
        shell: bash
        run: |
          mkdir -p .artifacts/finalize/scripts
          mkdir -p .artifacts/finalize/packages/react
          mkdir -p .artifacts/finalize/packages/react-native
          cp scripts/generate-api-docs.ts .artifacts/finalize/scripts/
          cp scripts/generate-api-docs.silent.test.ts .artifacts/finalize/scripts/
          cp packages/react/API.md .artifacts/finalize/packages/react/
          cp packages/react-native/API.md .artifacts/finalize/packages/react-native/
          cp /tmp/component-docs-status .artifacts/finalize/component-docs-status.txt
          git diff --binary > .artifacts/finalize/generated.patch
          git status --short > .artifacts/finalize/status.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: api-doc-finalize-1294
          path: .artifacts/finalize
          if-no-files-found: error
