# Temporary branch-only dependency lock synchronization. Automatically deletes itself
# from the successful commit. Never run on main. No deployment or secrets.
name: Temporary Next 16.4.2 + Storybook lock sync
on:
  push:
    branches:
      - security/next-16-4-2-20261023

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'vellira-dev/vellira' && github.ref == 'refs/heads/security/next-16-4-2-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout exact isolated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Configure approved package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Configure Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org

      - name: Resolve lockfile with unmodified security policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const site = require('./apps/website/package.json');
          const native = require('./apps/native-storybook/package.json');
          const workspace = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          if (site.dependencies.next !== '16.4.2') throw Error('Unexpected Next version');
          if (native.dependencies['@storybook/react-native'] !== '^10.7.0') throw Error('Storyboard merge missing');
          if (!workspace.includes('next@16.4.2: patches/next@16.4.2.patch') ||
              workspace.includes('next@16.3.8') ||
              !workspace.includes('allowUnusedPatches: false')) throw Error('Patched dependency policy mismatch');
          if (!fs.existsSync('patches/next@16.4.2.patch') || fs.existsSync('patches/next@16.3.8.patch')) {
            throw Error('Missing or stale patch file');
          }
          NODE
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Verify installed Next and Storybook metadata and actual patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const resolveFrom = (workspace,name) =>
            require.resolve(name+'/package.json',{paths:[path.resolve(workspace)]});
          const nextPath = resolveFrom('apps/website','next');
          const nextPkg = JSON.parse(fs.readFileSync(nextPath,'utf8'));
          if (nextPkg.version !== '16.4.2') throw Error('Next installed version '+nextPkg.version);
          const root = path.dirname(nextPath);
          for(const relative of [
            'dist/client/components/router-reducer/fetch-server-response.js',
            'dist/esm/client/components/router-reducer/fetch-server-response.js'
          ]) {
            const text = fs.readFileSync(path.join(root,relative),'utf8');
            const count = (text.match(/const fetchOptions = \{\s*cache: 'no-store',/g)||[]).length;
            if(count!==1) throw Error(relative+' must include one forced no-store, found '+count);
          }
          const nativePkg = JSON.parse(fs.readFileSync(resolveFrom('apps/native-storybook','@storybook/react-native'),'utf8'));
          if(nativePkg.version !== '10.7.0') throw Error('Storybook installed version '+nativePkg.version);
          const worktreeFiles = require('node:child_process')
            .execFileSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8'})
            .split('\n').filter(Boolean).map(x=>x.slice(3));
          const allowed = new Set(['pnpm-lock.yaml']);
          for(const file of worktreeFiles){if(!allowed.has(file))throw Error('Unexpected generated file: '+file);}
          if(!worktreeFiles.includes('pnpm-lock.yaml'))throw Error('No updated pnpm lockfile');
          console.log('PASS: patched Next 16.4.2 CJS/ESM, Storybook 10.7.0, frozen lockfile, untouched policies');
          NODE

      - name: Retain exact lockfile evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: next-16-4-2-storybook-lock-evidence
          path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
            patches/next@16.4.2.patch
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary workflow and commit only reconciled lockfile
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-next-16-4-2-refresh-lock.yml
          git add pnpm-lock.yaml
          node <<'NODE'
          const cp=require('node:child_process');
          const files=cp.execFileSync('git',['diff','--cached','--no-renames','--name-only'],{encoding:'utf8'}).trim().split('\n');
          if(files.length!==2||files[0]!=='.github/workflows/temporary-next-16-4-2-refresh-lock.yml'||files[1]!=='pnpm-lock.yaml'){
            throw Error('Unexpected staged inventory: '+JSON.stringify(files));
          }
          NODE
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): synchronize Next 16.4.2 and Storybook lockfile"
          git push origin HEAD:refs/heads/security/next-16-4-2-20261023
