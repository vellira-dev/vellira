name: Component Diagnostics

run-name: Diagnostics — ${{ inputs.profile }} / ${{ inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Exact 40-character lowercase commit SHA in this repository.'
        required: true
        type: string
      profile:
        description: 'Repository-owned diagnostic suite; arbitrary commands are not accepted.'
        required: true
        type: choice
        default: component-production
        options:
          - component-production
          - component-quality
          - token-semantic
          - tooling

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose immutable component revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    env:
      DIAGNOSTIC_REVISION: ${{ inputs.revision }}
      DIAGNOSTIC_PROFILE: ${{ inputs.profile }}

    steps:
      - name: Validate immutable diagnostics inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DIAGNOSTIC_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::An exact lowercase commit SHA is required.'
            exit 2
          fi
          case "$DIAGNOSTIC_PROFILE" in
            component-production|component-quality|token-semantic|tooling) ;;
            *) echo '::error::Unsupported diagnostics profile.'; exit 2 ;;
          esac

      - name: Checkout diagnostic revision without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify and record diagnostic identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_REVISION"
          mkdir -p "$RUNNER_TEMP/vellira-diagnostics"
          printf 'revision=%s\nprofile=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$DIAGNOSTIC_REVISION" "$DIAGNOSTIC_PROFILE" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/vellira-diagnostics/identity.txt"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js without dependency cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tooling dist-fallback prerequisites
        run: >-
          pnpm exec turbo run build
          --filter=@vellira-ui/react
          --filter=@vellira-ui/react-native
          --filter=@vellira-ui/icons

      - name: Run selected repository diagnostics
        id: diagnostics
        shell: bash
        run: |
          set -euo pipefail
          run_diagnostics() {
            case "$DIAGNOSTIC_PROFILE" in
              component-production)
                pnpm exec vitest run --config vitest.tooling.config.ts scripts/component-production scripts/generators/component
                ;;
              component-quality) pnpm check:component-quality --all ;;
              token-semantic) pnpm check:tokens-semantic:strict ;;
              tooling) pnpm test:tooling ;;
              *) echo '::error::Unsupported diagnostics profile.'; return 2 ;;
            esac
          }
          run_diagnostics 2>&1 | tee "$RUNNER_TEMP/vellira-diagnostics/output.log"

      - name: Record diagnostic outcome
        if: always() && steps.identity.outcome == 'success'
        shell: bash
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          set -euo pipefail
          printf 'outcome=%s\n' "${DIAGNOSTIC_OUTCOME:-not-run}" \
            > "$RUNNER_TEMP/vellira-diagnostics/outcome.txt"
          printf '### Component diagnostics\n\nRevision: `%s`\n\nProfile: `%s`\n\nOutcome: **%s**\n' \
            "$DIAGNOSTIC_REVISION" "$DIAGNOSTIC_PROFILE" \
            "${DIAGNOSTIC_OUTCOME:-not-run}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic evidence
        if: always() && steps.identity.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: component-diagnostics-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vellira-diagnostics/
          if-no-files-found: error
          retention-days: 14
