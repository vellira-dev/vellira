name: Token semantic value probe

on:
  push:
    branches: [probe/token-semantic-value-890-20260910]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format candidate files and capture evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/semantic-probe
          files=(
            packages/tokens/src/platform-output/component-token-boundary.ts
            scripts/checks/token-semantic/README.md
            scripts/checks/token-semantic/checker.ts
            scripts/checks/token-semantic/platform-native-keys.test.ts
            scripts/checks/token-semantic/value-kind-repository.test.ts
            scripts/checks/token-semantic/value-kind-repository.ts
            scripts/checks/token-semantic/value-kind.test.ts
            scripts/checks/token-semantic/value-kind.ts
          )
          pnpm exec prettier "${files[@]}" --write
          pnpm exec prettier "${files[@]}" --check
          tar -czf .artifacts/semantic-probe/formatted-files.tgz "${files[@]}"
          tar -chzf .artifacts/semantic-probe/prettier.tgz node_modules/prettier
          git diff -- "${files[@]}" > .artifacts/semantic-probe/formatting.patch
          {
            git rev-parse HEAD
            node --version
            pnpm --version
            pnpm exec tsc --version
            pnpm exec prettier --version
          } > .artifacts/semantic-probe/environment.txt
      - name: Record semantic baseline
        shell: bash
        run: |
          set -euo pipefail
          pnpm --silent check:tokens-semantic:json > .artifacts/semantic-probe/report.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('.artifacts/semantic-probe/report.json','utf8')); console.log(JSON.stringify({summary:r.summary,coverage:r.coverage},null,2));"
      - name: Focused audit tests
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/checks/token-semantic
      - name: Build packages for authoritative tooling types
        run: pnpm build
      - name: Tooling typecheck
        run: pnpm typecheck:tooling
      - name: Token typecheck and preservation
        run: pnpm --filter @vellira-ui/tokens typecheck
      - name: Token unit tests
        run: pnpm test:tokens
      - name: Diff whitespace validation
        run: git diff --check
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-value-probe-evidence
          path: .artifacts/semantic-probe/
          if-no-files-found: error
          retention-days: 3
