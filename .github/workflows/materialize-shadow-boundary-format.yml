name: Sync shadow authority branch with main

on:
  push:
    branches: [refactor/unified-shadow-elevation-v1]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/unified-shadow-elevation-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Merge latest main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin main
          git merge --no-commit --no-ff origin/main
          git rm .github/workflows/materialize-shadow-boundary-format.yml

          pnpm exec prettier packages/tokens/src/effects/shadow-platform-boundary.test.ts --check
          git diff --check

          git commit -m 'chore(tokens): sync shadow authority branch with main'
          git push origin HEAD:refactor/unified-shadow-elevation-v1
