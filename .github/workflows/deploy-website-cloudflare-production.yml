name: Deploy Website Cloudflare Production Candidate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Select DEPLOY_CANDIDATE to deploy the isolated production Worker. This does not attach vellira.dev.'
        required: true
        type: choice
        default: DO_NOT_DEPLOY
        options:
          - DO_NOT_DEPLOY
          - DEPLOY_CANDIDATE

permissions:
  contents: read

concurrency:
  group: website-cloudflare-production
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.0
  PRODUCTION_WORKER_URL: https://vellira-website.vellira.workers.dev
  VELLIRA_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    name: Build and deploy isolated production candidate
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_CANDIDATE'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website dependencies
        run: pnpm exec turbo run build --filter='@vellira-ui/website^...'

      - name: Sync website brand
        run: pnpm --dir apps/website run sync:brand

      - name: Build production Worker candidate
        run: pnpm --dir apps/website exec opennextjs-cloudflare build --config=wrangler.production.jsonc

      - name: Verify OpenNext CSS asset closure
        run: node apps/website/scripts/cloudflare-build-asset-closure.mjs

      - name: Verify production config has no public custom domain
        shell: bash
        run: |
          set -euo pipefail
          if grep --fixed-strings --quiet 'vellira.dev' apps/website/wrangler.production.jsonc; then
            echo 'Production candidate config unexpectedly contains vellira.dev before cutover.' >&2
            exit 1
          fi

      - name: Test runtime asset auditing
        run: node --test apps/website/scripts/cloudflare-build-runtime-audit.test.mjs

      - name: Audit client manifests and Webpack runtime assets
        run: node apps/website/scripts/cloudflare-build-runtime-audit.mjs

      - name: Add unique deployment asset anchor
        run: printf '%s\n' "$VELLIRA_BUILD_ID" > apps/website/.open-next/assets/__vellira_deploy.txt

      - name: Deploy isolated production Worker candidate
        id: worker-deploy
        run: >-
          pnpm --dir apps/website exec opennextjs-cloudflare deploy
          --config=wrangler.production.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Audit assets after OpenNext deploy cache population
        run: >-
          node apps/website/scripts/cloudflare-build-runtime-audit.mjs
          apps/website apps/website/.open-next/asset-audit-after-deploy.json

      - name: Smoke test production Worker candidate
        shell: bash
        run: |
          set -euo pipefail
          sleep 15

          check_route() {
            local path="$1"
            shift
            local body
            local status
            local expected
            local matches
            body="$(mktemp)"

            for attempt in 1 2 3 4 5; do
              status="$(curl --location --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --output "$body" --write-out '%{http_code}' \
                "$PRODUCTION_WORKER_URL$path" || true)"

              matches=true
              if [[ "$status" == "200" ]]; then
                for expected in "$@"; do
                  if ! grep --fixed-strings --quiet "$expected" "$body"; then
                    matches=false
                    break
                  fi
                done
              else
                matches=false
              fi

              if [[ "$matches" == "true" ]]; then
                echo "OK $path"
                rm -f "$body"
                return 0
              fi

              echo "Attempt $attempt failed for $path: HTTP $status"
              sleep 2
            done

            echo "Production candidate smoke failed for $path" >&2
            sed -n '1,40p' "$body" >&2
            rm -f "$body"
            return 1
          }

          check_route '/' 'Vellira'
          check_route '/components/switch' 'Switch component for Vellira applications.'
          check_route '/blog' 'Practical engineering notes on design systems'
          check_route '/blog/two-runtimes' 'One Design System, Two Runtimes' 'data-language="ts"'
          check_route '/blog/rss.xml' '<rss version="2.0"'
          check_route '/sitemap.xml' '<urlset'
          check_route '/robots.txt' 'User-Agent: *'

      - name: Install Chromium for browser smoke
        run: pnpm --filter @vellira-ui/react-storybook exec playwright install chromium

      - name: Test browser forensic diagnostics
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node --test
          scripts/cloudflare-browser-diagnostics.test.mjs

      - name: Smoke test production navigation and actor metrics
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node
          scripts/cloudflare-website-smoke.mjs
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_WORKER_URL }}

      - name: Soak test production client navigation static assets
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node
          scripts/cloudflare-navigation-soak.mjs
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_WORKER_URL }}

      - name: Smoke test production static chunk integrity
        if: ${{ !cancelled() && steps.worker-deploy.outcome == 'success' }}
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node
          scripts/cloudflare-static-chunk-smoke.mjs
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_WORKER_URL }}

      - name: Retain asset and browser forensic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          path: |
            apps/react-storybook/test-results/cloudflare-soak/
            apps/website/.open-next/asset-audit*.json
            apps/website/.open-next/cache/
            apps/website/.next/*manifest.json
            apps/website/.next/BUILD_ID
            apps/website/.next/server/**/*manifest*
            apps/website/.next/static/chunks/webpack-*.js
