name: Deploy Website Cloudflare Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Select DEPLOY_PRODUCTION to deploy the public production Worker.'
        required: true
        type: choice
        default: DO_NOT_DEPLOY
        options:
          - DO_NOT_DEPLOY
          - DEPLOY_PRODUCTION

permissions:
  contents: read

concurrency:
  group: deploy-worker-vellira-website
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.0
  PRODUCTION_WORKER_URL: https://vellira-website.vellira.workers.dev
  PRODUCTION_PUBLIC_URL: https://vellira.dev
  PRODUCTION_WWW_URL: https://www.vellira.dev
  VELLIRA_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    name: Build, deploy, and verify production website
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_PRODUCTION'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify R2 access and active predecessor archive before building
        run: node apps/website/scripts/cloudflare-archive-preflight.mjs wrangler.production.jsonc
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_WORKER_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build website dependencies
        run: pnpm exec turbo run build --filter='@vellira-ui/website^...'

      - name: Sync website brand
        run: pnpm --dir apps/website run sync:brand

      - name: Build production Worker
        run: pnpm --dir apps/website exec opennextjs-cloudflare build --config=wrangler.production.jsonc

      - name: Verify OpenNext CSS asset closure
        run: node apps/website/scripts/cloudflare-build-asset-closure.mjs

      - name: Test runtime asset auditing
        run: node --test apps/website/scripts/cloudflare-build-runtime-audit.test.mjs

      - name: Audit client manifests and Webpack runtime assets
        run: node apps/website/scripts/cloudflare-build-runtime-audit.mjs

      - name: Verify cache, identity, and immutable archive contracts
        run: pnpm test:cloudflare-cache

      - name: Verify actual OpenNext runtime before remote archive or activation
        run: |
          pnpm --dir apps/website exec opennextjs-cloudflare populateCache local
          node apps/website/scripts/cloudflare-local-runtime.mjs

      - name: Install migration regression browsers
        run: pnpm --filter @vellira-ui/react-storybook exec playwright install --with-deps chromium firefox webkit

      - name: Prove same-origin multi-deployment browser migration before activation
        run: pnpm test:cloudflare-migration

      - name: Deploy production website to Cloudflare Workers
        id: worker-deploy
        run: >-
          node apps/website/scripts/cloudflare-deploy.mjs wrangler.production.jsonc
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_WORKER_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Audit assets after OpenNext deploy cache population
        run: >-
          node apps/website/scripts/cloudflare-build-runtime-audit.mjs
          apps/website apps/website/.open-next/asset-audit-after-deploy.json

      - name: Smoke test production routes
        shell: bash
        run: |
          set -euo pipefail
          sleep 15

          check_route() {
            local path="$1"
            shift
            local body
            local status
            local expected
            local matches
            body="$(mktemp)"

            for attempt in 1 2 3 4 5; do
              status="$(curl --location --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --output "$body" --write-out '%{http_code}' \
                "$PRODUCTION_WORKER_URL$path" || true)"

              matches=true
              if [[ "$status" == "200" ]]; then
                for expected in "$@"; do
                  if ! grep --fixed-strings --quiet "$expected" "$body"; then
                    matches=false
                    break
                  fi
                done
              else
                matches=false
              fi

              if [[ "$matches" == "true" ]]; then
                echo "OK $path"
                rm -f "$body"
                return 0
              fi

              echo "Attempt $attempt failed for $path: HTTP $status"
              sleep 2
            done

            echo "Production candidate smoke failed for $path" >&2
            sed -n '1,40p' "$body" >&2
            rm -f "$body"
            return 1
          }

          check_route '/' 'Vellira'
          check_route '/components/switch' 'Switch component for Vellira applications.'
          check_route '/blog' 'Practical engineering notes on design systems'
          check_route '/blog/two-runtimes' 'One Design System, Two Runtimes' 'data-language="ts"'
          check_route '/blog/rss.xml' '<rss version="2.0"'
          check_route '/sitemap.xml' '<urlset'
          check_route '/robots.txt' 'User-Agent: *'

      - name: Verify deployed identities, freshness and immutable bytes
        run: node apps/website/scripts/cloudflare-runtime-contract.mjs
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_WORKER_URL }}

      - name: Verify live production custom domains and runtime identity
        shell: bash
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_PUBLIC_URL }}
        run: |
          set -euo pipefail
          node apps/website/scripts/cloudflare-runtime-stabilization.mjs
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';

          const apex = process.env.PRODUCTION_PUBLIC_URL;
          const www = process.env.PRODUCTION_WWW_URL;
          const buildId = process.env.VELLIRA_BUILD_ID;
          assert.ok(apex && www && buildId);

          const path = '/blog/two-runtimes?source=cloudflare-postflight&n=1';
          const response = await fetch(`${www}${path}`, {
            cache: 'no-store',
            redirect: 'manual',
            headers: { 'Cache-Control': 'no-cache' },
            signal: AbortSignal.timeout(10_000),
          });

          assert.equal(response.status, 308, `www redirect HTTP ${response.status}`);
          assert.equal(
            response.headers.get('location'),
            `${apex}${path}`,
            'www redirect did not preserve path/query'
          );
          assert.equal(
            response.headers.get('x-vellira-build-id'),
            buildId,
            'www redirect did not execute on the active production build'
          );
          assert.ok(
            response.headers.get('x-vellira-worker-version'),
            'www redirect is missing Worker version identity'
          );
          console.log(`OK live production domains: apex=${apex}, www=308 -> ${apex}`);
          EOF

      - name: Install Chromium for browser smoke
        run: pnpm --filter @vellira-ui/react-storybook exec playwright install chromium

      - name: Test browser forensic diagnostics
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node --test
          scripts/cloudflare-browser-diagnostics.test.mjs

      - name: Smoke test production navigation and actor metrics
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node
          scripts/cloudflare-website-smoke.mjs
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_PUBLIC_URL }}

      - name: Soak test production client navigation static assets
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node
          scripts/cloudflare-navigation-soak.mjs
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_PUBLIC_URL }}

      - name: Smoke test production static chunk integrity
        if: ${{ !cancelled() && steps.worker-deploy.outcome == 'success' }}
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node
          scripts/cloudflare-static-chunk-smoke.mjs
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_PUBLIC_URL }}

      - name: Retain asset and browser forensic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          path: |
            apps/react-storybook/test-results/cloudflare-soak/
            apps/react-storybook/test-results/cloudflare-migration/*/evidence.json
            apps/react-storybook/test-results/cloudflare-migration/summary.json
            apps/react-storybook/test-results/cloudflare-migration/*.log
            apps/website/.open-next/asset-audit*.json
            apps/website/.open-next/archive-evidence.json
            apps/website/.open-next/vellira-build.json
            apps/website/.open-next/runtime-contract.json
            apps/website/.open-next/local-runtime-contract.json
            apps/website/.open-next/cache/
            apps/website/.next/*manifest.json
            apps/website/.next/BUILD_ID
            apps/website/.next/server/**/*manifest*
            apps/website/.next/static/chunks/webpack-*.js
