name: Deploy Website Cloudflare Production

run-name: ${{ github.event_name == 'workflow_run' && format('Promote staging {0}', github.event.workflow_run.head_sha) || format('Emergency production recovery {0}', inputs.candidate_sha) }}

on:
  workflow_run:
    workflows: ['Deploy Website Cloudflare Staging']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Break-glass only: exact 40-character commit SHA to deploy.'
        required: true
        type: string
      confirmation:
        description: 'Break-glass only: select EMERGENCY_DEPLOY_PRODUCTION to continue.'
        required: true
        type: choice
        default: DO_NOT_DEPLOY
        options:
          - DO_NOT_DEPLOY
          - EMERGENCY_DEPLOY_PRODUCTION

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: 22.22.2
  STAGING_URL: https://vellira-website-staging.vellira.workers.dev
  PRODUCTION_WORKER_URL: https://vellira-website.vellira.workers.dev
  PRODUCTION_PUBLIC_URL: https://vellira.dev
  PRODUCTION_WWW_URL: https://www.vellira.dev

jobs:
  candidate:
    name: Qualify immutable production candidate
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirmation == 'EMERGENCY_DEPLOY_PRODUCTION')
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.publish.outputs.candidate_sha }}
      source: ${{ steps.publish.outputs.source }}
      staging_run_id: ${{ steps.publish.outputs.staging_run_id }}
      staging_run_attempt: ${{ steps.publish.outputs.staging_run_attempt }}
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.candidate_sha }}

    steps:
      - name: Validate candidate selection
        shell: bash
        env:
          RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$RECOVERY_CONFIRMATION" = "EMERGENCY_DEPLOY_PRODUCTION"
            echo "Validated explicit break-glass recovery request for $CANDIDATE_SHA"
          else
            echo "Validating staged production candidate $CANDIDATE_SHA"
          fi

      - name: Checkout exact eligible candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          echo "Validated exact production candidate checkout: $actual"

      - name: Download staging promotion evidence
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cloudflare-staging-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: .promotion-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate staging promotion evidence
        if: github.event_name == 'workflow_run'
        run: >-
          node apps/website/scripts/cloudflare-staging-evidence.mjs
          .promotion-evidence/staging-evidence.json
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_REF: refs/heads/main
          EXPECTED_EVENT_NAME: push
          EXPECTED_STAGING_URL: ${{ env.STAGING_URL }}

      - name: Publish immutable candidate identity
        id: publish
        shell: bash
        env:
          STAGING_RUN_ID: ${{ github.event.workflow_run.id }}
          STAGING_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            echo "source=staging" >> "$GITHUB_OUTPUT"
            echo "staging_run_id=$STAGING_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "staging_run_attempt=$STAGING_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          else
            echo "source=emergency-recovery" >> "$GITHUB_OUTPUT"
            echo "staging_run_id=" >> "$GITHUB_OUTPUT"
            echo "staging_run_attempt=" >> "$GITHUB_OUTPUT"
          fi

  admission:
    name: Admit latest safe production candidate
    needs: candidate
    if: github.event_name == 'workflow_run' && needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    cache-mode: none
    concurrency:
      group: deploy-worker-vellira-website-admission
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    outputs:
      admitted: ${{ steps.admit.outputs.admitted }}
      reason: ${{ steps.admit.outputs.reason }}

    steps:
      - name: Checkout current main admission controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js without dependency cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Admit candidate and supersede stale promotions
        id: admit
        run: node apps/website/scripts/cloudflare-production-admission.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_PRODUCTION_RUN_ID: ${{ github.run_id }}
          EXPECTED_CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}

  deploy:
    name: Approve, deploy, and verify production candidate
    needs: [candidate, admission]
    if: >-
      always() &&
      needs.candidate.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.admission.result == 'success' &&
        needs.admission.outputs.admitted == 'true'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker-vellira-website
      cancel-in-progress: false
    environment:
      name: production
      url: https://vellira.dev
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
      CANDIDATE_SOURCE: ${{ needs.candidate.outputs.source }}
      STAGING_RUN_ID: ${{ needs.candidate.outputs.staging_run_id }}
      STAGING_RUN_ATTEMPT: ${{ needs.candidate.outputs.staging_run_attempt }}
      VELLIRA_BUILD_ID: ${{ needs.candidate.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact production candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "Approved immutable production candidate: $actual ($CANDIDATE_SOURCE)"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive protocol-defined R2 S3 secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          r2_secret_access_key="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | awk '{print $1}')"
          [[ "$r2_secret_access_key" =~ ^[0-9a-f]{64}$ ]]
          echo "::add-mask::$r2_secret_access_key"
          printf 'CLOUDFLARE_R2_SECRET_ACCESS_KEY=%s\n' "$r2_secret_access_key" >> "$GITHUB_ENV"

      - name: Verify R2 access and active predecessor archive before building
        run: node apps/website/scripts/cloudflare-archive-preflight.mjs wrangler.production.jsonc
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_WORKER_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build website dependencies
        run: pnpm exec turbo run build --filter='@vellira-ui/website^...'

      - name: Sync website brand
        run: pnpm --dir apps/website run sync:brand

      - name: Build production Worker
        run: pnpm --dir apps/website exec opennextjs-cloudflare build --config=wrangler.production.jsonc

      - name: Verify OpenNext CSS asset closure
        run: node apps/website/scripts/cloudflare-build-asset-closure.mjs

      - name: Test runtime asset auditing
        run: node --test apps/website/scripts/cloudflare-build-runtime-audit.test.mjs

      - name: Audit client manifests and Webpack runtime assets
        run: node apps/website/scripts/cloudflare-build-runtime-audit.mjs

      - name: Verify cache, identity, and immutable archive contracts
        run: pnpm test:cloudflare-cache

      - name: Verify actual OpenNext runtime before remote archive or activation
        run: |
          pnpm --dir apps/website exec opennextjs-cloudflare populateCache local
          node apps/website/scripts/cloudflare-local-runtime.mjs

      - name: Install migration regression browsers
        run: pnpm --filter @vellira-ui/react-storybook exec playwright install --with-deps chromium firefox webkit

      - name: Prove same-origin multi-deployment browser migration before activation
        run: pnpm test:cloudflare-migration

      - name: Verify immutable production candidate before mutation
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          test "$VELLIRA_BUILD_ID" = "$CANDIDATE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          if [[ "$CANDIDATE_SOURCE" == "staging" ]]; then
            current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
            test "$current_main" = "$CANDIDATE_SHA"
          fi

          echo "Production mutation remains pinned to $CANDIDATE_SHA"

      - name: Record production promotion provenance
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const source = process.env.CANDIDATE_SOURCE;
          const evidence = {
            schemaVersion: 1,
            candidateSha: process.env.CANDIDATE_SHA,
            source,
            stagingRunId:
              source === 'staging' ? Number(process.env.STAGING_RUN_ID) : null,
            stagingRunAttempt:
              source === 'staging' ? Number(process.env.STAGING_RUN_ATTEMPT) : null,
            productionRunId: Number(process.env.GITHUB_RUN_ID),
            productionRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            repository: process.env.GITHUB_REPOSITORY,
            environment: 'production',
          };

          await fs.mkdir('apps/website/.open-next', { recursive: true });
          await fs.writeFile(
            'apps/website/.open-next/production-promotion.json',
            `${JSON.stringify(evidence, null, 2)}\n`
          );
          console.log(JSON.stringify(evidence));
          NODE

      - name: Deploy production website to Cloudflare Workers
        id: worker-deploy
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CANDIDATE_SOURCE" == "staging" ]]; then
            current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
            test "$current_main" = "$CANDIDATE_SHA"
          fi

          node apps/website/scripts/cloudflare-deploy.mjs wrangler.production.jsonc
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_WORKER_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Audit assets after OpenNext deploy cache population
        run: >-
          node apps/website/scripts/cloudflare-build-runtime-audit.mjs
          apps/website apps/website/.open-next/asset-audit-after-deploy.json

      - name: Smoke test production routes
        shell: bash
        run: |
          set -euo pipefail
          sleep 15

          check_route() {
            local path="$1"
            shift
            local body
            local status
            local expected
            local matches
            body="$(mktemp)"

            for attempt in 1 2 3 4 5; do
              status="$(curl --location --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --output "$body" --write-out '%{http_code}' \
                "$PRODUCTION_WORKER_URL$path" || true)"

              matches=true
              if [[ "$status" == "200" ]]; then
                for expected in "$@"; do
                  if ! grep --fixed-strings --quiet "$expected" "$body"; then
                    matches=false
                    break
                  fi
                done
              else
                matches=false
              fi

              if [[ "$matches" == "true" ]]; then
                echo "OK $path"
                rm -f "$body"
                return 0
              fi

              echo "Attempt $attempt failed for $path: HTTP $status"
              sleep 2
            done

            echo "Production candidate smoke failed for $path" >&2
            sed -n '1,40p' "$body" >&2
            rm -f "$body"
            return 1
          }

          check_route '/' 'Vellira'
          check_route '/components/switch' 'Switch component for Vellira applications.'
          check_route '/blog' 'Practical engineering notes on design systems'
          check_route '/blog/two-runtimes' 'One Design System, Two Runtimes' 'data-language="ts"'
          check_route '/blog/rss.xml' '<rss version="2.0"'
          check_route '/sitemap.xml' '<urlset'
          check_route '/robots.txt' 'User-Agent: *'

      - name: Verify deployed identities, freshness and immutable bytes
        run: node apps/website/scripts/cloudflare-runtime-contract.mjs
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_WORKER_URL }}

      - name: Install Chromium for browser smoke
        run: pnpm --filter @vellira-ui/react-storybook exec playwright install chromium

      - name: Test browser forensic diagnostics
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node --test
          scripts/cloudflare-browser-diagnostics.test.mjs

      - name: Verify production component explorer browser geometry
        run: pnpm --filter @vellira-ui/website run test:component-explorer-geometry
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_PUBLIC_URL }}

      - name: Smoke test production navigation and actor metrics
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node
          scripts/cloudflare-website-smoke.mjs
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_PUBLIC_URL }}
          BLOG_METRICS_PUBLICATION_MODE: strict

      - name: Soak test production client navigation static assets
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node
          scripts/cloudflare-navigation-soak.mjs
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_PUBLIC_URL }}

      - name: Smoke test production static chunk integrity
        if: ${{ !cancelled() && steps.worker-deploy.outcome == 'success' }}
        run: >-
          pnpm --filter @vellira-ui/react-storybook exec node
          scripts/cloudflare-static-chunk-smoke.mjs
        env:
          WEBSITE_URL: ${{ env.PRODUCTION_PUBLIC_URL }}

      - name: Retain asset and browser forensic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          path: |
            apps/react-storybook/test-results/cloudflare-soak/
            apps/react-storybook/test-results/cloudflare-migration/*/evidence.json
            apps/react-storybook/test-results/cloudflare-migration/summary.json
            apps/react-storybook/test-results/cloudflare-migration/*.log
            apps/website/.open-next/asset-audit*.json
            apps/website/.open-next/archive-evidence.json
            apps/website/.open-next/vellira-build.json
            apps/website/.open-next/runtime-contract.json
            apps/website/.open-next/local-runtime-contract.json
            apps/website/.open-next/production-promotion.json
            apps/website/.open-next/cache/
            apps/website/.next/*manifest.json
            apps/website/.next/BUILD_ID
            apps/website/.next/server/**/*manifest*
            apps/website/.next/static/chunks/webpack-*.js

  indexnow:
    name: IndexNow after verified production
    needs: [candidate, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A notification outage must not require redeploying a healthy production.
    # The failed job and its summary remain visible; retry indexnow.yml manually.
    continue-on-error: true
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}

    steps:
      - name: Checkout verified production revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify notification revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Submit production URLs
        id: submit
        run: node scripts/submit-indexnow.mjs

      - name: Record IndexNow outcome
        if: always()
        shell: bash
        env:
          INDEXNOW_OUTCOME: ${{ steps.submit.outcome }}
        run: |
          set -euo pipefail
          printf '### IndexNow notification\n\nRevision: `%s`\n\nOutcome: **%s**\n' \
            "$CANDIDATE_SHA" "${INDEXNOW_OUTCOME:-not-run}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$INDEXNOW_OUTCOME" != "success" ]]; then
            echo '::warning::IndexNow notification did not succeed. Retry Submit URLs to IndexNow manually; do not redeploy production.'
            printf '\nRetry the manual **Submit URLs to IndexNow** workflow. No production redeploy is needed.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
