name: PR 943 Prettier Diagnostic

on:
  push:
    branches:
      - fix/cloudflare-blog-metrics-contract
    paths:
      - 'apps/website/src/blog/metrics.ts'
      - '.github/workflows/pr943-format-diagnostic.yml'

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier apps/website/src/blog/metrics.ts --write
          git diff -- apps/website/src/blog/metrics.ts
