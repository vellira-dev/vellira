name: Exact Prettier formatting 2149 (diagnostic)
on:
  push:
    branches:
      - diagnostic/prettier-2149-exact-20261115
permissions:
  contents: read
jobs:
  exact-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
      - name: Format one target using pinned Prettier
        run: |
          set -euo pipefail
          npm exec --yes --package=prettier@3.9.10 -- prettier --write scripts/ci/dependabot-auto-merge-policy.test.ts
          npm exec --yes --package=prettier@3.9.10 -- prettier --check scripts/ci/dependabot-auto-merge-policy.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-2149-formatted-test
          path: scripts/ci/dependabot-auto-merge-policy.test.ts
          retention-days: 1
