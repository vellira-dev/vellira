# Exact-PR temporary formatter for Account email label design.
name: Account Email Label Canonical Formatter
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/account-email-layout-formatter-1666.yml'
      - 'apps/website/src/product-app/AccountProfilePanel.tsx'
      - 'apps/website/src/product-app/AccountProfilePanel.module.css'
permissions:
  contents: write

jobs:
  format:
    if: ${{ github.repository == 'vellira-dev/vellira' && github.event.pull_request.number == 1666 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/account-email-status-action-layout-20261014' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.2'
      - run: pnpm install --frozen-lockfile
      - name: Canonical formatting + browser-test lint
        run: |
          pnpm exec prettier --write apps/website/src/product-app/AccountProfilePanel.tsx apps/website/src/product-app/AccountProfilePanel.module.css
          pnpm exec prettier --check apps/website/src/product-app/AccountProfilePanel.tsx apps/website/src/product-app/AccountProfilePanel.module.css
          pnpm exec eslint apps/website/scripts/account-profile-preview.mjs apps/website/scripts/account-profile-settings.mjs apps/website/scripts/account-email-verification-preview.mjs
          git diff --check
      - name: Commit only formatted source files
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "vellira-dev/vellira"
          test "${{ github.event.pull_request.number }}" = "1666"
          test "${{ github.event.pull_request.head.ref }}" = "feat/account-email-status-action-layout-20261014"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/website/src/product-app/AccountProfilePanel.tsx apps/website/src/product-app/AccountProfilePanel.module.css
          if ! git diff --cached --quiet; then
            git commit -m 'style(account): canonicalize email verification badge and update action'
            git push origin HEAD:refs/heads/feat/account-email-status-action-layout-20261014
          fi
