name: One-time Fix Textarea Finalizer Slug

on:
  push:
    branches:
      - feat/textarea-launch-component

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/textarea-launch-component
          fetch-depth: 0

      - name: Patch exact native fixture slug
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.github/workflows/one-time-textarea-semantic-completion.yml';
          let source = fs.readFileSync(file, 'utf8');
          const before = "<ComponentDemoStateProvider resetKey='catalog:native-only'>";
          const after = "<ComponentDemoStateProvider resetKey='catalog:nativeonly'>";
          const matches = source.split(before).length - 1;
          if (matches !== 1) {
            throw new Error(`Expected exactly one native-only slug expectation, found ${matches}.`);
          }
          source = source.replace(before, after);
          fs.writeFileSync(file, source);
          NODE

          rm .github/workflows/one-time-fix-textarea-finalizer-slug.yml
          git diff --check

      - name: Commit patched finalizer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): correct Textarea native fixture slug"
          git push origin HEAD:feat/textarea-launch-component
