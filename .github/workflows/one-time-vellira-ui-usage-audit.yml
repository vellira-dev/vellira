name: One-time Vellira UI usage audit

on:
  push:
    branches:
      - ci/852-quick-start-1065-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vellira UI usage audit
        run: pnpm check:vellira-ui-usage:json > vellira-ui-usage.json

      - name: Print audit breakdown
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            summary,
            byRule: ([.findings[].ruleId] | group_by(.) | map({rule: .[0], count: length}) | sort_by(-.count)),
            quickStart: [.findings[] | select(.path == "apps/website/src/sections/home/QuickStart/QuickStart.tsx")]
          }' vellira-ui-usage.json

      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vellira-ui-usage-quick-start-1065
          path: vellira-ui-usage.json
          retention-days: 7
