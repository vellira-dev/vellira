name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  dependabot:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Find matching Dependabot metadata run
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p .dependabot-auto-merge
          gh api --method GET \
            "repos/$REPOSITORY/actions/workflows/dependabot-auto-merge-metadata.yml/runs" \
            -f event=pull_request \
            -f status=success \
            -f head_sha="$EXPECTED_HEAD_SHA" \
            -f per_page=100 \
            > .dependabot-auto-merge/metadata-runs.json
          node <<'NODE'
          const fs = require('node:fs');

          const payload = JSON.parse(
            fs.readFileSync('.dependabot-auto-merge/metadata-runs.json', 'utf8')
          );
          const repository = process.env.REPOSITORY;
          const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
          const runs = Array.isArray(payload.workflow_runs)
            ? payload.workflow_runs
            : [];
          const match = runs.find(
            (run) =>
              run.conclusion === 'success' &&
              run.event === 'pull_request' &&
              run.head_sha === expectedHeadSha &&
              run.head_repository?.full_name === repository
          );

          if (!match) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'found=false\n');
            console.log(
              JSON.stringify({
                found: false,
                headSha: expectedHeadSha,
                reason: 'no matching successful Dependabot metadata run',
              })
            );
            process.exit(0);
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `found=true\nrun_id=${match.id}\n`
          );
          console.log(
            JSON.stringify({
              found: true,
              headSha: expectedHeadSha,
              metadataRunId: match.id,
            })
          );
          NODE

      - name: Download auto-merge decision
        if: steps.metadata.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependabot-auto-merge-decision
          path: .dependabot-auto-merge
          run-id: ${{ steps.metadata.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate immutable auto-merge decision
        if: steps.metadata.outputs.found == 'true'
        id: candidate
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const decision = JSON.parse(
            fs.readFileSync('.dependabot-auto-merge/decision.json', 'utf8')
          );
          const repository = process.env.REPOSITORY;
          const ciHeadSha = process.env.CI_HEAD_SHA ?? '';

          if (decision.schemaVersion !== 1) {
            throw new Error('Unsupported Dependabot auto-merge decision schema');
          }
          if (decision.repository !== repository) {
            throw new Error('Dependabot auto-merge decision repository mismatch');
          }
          if (
            !Number.isSafeInteger(decision.pullRequestNumber) ||
            decision.pullRequestNumber <= 0
          ) {
            throw new Error('Dependabot auto-merge decision PR number is invalid');
          }
          if (!/^[0-9a-f]{40}$/.test(decision.headSha ?? '')) {
            throw new Error('Dependabot auto-merge decision head SHA is invalid');
          }
          if (decision.headSha !== ciHeadSha) {
            throw new Error('Dependabot auto-merge decision does not match successful CI head');
          }
          if (decision.author !== 'dependabot[bot]') {
            throw new Error('Dependabot auto-merge decision author mismatch');
          }
          if (decision.baseRef !== 'main') {
            throw new Error('Dependabot auto-merge decision must target main');
          }

          const eligible =
            decision.eligible === true &&
            decision.updateType === 'version-update:semver-patch';
          if (decision.eligible !== eligible) {
            throw new Error('Dependabot auto-merge eligibility is inconsistent');
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `eligible=${eligible}\n` +
              `pr_number=${decision.pullRequestNumber}\n` +
              `head_sha=${decision.headSha}\n`
          );
          console.log(
            JSON.stringify({
              pullRequestNumber: decision.pullRequestNumber,
              headSha: decision.headSha,
              updateType: decision.updateType,
              eligible,
            })
          );
          NODE

      - name: Revalidate current Dependabot pull request
        if: steps.candidate.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > .dependabot-auto-merge/current-pr.json
          node <<'NODE'
          const fs = require('node:fs');

          const pull = JSON.parse(
            fs.readFileSync('.dependabot-auto-merge/current-pr.json', 'utf8')
          );
          const expectedHeadSha = process.env.EXPECTED_HEAD_SHA;
          const repository = process.env.REPOSITORY;

          if (pull.state !== 'open') {
            throw new Error('Dependabot pull request is no longer open');
          }
          if (pull.draft !== false) {
            throw new Error('Dependabot pull request is a draft');
          }
          if (pull.user?.login !== 'dependabot[bot]') {
            throw new Error('Dependabot pull request author mismatch');
          }
          if (pull.base?.ref !== 'main') {
            throw new Error('Dependabot pull request no longer targets main');
          }
          if (pull.head?.sha !== expectedHeadSha) {
            throw new Error('Dependabot pull request head moved after successful CI');
          }
          if (pull.head?.repo?.full_name !== repository) {
            throw new Error('Dependabot pull request head repository mismatch');
          }
          NODE

      - name: Wait for required pull request checks
        if: steps.candidate.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
        run: |
          set -euo pipefail
          timeout 900 gh pr checks "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --required \
            --watch \
            --fail-fast \
            --interval 10

      - name: Revalidate Dependabot pull request after checks
        if: steps.candidate.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > .dependabot-auto-merge/current-pr-after-checks.json
          node <<'NODE'
          const fs = require('node:fs');

          const pull = JSON.parse(
            fs.readFileSync(
              '.dependabot-auto-merge/current-pr-after-checks.json',
              'utf8'
            )
          );
          const expectedHeadSha = process.env.EXPECTED_HEAD_SHA;
          const repository = process.env.REPOSITORY;

          if (pull.state !== 'open') {
            throw new Error('Dependabot pull request closed while checks were running');
          }
          if (pull.draft !== false) {
            throw new Error('Dependabot pull request became a draft');
          }
          if (pull.user?.login !== 'dependabot[bot]') {
            throw new Error('Dependabot pull request author mismatch');
          }
          if (pull.base?.ref !== 'main') {
            throw new Error('Dependabot pull request no longer targets main');
          }
          if (pull.head?.sha !== expectedHeadSha) {
            throw new Error('Dependabot pull request head moved while checks were running');
          }
          if (pull.head?.repo?.full_name !== repository) {
            throw new Error('Dependabot pull request head repository mismatch');
          }
          NODE

      - name: Create short-lived merge GitHub App token
        if: steps.candidate.outputs.eligible == 'true'
        id: merge-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge patch update after full CI
        if: steps.candidate.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --merge \
            --match-head-commit "$EXPECTED_HEAD_SHA"
