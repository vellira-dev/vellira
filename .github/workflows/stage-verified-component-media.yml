name: Stage Verified Component Demo Media

# This workflow prepares a review PR; it never deploys or publishes posts.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        type: choice
        required: true
        description: Create a review-only PR from the fixed verified demo artifact
        options:
          - DO_NOT_STAGE
          - STAGE_MEDIA_REVIEW_PR
        default: DO_NOT_STAGE

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: stage-verified-component-media-v1
  cancel-in-progress: false

jobs:
  stage:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'STAGE_MEDIA_REVIEW_PR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: '39277740730'
      SOURCE_SHA: '260850f9e5f2fb51e9095b739e63952ce6a7e1cc'
      ASSET_ROOT: apps/website/public/media/component-demos/v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current main with bounded write access
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Unit-test fail-closed media staging
        run: node --test scripts/visual/stage-component-demo-assets.test.mjs

      - name: Require reviewed immutable source run
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')"
          result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion')"
          test "$actual_sha" = "$SOURCE_SHA"
          test "$result" = "success"
          test ! -e "$ASSET_ROOT/index.json"

      - name: Download exact five-component verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          name: component-demo-regression-matrix-260850f9e5f2fb51e9095b739e63952ce6a7e1cc-39277740730
          run-id: 39277740730
          github-token: ${{ github.token }}
          path: .artifacts/social-source

      - name: Verify every source digest and stage website media
        shell: bash
        run: |
          set -euo pipefail
          node scripts/visual/stage-component-demo-assets.mjs \
            .artifacts/social-source "$ASSET_ROOT" "$SOURCE_SHA" "$SOURCE_RUN_ID"
          test "$(find "$ASSET_ROOT" -type f | wc -l | tr -d ' ')" = "16"
          git status --short -- "$ASSET_ROOT"

      - name: Create review PR without publishing
        shell: bash
        run: |
          set -euo pipefail
          branch="marketing/stage-verified-demos-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$ASSET_ROOT"
          git diff --cached --check
          git commit -m "feat(marketing): stage five verified social demos for website"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/social-media-review-pr.md" <<'EOF'
          ## Media provenance
          This PR stages exactly 15 social MP4/GIF/PNG files from the reviewed
          five-scenario Component Demo Capture run 39277740730 at immutable
          SHA 260850f9e5f2fb51e9095b739e63952ce6a7e1cc.
          The staging script independently checks all 15 SHA-256 hashes
          against the five original run-bound manifests and emits index.json.

          ## Review before merge
          - Inspect representative video, GIF and PNG on the PR and after staging deployment.
          - Confirm staging asset URLs under /media/component-demos/v1/.
          - Check Cloudflare production asset size limits and deployment evidence.
          - Merge manually only after green CI and owner approval.
          - Buffer Ideas remain drafts without media until public links work.
          - Do not auto-publish, schedule posts, or change production credentials.

          <!-- vellira-change-intent:v1:verified-demo-media-permanent-hosting -->
          EOF
          gh pr create --base main --head "$branch" \
            --title "feat(marketing): stage five verified demo assets" \
            --body-file "$RUNNER_TEMP/social-media-review-pr.md"
