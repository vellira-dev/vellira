name: Temporary npm lockfile bootstrap
on:
  push:
    branches:
      - 'security/starter-cleanroom-npm-integrity-20261023'
permissions:
  contents: write
jobs:
  locks:
    if: >-
      github.event.head_commit.message == 'ci(security): seed starter integrity locks'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - name: Materialize reproducible public package locks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for project in web native; do
            (
              cd "examples/workspace-starter/$project"
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
              npm ci --no-audit --no-fund
            )
          done
          git diff --check
          unexpected="$(git diff --name-only -- . ':!examples/workspace-starter/web/package-lock.json' ':!examples/workspace-starter/native/package-lock.json')"
          test -z "$unexpected"
          test -f examples/workspace-starter/web/package-lock.json
          test -f examples/workspace-starter/native/package-lock.json
      - name: Commit exactly two generated npm locks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- examples/workspace-starter/web/package-lock.json examples/workspace-starter/native/package-lock.json
          git diff --cached --check
          git commit -m 'chore(security): preserve Starter npm integrity trees'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/security/starter-cleanroom-npm-integrity-20261023"
