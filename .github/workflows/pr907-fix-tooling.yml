name: PR 907 Tooling Fix

on:
  push:
    branches:
      - feat/website-cloudflare-staging
    paths:
      - '.github/workflows/pr907-fix-tooling.yml'

permissions:
  contents: write

jobs:
  fix-tooling:
    name: Fix and validate split React tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/website-cloudflare-staging

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Apply tooling fixes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          test_path = Path('scripts/blog/blog-experience.test.tsx')
          source = test_path.read_text()
          old = '/v1/blog/articles/'
          new = '/api/blog-metrics/articles/'
          replacements = source.count(old)
          if replacements == 0:
              raise SystemExit('Expected stale actor endpoint assertions were not found')
          test_path.write_text(source.replace(old, new))
          print(f'Updated {replacements} actor endpoint references')

          package_path = Path('packages/react-native/package.json')
          package = json.loads(package_path.read_text())
          dev = package.setdefault('devDependencies', {})
          dev['@types/react-dom'] = '^19.2.3'
          dev['react-dom'] = '19.2.3'
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY

          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate tooling fixes
        shell: bash
        run: |
          set -euo pipefail
          pnpm ci:build
          pnpm test:blog
          pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component/generated-test-runtime.test.ts

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/blog/blog-experience.test.tsx packages/react-native/package.json pnpm-lock.yaml
          git diff --cached --check
          git commit -m 'fix(tooling): align split React test contracts'
          git push origin HEAD:feat/website-cloudflare-staging
