version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      storybook:
        patterns:
          - '@storybook/*'
          - storybook
      vite:
        patterns:
          - vite
          - vitest
          - '@vitejs/*'
          - '@vitest/*'
      expo:
        patterns:
          - expo
          - 'expo-*'
          - react-native
          - react-native-*
        # Expo SDKs target a specific React Native line. Keep the grouped
        # ecosystem on patch updates so Dependabot cannot cross that boundary.
        update-types:
          - patch
      next:
        patterns:
          - next
          - '@next/*'
          - eslint-config-next
        # Keep the framework, MDX adapter, and lint config on the same 16.x
        # line while requiring an intentional migration for the next major.
        update-types:
          - minor
          - patch
      linting:
        patterns:
          - eslint
          - '@eslint/*'
          - prettier
          - stylelint
          - '@commitlint/*'
          - lint-staged
          - husky

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
