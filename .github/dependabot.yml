version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # Review routine version updates weekly so public dependencies stay fresh.
    # Grouping below limits PR noise without delaying normal patch/minor updates.
    schedule:
      interval: weekly
    # Bound routine update fan-out so dependency maintenance cannot dominate CI.
    open-pull-requests-limit: 4
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - minor
          - patch
      storybook:
        patterns:
          - '@storybook/*'
          - storybook
        update-types:
          - minor
          - patch
      vite:
        patterns:
          - vite
          - vitest
          - '@vitejs/*'
          - '@vitest/*'
        update-types:
          - minor
          - patch
      expo:
        patterns:
          - expo
          - 'expo-*'
          - '@expo/*'
          - react-native
          - 'react-native-*'
        # Expo SDKs target a specific native line. Only compatible patch
        # updates are routine; minor/major moves require an intentional migration.
        update-types:
          - patch
      next:
        patterns:
          - next
          - '@next/*'
          - eslint-config-next
        # Keep the framework, MDX adapter, and lint config on the same major
        # line while requiring an intentional migration for the next major.
        update-types:
          - minor
          - patch
      typescript:
        patterns:
          - typescript
        update-types:
          - minor
          - patch
      testing:
        patterns:
          - '@testing-library/*'
          - jsdom
        update-types:
          - minor
          - patch
      linting:
        patterns:
          - eslint
          - '@eslint/*'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - typescript-eslint
          - prettier
          - stylelint
          - 'stylelint-*'
          - '@commitlint/*'
          - lint-staged
          - husky
        update-types:
          - minor
          - patch
      tooling:
        patterns:
          - turbo
          - esbuild
          - tsx
          - fast-check
          - wrangler
        update-types:
          - minor
          - patch

    # Framework/toolchain line changes are intentional migrations. Group
    # update-types controls grouping only; ignore rules enforce the boundary.
    # These rules apply to routine version updates. Dependabot security updates
    # remain eligible through GitHub's security-update path.
    ignore:
      # Expo / React Native compatibility boundary.
      - dependency-name: expo
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: 'expo-*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '@expo/*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-native
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: 'react-native-*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '@babel/core'
        update-types:
          - version-update:semver-major
      - dependency-name: '@react-native-async-storage/async-storage'
        # Expo SDK 57 currently owns the 2.2.0 line. AsyncStorage v3 is an
        # intentional native migration tracked in #1350, not routine upkeep.
        update-types:
          - version-update:semver-major

      # Public framework/toolchain major migrations.
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/react'
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/react-dom'
        update-types:
          - version-update:semver-major
      - dependency-name: storybook
        update-types:
          - version-update:semver-major
      - dependency-name: '@storybook/*'
        update-types:
          - version-update:semver-major
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: '@vitejs/*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@vitest/*'
        update-types:
          - version-update:semver-major
      - dependency-name: next
        update-types:
          - version-update:semver-major
      - dependency-name: '@next/*'
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-config-next
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

      # Testing-stack majors are intentional migrations.
      - dependency-name: '@testing-library/*'
        update-types:
          - version-update:semver-major
      - dependency-name: jsdom
        # jsdom 30.1+ currently exposes the DeveloperPanel typography
        # compatibility gap tracked in #1349. Keep routine updates on the
        # current minor until that contract is migrated; security updates are
        # unaffected by update-types ignores.
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

      # Lint/release tooling majors are reviewed as migrations, not routine churn.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: '@eslint/*'
        update-types:
          - version-update:semver-major
      - dependency-name: 'eslint-*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@typescript-eslint/*'
        update-types:
          - version-update:semver-major
      - dependency-name: typescript-eslint
        update-types:
          - version-update:semver-major
      - dependency-name: prettier
        update-types:
          - version-update:semver-major
      - dependency-name: stylelint
        update-types:
          - version-update:semver-major
      - dependency-name: 'stylelint-*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@commitlint/*'
        update-types:
          - version-update:semver-major
      - dependency-name: lint-staged
        update-types:
          - version-update:semver-major
      - dependency-name: husky
        update-types:
          - version-update:semver-major

      # Routine dev tooling stays on the current major. esbuild is pre-1.0, so
      # a semver-minor move is treated as a migration boundary too.
      - dependency-name: turbo
        update-types:
          - version-update:semver-major
      - dependency-name: esbuild
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: tsx
        update-types:
          - version-update:semver-major
      - dependency-name: fast-check
        update-types:
          - version-update:semver-major
      - dependency-name: wrangler
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    # Keep GitHub Actions dependencies fresh on the same weekly cadence.
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
