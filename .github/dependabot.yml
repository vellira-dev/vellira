version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      storybook:
        patterns:
          - '@storybook/*'
          - storybook
      vite:
        patterns:
          - vite
          - vitest
          - '@vitejs/*'
          - '@vitest/*'
      expo:
        patterns:
          - expo
          - 'expo-*'
          - '@expo/*'
          - react-native
          - 'react-native-*'
        # Keep compatible patch updates together. The ignore rules below are
        # the actual boundary enforcement; group update-types only controls
        # which updates are grouped, not which updates Dependabot may create.
        update-types:
          - patch
      next:
        patterns:
          - next
          - '@next/*'
          - eslint-config-next
        # Keep the framework, MDX adapter, and lint config on the same 16.x
        # line while requiring an intentional migration for the next major.
        update-types:
          - minor
          - patch
      linting:
        patterns:
          - eslint
          - '@eslint/*'
          - prettier
          - stylelint
          - '@commitlint/*'
          - lint-staged
          - husky

    # Native framework/toolchain line changes are intentional migrations.
    # Keep routine Dependabot version PRs on the current Expo-compatible line.
    # update-types under ignore applies to version updates; security updates
    # remain eligible for Dependabot security update PRs.
    ignore:
      - dependency-name: expo
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: 'expo-*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '@expo/*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-native
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: 'react-native-*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '@babel/core'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
